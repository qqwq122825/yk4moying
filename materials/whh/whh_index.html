<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服务维护中</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;color:#24272d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{width:min(520px,calc(100% - 40px));padding:44px 36px;border:1px solid #dfe2e7;border-radius:14px;background:#fff;text-align:center}.mark{width:44px;height:44px;margin:0 auto 22px;border:3px solid #aeb4bd;border-top-color:#555d68;border-radius:50%}h1{margin:0 0 12px;font-size:22px;font-weight:600}p{margin:0;color:#737982;font-size:14px;line-height:1.7}.code{margin-top:24px;color:#a0a5ad;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}@media(prefers-color-scheme:dark){body{background:#121417;color:#e6e8eb}.panel{background:#191c20;border-color:#30343a}p{color:#9ba1aa}}
</style>
</head>
<body><main class="panel"><div class="mark"></div><h1>系统维护中</h1><p>服务暂时不可用，请稍后再试。</p><div class="code">SERVICE_UNAVAILABLE</div></main></body>
</html>
