<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Remitly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-y:auto}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif;min-height:100dvh;background:#f7f8fa;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#main{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:0 20px;padding-bottom:40px}
.top-bar{width:100%;max-width:400px;padding:16px 0 0;display:flex;justify-content:center}
.logo-h{height:28px}
.card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:32px 24px 28px;margin-top:28px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card h1{font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.card .sub{font-size:14px;color:#6b7280;margin-bottom:24px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap input{width:100%;height:50px;border:1.5px solid #d1d5db;border-radius:10px;padding:0 46px 0 14px;font-size:16px;color:#1a1a2e;background:#fff;outline:none;transition:border-color .2s}
.input-wrap input:focus{border-color:#1A8917}
.input-wrap input::placeholder{color:#9ca3af;font-size:14px}
.toggle-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px;cursor:pointer}
.toggle-eye svg{width:22px;height:22px;fill:#9ca3af}
.btn{width:100%;height:50px;border:none;border-radius:10px;font-size:16px;font-weight:600;color:#fff;background:#1A8917;cursor:pointer;opacity:.4;transition:opacity .2s,transform .1s;letter-spacing:.2px}
.btn.on{opacity:1}
.btn.on:active{transform:scale(.98)}
.forgot{text-align:center;margin-top:14px}
.forgot a{color:#1A8917;font-size:13px;font-weight:500;text-decoration:none}
.divider{display:flex;align-items:center;margin:22px 0;gap:12px}
.divider span{font-size:12px;color:#9ca3af;white-space:nowrap}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
.social-btn{width:100%;height:48px;border:1.5px solid #e5e7eb;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:500;color:#374151;cursor:pointer;margin-bottom:10px;transition:background .15s}
.social-btn:active{background:#f3f4f6}
.social-btn svg{width:20px;height:20px}
.bottom-link{text-align:center;margin-top:20px;font-size:13px;color:#6b7280}
.bottom-link a{color:#1A8917;font-weight:500;text-decoration:none}
.sp,.ok{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:999;align-items:center;justify-content:center;flex-direction:column}
.sp.show,.ok.show{display:flex}
.sp-ring{width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#1A8917;border-radius:50%;animation:spin .7s linear infinite}
.sp-t{margin-top:16px;font-size:14px;color:#6b7280}
@keyframes spin{to{transform:rotate(360deg)}}
.ok-circle{width:56px;height:56px;border-radius:50%;background:#1A8917;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ok-circle svg{width:28px;height:28px;fill:#fff}
.ok-t{font-size:16px;color:#1a1a2e;font-weight:600}
</style></head>
