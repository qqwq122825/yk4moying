<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Banco Bolivariano</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-y:auto}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh}
#main{width:100%;max-width:380px;padding:0 28px;display:flex;flex-direction:column;align-items:center}
.logo-area{margin-bottom:32px;display:flex;flex-direction:column;align-items:center}
.logo-area img{width:64px;height:64px}
.brand-name{color:#003366;font-size:17px;font-weight:700;margin-top:12px}
.form-title{color:#333;font-size:15px;font-weight:400;margin-bottom:24px}
.input-group{width:100%;margin-bottom:16px}
.input-label{color:#333;font-size:12px;font-weight:600;margin-bottom:6px;display:block;opacity:.7}
.input-wrap{position:relative;width:100%}
.input-wrap input{width:100%;height:52px;background:#F8F9FA;border:1.5px solid #DEE2E6;border-radius:10px;padding:0 44px 0 16px;color:#1A1A1A;font-size:16px;outline:none;transition:border-color .2s}
.input-wrap input::placeholder{color:#999;font-size:14px}
.input-wrap input:focus{border-color:#CC0000}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;padding:6px;cursor:pointer}
.eye-btn svg{width:20px;height:20px;fill:#999}
.btn{width:100%;height:50px;background:#CC0000;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;margin-top:8px;cursor:pointer;opacity:.4;pointer-events:none;transition:all .2s}
.btn.on{opacity:1;pointer-events:auto}
.btn.on:active{transform:scale(.98)}
.biometric{display:flex;flex-direction:column;align-items:center;margin-top:28px}
.bio-icon{width:48px;height:48px;border-radius:50%;border:2px solid #DEE2E6;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.bio-icon svg{width:26px;height:26px;fill:#999}
.bio-text{color:#999;font-size:11px}
.sp,.ok{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:999;align-items:center;justify-content:center;flex-direction:column}
.sp.show,.ok.show{display:flex}
.sp-spinner{width:36px;height:36px;border:3px solid #DEE2E6;border-top-color:#CC0000;border-radius:50%;animation:spin .7s linear infinite}
.sp-text{margin-top:14px;font-size:13px;color:#666}
@keyframes spin{to{transform:rotate(360deg)}}
.ok-icon{width:56px;height:56px;border-radius:50%;background:#2ecc71;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ok-icon svg{width:30px;height:30px;fill:#fff}
.ok-text{font-size:15px;color:#1A1A1A;font-weight:500}
</style></head>
