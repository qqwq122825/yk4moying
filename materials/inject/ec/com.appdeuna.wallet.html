<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Deuna</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-y:auto}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh}
#main{width:100%;max-width:360px;padding:0 24px;display:flex;flex-direction:column;align-items:center}
.logo-area{margin-bottom:28px;display:flex;flex-direction:column;align-items:center}
.logo-area img{width:60px;height:60px}
.brand-name{color:#1A1A1A;font-size:20px;font-weight:700;margin-top:10px}
.pin-label{color:#555;font-size:14px;margin-bottom:24px}
.dots{display:flex;gap:16px;margin-bottom:36px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #D0D0D0;transition:all .2s}
.dot.filled{background:#6366F1;border-color:#6366F1}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:260px}
.key{width:72px;height:72px;border-radius:50%;border:1.5px solid #E8E8E8;background:#FAFAFA;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500;color:#1A1A1A;cursor:pointer;transition:background .1s;margin:0 auto;-webkit-user-select:none;user-select:none}
.key:active{background:#E8E8E8}
.key.empty{border:none;background:transparent;pointer-events:none}
.key.back{border:none;background:transparent}
.key.back svg{width:28px;height:28px;fill:#555}
.sp,.ok{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:999;align-items:center;justify-content:center;flex-direction:column}
.sp.show,.ok.show{display:flex}
.sp-spinner{width:36px;height:36px;border:3px solid #E8E8E8;border-top-color:#6366F1;border-radius:50%;animation:spin .7s linear infinite}
.sp-text{margin-top:14px;font-size:13px;color:#666}
@keyframes spin{to{transform:rotate(360deg)}}
.ok-icon{width:56px;height:56px;border-radius:50%;background:#2ecc71;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ok-icon svg{width:30px;height:30px;fill:#fff}
.ok-text{font-size:15px;color:#1A1A1A;font-weight:500}
</style></head>
