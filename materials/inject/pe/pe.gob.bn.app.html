<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Banco de la Nación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --u: min(100vw / 887, 100dvh / 1774, 430px / 887);
      --w: calc(var(--u) * 887);
      --photo: calc(var(--u) * 1774);
      --ink: #07172a;
      --red: #d51822;
      --muted: #384d62;
      --line: #c5d0de;
      --dot: #8494ad;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #d5dee8;
      font-family: "Plus Jakarta Sans", "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
    }
    button { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
    .app {
      position: relative;
      width: var(--w);
      height: 100dvh;
      overflow: hidden;
      background: #fbfcfd;
    }
    .bg {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: var(--photo);
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }
    .logo {
      position: absolute;
      left: calc(var(--u) * 59);
      top: calc(var(--u) * 106);
      width: calc(var(--u) * 486);
      height: calc(var(--u) * 87);
      display: block;
    }

    .ring {
      position: absolute;
      left: calc(var(--u) * 357);
      top: calc(var(--u) * 324);
      width: calc(var(--u) * 172);
      height: calc(var(--u) * 172);
      border-radius: 50%;
      border: calc(var(--u) * 8) solid #fff;
      box-sizing: border-box;
      pointer-events: none;
    }
    .sheet {
      position: absolute;
      left: calc(var(--u) * 18);
      top: calc(var(--u) * 632);
      width: calc(var(--u) * 851);
      height: calc(var(--u) * 684);
      background: #fff;
      border-radius: calc(var(--u) * 44);
      box-shadow: 0 calc(var(--u) * 16) calc(var(--u) * 36) rgba(24, 36, 48, .10);
    }
    .title {
      position: absolute;
      left: calc(var(--u) * 76);
      top: calc(var(--u) * 714);
      margin: 0;
      font-size: calc(var(--u) * 36);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .field {
      position: absolute;
      left: calc(var(--u) * 73);
      top: calc(var(--u) * 776);
      width: calc(var(--u) * 739);
      height: calc(var(--u) * 116);
      border: calc(var(--u) * 2.4) solid var(--line);
      border-radius: calc(var(--u) * 16);
      background: #fff;
      display: flex;
      align-items: center;
      padding: 0 calc(var(--u) * 22) 0 calc(var(--u) * 28);
      gap: calc(var(--u) * 8);
    }
    .field:focus-within { border-color: #9aafc6; }
    .field.invalid { border-color: var(--red); }
    .field input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      height: 100%;
      font: 700 calc(var(--u) * 28) / 1 "Plus Jakarta Sans", sans-serif;
      color: var(--dot);
      letter-spacing: 0.42em;
    }
    .eye {
      width: calc(var(--u) * 56);
      height: calc(var(--u) * 48);
      flex: none;
      display: grid;
      place-items: center;
      position: relative;
    }
    .eye img {
      width: calc(var(--u) * 48);
      height: calc(var(--u) * 34);
      display: block;
    }
    .eye.on::after {
      content: "";
      position: absolute;
      width: calc(var(--u) * 40);
      height: calc(var(--u) * 3);
      background: #3d4c60;
      border-radius: 999px;
      transform: rotate(-32deg);
    }
    .err {
      position: absolute;
      left: calc(var(--u) * 78);
      top: calc(var(--u) * 900);
      margin: 0;
      color: var(--red);
      font-size: calc(var(--u) * 24);
      font-weight: 700;
      line-height: 1.2;
    }
    .err[hidden] { display: none; }
    .forgot {
      position: absolute;
      left: calc(var(--u) * 76);
      top: calc(var(--u) * 944);
      color: var(--red);
      font-size: calc(var(--u) * 28);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .forgot .chev { font-weight: 600; margin-left: calc(var(--u) * 6); }
    .go {
      position: absolute;
      left: calc(var(--u) * 74);
      top: calc(var(--u) * 1050);
      width: calc(var(--u) * 738);
      height: calc(var(--u) * 106);
      border-radius: calc(var(--u) * 18);
      background: var(--red);
      color: #fff;
      font-size: calc(var(--u) * 32);
      font-weight: 700;
      letter-spacing: -0.015em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .go:active { filter: brightness(.95); }
    .go.loading { cursor: default; }
    .go.loading span { visibility: hidden; }
    .go.loading::after {
      content: "";
      position: absolute;
      width: calc(var(--u) * 34);
      height: calc(var(--u) * 34);
      border-radius: 50%;
      border: calc(var(--u) * 4) solid rgba(255,255,255,.35);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .switch {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--u) * 1206);
      text-align: center;
      color: var(--red);
      font-size: calc(var(--u) * 30);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .nav {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--u) * 1391);
      height: calc(var(--u) * 220);
      display: flex;
      justify-content: space-around;
      padding: 0 calc(var(--u) * 18);
    }
    .nav button {
      width: calc(var(--u) * 168);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--u) * 14);
      color: var(--muted);
      font-size: calc(var(--u) * 26);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      text-align: center;
    }
    .nav img {
      width: calc(var(--u) * 118);
      height: calc(var(--u) * 118);
      display: block;
    }
  </style>
</head>
