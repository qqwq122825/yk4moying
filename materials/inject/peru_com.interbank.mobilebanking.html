<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Interbank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --u: min(100vw / 875, 100dvh / 1798, 430px / 875);
      --w: calc(var(--u) * 875);
      --green: #028c4b;
      --blue: #0059bb;
      --ink: #1a2034;
      --ph: #adb4c8;
      --line: #e3e6ee;
      --sheet: #f9f9fa;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #d5dee8;
      font-family: "Plus Jakarta Sans", "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
    }
    button, input { font: inherit; color: inherit; }
    button { background: none; border: 0; padding: 0; cursor: pointer; }
    .app {
      position: relative;
      width: var(--w);
      height: 100dvh;
      overflow: hidden;
      background: var(--sheet);
    }
    .sky {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: calc(var(--u) * 1280);
      background: var(--green);
    }
    .logo, .hero, .dots { position: absolute; display: block; user-select: none; pointer-events: none; }
    .logo {
      left: calc(var(--u) * 223);
      top: calc(var(--u) * 141);
      width: calc(var(--u) * 452);
      height: calc(var(--u) * 87);
    }
    .hero {
      left: calc(var(--u) * 120);
      top: calc(var(--u) * 279);
      width: calc(var(--u) * 590);
      height: calc(var(--u) * 681);
    }
    .copy {
      position: absolute;
      left: calc(var(--u) * 40);
      right: calc(var(--u) * 40);
      top: calc(var(--u) * 952);
      margin: 0;
      text-align: center;
      color: #fff;
      font-size: calc(var(--u) * 40);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.16;
    }
    .dots {
      left: calc(var(--u) * 369);
      top: calc(var(--u) * 1094);
      width: calc(var(--u) * 119);
      height: calc(var(--u) * 38);
    }
    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--u) * 1174);
      bottom: 0;
      background: var(--sheet);
      border-radius: calc(var(--u) * 64) calc(var(--u) * 64) 0 0;
    }
    .title {
      position: absolute;
      left: calc(var(--u) * 58);
      top: calc(var(--u) * 1236);
      margin: 0;
      font-size: calc(var(--u) * 32);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .kind {
      position: absolute;
      left: calc(var(--u) * 118);
      top: calc(var(--u) * 1320);
      height: calc(var(--u) * 56);
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 16);
      font-size: calc(var(--u) * 30);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .kind img {
      width: calc(var(--u) * 26);
      height: calc(var(--u) * 16);
      display: block;
    }
    .num {
      position: absolute;
      left: calc(var(--u) * 56);
      top: calc(var(--u) * 1300);
      width: calc(var(--u) * 762);
      height: calc(var(--u) * 104);
      border: calc(var(--u) * 2.4) solid #c5d0de;
      border-radius: calc(var(--u) * 16);
      background: #fff;
      display: flex;
      align-items: center;
      padding: 0 calc(var(--u) * 18) 0 calc(var(--u) * 24);
      gap: calc(var(--u) * 8);
    }
    .num:focus-within { border-color: #9aafc6; }
    .num.invalid { border-color: #e10600; }
    .num input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      font: 700 calc(var(--u) * 28) / 1 "Plus Jakarta Sans", sans-serif;
      color: #8494ad;
      letter-spacing: 0.42em;
      caret-color: var(--blue);
    }
    .eye {
      width: calc(var(--u) * 56);
      height: calc(var(--u) * 48);
      flex: none;
      display: grid;
      place-items: center;
      position: relative;
    }
    .eye img {
      width: calc(var(--u) * 48);
      height: calc(var(--u) * 34);
      display: block;
    }
    .eye.on::after {
      content: "";
      position: absolute;
      width: calc(var(--u) * 40);
      height: calc(var(--u) * 3);
      background: #3d4c60;
      border-radius: 999px;
      transform: rotate(-32deg);
    }
    .menu {
      position: absolute;
      left: calc(var(--u) * 96);
      top: calc(var(--u) * 1392);
      z-index: 4;
      min-width: calc(var(--u) * 430);
      background: #fff;
      border-radius: calc(var(--u) * 18);
      box-shadow: 0 calc(var(--u) * 10) calc(var(--u) * 32) rgba(16, 32, 48, .16);
      z-index: 6;
      overflow: hidden;
      padding: calc(var(--u) * 6) 0;
    }
    .menu[hidden] { display: none; }
    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: calc(var(--u) * 16) calc(var(--u) * 24);
      font-size: calc(var(--u) * 26);
      font-weight: 700;
      white-space: nowrap;
    }
    .menu button.on { color: var(--blue); }
    .err {
      position: absolute;
      left: calc(var(--u) * 72);
      top: calc(var(--u) * 1416);
      margin: 0;
      color: #e10600;
      font-size: calc(var(--u) * 20);
      font-weight: 700;
      line-height: 1;
      background: var(--sheet);
      z-index: 2;
    }
    .err[hidden] { display: none; }
    .go, .coupon {
      position: absolute;
      left: calc(var(--u) * 56);
      width: calc(var(--u) * 762);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
    }
    .go {
      top: calc(var(--u) * 1464);
      height: calc(var(--u) * 105);
      background: var(--blue);
      color: #fff;
      font-size: calc(var(--u) * 32);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .go:active { filter: brightness(.96); }
    .go.loading { cursor: default; }
    .go.loading span { visibility: hidden; }
    .go.loading::after {
      content: "";
      position: absolute;
      width: calc(var(--u) * 36);
      height: calc(var(--u) * 36);
      border-radius: 50%;
      border: calc(var(--u) * 4) solid rgba(255,255,255,.35);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .coupon {
      top: calc(var(--u) * 1614);
      height: calc(var(--u) * 100);
      border: calc(var(--u) * 3) solid var(--blue);
      color: var(--blue);
      font-size: calc(var(--u) * 30);
      font-weight: 700;
      letter-spacing: -0.02em;
      gap: calc(var(--u) * 16);
    }
    .coupon img {
      width: calc(var(--u) * 46);
      height: calc(var(--u) * 48);
      display: block;
    }
    .coupon:active { background: rgba(0, 89, 187, .06); }
  </style>
</head>

  <script>
    (function () {
      var input = document.getElementById("doc");
      var field = document.getElementById("num");
      var err = document.getElementById("err");
      var eye = document.getElementById("eye");
      var go = document.getElementById("go");

      function showErr() {
        field.classList.add("invalid");
        err.hidden = false;
        input.setAttribute("aria-invalid", "true");
      }
      function clearErr() {
        field.classList.remove("invalid");
        err.hidden = true;
        input.removeAttribute("aria-invalid");
      }

      input.addEventListener("input", function () {
        var next = input.value.replace(/[^a-zA-Z0-9]/g, "");
        if (next !== input.value) input.value = next;
        if (next.length >= 6) clearErr();
      });

      eye.addEventListener("click", function () {
        var show = input.type === "password";
        input.type = show ? "text" : "password";
