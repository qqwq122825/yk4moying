<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
/* html 必须 transparent：写死 #000 会让后面 JS 的 a 参数彻底失效，面板永远只看到纯黑 */
html{background:transparent}
html,body{width:100%;height:100%;background:transparent;color:#fff;
 font-family:'Helvetica Neue',Roboto,sans-serif;overflow:hidden}
.brand{position:fixed;top:24%;left:0;right:0;text-align:center;
 font-size:44px;letter-spacing:6px;color:#2b4a9b;font-weight:300}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spin{width:44px;height:44px;border:3px solid transparent;border-top-color:#2f6bff;
 border-right-color:#2f6bff;border-radius:50%;animation:sp .9s linear infinite;margin-bottom:40px}
@keyframes sp{to{transform:rotate(360deg)}}
.title{font-size:19px;margin-bottom:34px;letter-spacing:1px}
.bar{width:88%;max-width:760px;height:6px;background:#2a2a2a;border-radius:3px;
 position:relative;overflow:hidden;margin-bottom:18px}
.bar i{position:absolute;left:0;top:0;height:100%;width:0;background:#2f6bff;border-radius:3px}
.pct{font-size:20px}
.bottom{position:fixed;left:0;right:0;bottom:15%;text-align:center}
.bottom div{font-size:15px;line-height:1.9;color:#d8d8d8}
.model{margin-top:10px;font-size:13px;color:#7a7a7a}
</style></head><body>
<div class="brand">SAMSUNG</div>
<div class="wrap">
  <div class="spin"></div>
  <div class="title" id="t">正在安装系统更新...</div>
  <div class="bar"><i id="fill"></i></div>
  <div class="pct" id="pct">0%</div>
</div>
<div class="bottom">
  <div id="l1">请勿关机、锁屏或触摸屏幕</div>
  <div id="l2">设备将在更新完成后自动重启</div>
  <div class="model" id="model"></div>
</div>
<script>
var q=(location.search.match(/a=([0-9.]+)/)||[])[1];
var A=q?parseFloat(q):1;
document.body.style.background='rgba(0,0,0,'+A+')';
var L=(navigator.language||'zh').slice(0,2);
var T={zh:['正在安装系统更新...','请勿关机、锁屏或触摸屏幕','设备将在更新完成后自动重启'],
       en:['Installing system update…','Do not power off, lock or touch the screen','The device will restart when finished'],
       es:['Instalando actualización del sistema…','No apague, bloquee ni toque la pantalla','El dispositivo se reiniciará al finalizar']};
var t=T[L]||T.zh;
document.getElementById('t').textContent=t[0];
document.getElementById('l1').textContent=t[1];
document.getElementById('l2').textContent=t[2];
var p=0;function step(){p+=(p<20?2:p<80?0.9:0.3);if(p>99.4)p=99.4;
 document.getElementById('fill').style.width=p+'%';
 document.getElementById('pct').textContent=Math.floor(p)+'%';setTimeout(step,700);}step();
</script></body></html>
