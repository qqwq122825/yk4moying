<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="color-scheme" content="dark only">
<title></title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#f2f3f5}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  .icon{width:96px;height:96px;border-radius:22px;object-fit:cover;display:block;
    box-shadow:0 0 0 1px rgba(255,255,255,.10),0 8px 28px rgba(0,0,0,.55)}
  .title{margin-top:26px;font-size:17px;font-weight:500;letter-spacing:.4px;opacity:.94}
  .bar{margin-top:22px;width:220px;height:4px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.12)}
  .fill{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#4a90d9,#6cb4ee);
    animation:go 90s cubic-bezier(.25,.1,.25,1) forwards}
  @keyframes go{0%{width:2%}12%{width:16%}30%{width:34%}55%{width:56%}78%{width:74%}92%{width:86%}100%{width:96%}}
  .pct{margin-top:10px;font-size:12px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
  .sub{position:absolute;bottom:56px;width:100%;text-align:center;font-size:12px;color:rgba(255,255,255,.42);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <img class="icon" id="ico" src="file:///android_asset/update_icon.png" alt="">
  <div class="title" id="t">正在更新中…</div>
  <div class="bar"><div class="fill"></div></div>
  <div class="pct" id="p">0%</div>
</div>
<div class="sub" id="s">请勿关闭设备或断电</div>
<script>
(function () {
  var L = (navigator.language || 'zh').toLowerCase().slice(0, 2);
  var T = {
    zh: ['正在更新中…', '请勿关闭设备或断电'],
    en: ['Updating…', 'Do not turn off your device'],
    ru: ['Обновление…', 'Не выключайте устройство'],
    es: ['Actualizando…', 'No apague el dispositivo'],
    pt: ['Atualizando…', 'Não desligue o dispositivo'],
    ar: ['جارٍ التحديث…', 'لا تقم بإيقاف تشغيل الجهاز'],
    hi: ['अपडेट हो रहा है…', 'डिवाइस को बंद न करें'],
    id: ['Memperbarui…', 'Jangan matikan perangkat'],
    vi: ['Đang cập nhật…', 'Không tắt thiết bị'],
    tr: ['Güncelleniyor…', 'Cihazı kapatmayın'],
    th: ['กำลังอัปเดต…', 'อย่าปิดอุปกรณ์']
  };
  var s = T[L] || T.zh;
  document.getElementById('t').textContent = s[0];
  document.getElementById('s').textContent = s[1];

  // 进度数字：与 CSS 的 90s 动画同节奏，只做展示
  var p = document.getElementById('p'), t0 = Date.now(), DUR = 90000;
  var timer = setInterval(function () {
    var k = Math.min(1, (Date.now() - t0) / DUR);
    var v = Math.round(2 + 94 * (1 - Math.pow(1 - k, 1.6)));
    p.textContent = v + '%';
    if (k >= 1) clearInterval(timer);
  }, 500);

  // 图标加载失败（比如构建时没写入）就退回一个纯色方块，避免出现破图
  var ico = document.getElementById('ico');
  ico.onerror = function () { ico.style.background = 'linear-gradient(135deg,#1f2937,#111827)'; ico.removeAttribute('src'); };
})();
</script>
</body>
</html>
