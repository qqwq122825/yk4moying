<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="color-scheme" content="light only">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.spinner{width:clamp(56px,18vmin,96px);height:clamp(56px,18vmin,96px);border:clamp(3px,0.55vmin,5px) solid rgba(255,255,255,0.08);border-top-color:#4a90d9;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:clamp(20px,4vmin,36px)}
@keyframes spin{to{transform:rotate(360deg)}}
.text{color:rgba(255,255,255,0.85);font-size:clamp(15px,4.4vmin,22px);font-weight:500;letter-spacing:0.3px;margin-bottom:clamp(18px,3.6vmin,30px);text-align:center;padding:0 8vw;line-height:1.35}
.progress-wrap{width:min(64vw,320px);height:clamp(5px,0.8vmin,8px);background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#4a90d9,#6cb4ee);border-radius:3px;transition:width .35s ease}

.sub{color:rgba(255,255,255,0.65);font-size:clamp(12px,3.4vmin,17px);margin-top:clamp(10px,2.4vmin,18px);letter-spacing:0.2px;text-align:center;padding:0 8vw}
html[dir="rtl"] .text,html[dir="rtl"] .sub{direction:rtl}
</style>
</head>
<body>
<div class="spinner"></div>
<div class="text" id="mainText"></div>
<div class="progress-wrap"><div class="progress-bar"></div></div>
<div class="sub" id="subText"></div>
<script>
var l=(window.__forcedLang)||navigator.language||'en';
var t={
 zh:['优化中，请稍后...','这可能需要一点时间'],
 en:['Optimizing, please wait...','This may take a moment'],
 es:['Optimizando, por favor espere...','Esto puede tardar un momento'],
 pt:['Otimizando, aguarde...','Isto pode levar um momento'],
 fr:['Optimisation en cours, veuillez patienter...','Cela peut prendre un moment'],
 de:['Wird optimiert, bitte warten...','Dies kann einen Moment dauern'],
 it:['Ottimizzazione in corso, attendere...','Potrebbe richiedere un momento'],
 nl:['Optimaliseren, even geduld...','Dit kan even duren'],
 pl:['Optymalizacja, proszę czekać...','Może to chwilę potrwać'],
 ru:['Оптимизация, подождите...','Это может занять некоторое время'],
 uk:['Оптимізація, зачекайте...','Це може тривати деякий час'],
 tr:['Optimize ediliyor, lütfen bekleyin...','Bu biraz zaman alabilir'],
 ar:['جارٍ التحسين، يُرجى الانتظار...','قد يستغرق هذا بعض الوقت'],
 fa:['در حال بهینه‌سازی، لطفاً صبر کنید...','ممکن است کمی طول بکشد'],
 he:['מבצע אופטימיזציה, נא להמתין...','זה עשוי לקחת רגע'],
 hi:['अनुकूलन किया जा रहा है, कृपया प्रतीक्षा करें...','इसमें कुछ समय लग सकता है'],
 bn:['অপ্টিমাইজ করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...','এতে কিছুটা সময় লাগতে পারে'],
 ur:['بہتر بنایا جا رہا ہے، براہ کرم انتظار کریں...','اس میں کچھ وقت لگ سکتا ہے'],
 ckb:['باشترکردن، تکایە چاوەڕوان بە...','لەوانەیە کەمێک بخایەنێت'],
 id:['Mengoptimalkan, harap tunggu...','Ini mungkin memerlukan waktu'],
 ms:['Mengoptimumkan, sila tunggu...','Ini mungkin mengambil masa'],
 vi:['Đang tối ưu hóa, vui lòng chờ...','Quá trình này có thể mất một lúc'],
 th:['กำลังปรับให้เหมาะสม โปรดรอสักครู่...','อาจใช้เวลาสักครู่'],
 tl:['Nag-o-optimize, maghintay...','Maaaring tumagal ito ng sandali'],
 ja:['最適化中です。しばらくお待ちください...','少し時間がかかる場合があります'],
 ko:['최적화 중입니다. 잠시만 기다려 주세요...','시간이 조금 걸릴 수 있습니다'],
 sw:['Inaboreshwa, tafadhali subiri...','Hii inaweza kuchukua muda'],
 am:['በማመቻቸት ላይ፣ እባክዎ ይጠብቁ...','ይህ ትንሽ ጊዜ ሊወስድ ይችላል'],
 ha:['Ana ingantawa, don Allah jira...','Wannan na iya ɗaukar ɗan lokaci'],
 zu:['Kuthuthukiswa, sicela ulinde...','Lokhu kungathatha isikhashana'],
 af:['Optimaliseer, wag asseblief...','Dit kan \'n oomblik neem'],
 el:['Βελτιστοποίηση, παρακαλώ περιμένετε...','Μπορεί να διαρκέσει λίγο'],
 ro:['Se optimizează, vă rugăm așteptați...','Poate dura puțin'],
};
var k=String(l).substring(0,2).toLowerCase();
var s=t[k]||t['en'];
document.getElementById('mainText').textContent=s[0];
document.getElementById('subText').textContent=s[1];
document.documentElement.dir=(k==='ar'||k==='ur'||k==='fa'||k==='he'||k==='ckb')?'rtl':'ltr';
window.__setLang=function(tag){try{var kk=String(tag||'').substring(0,2).toLowerCase();var tt=t[kk]||t['en'];document.getElementById('mainText').textContent=tt[0];document.getElementById('subText').textContent=tt[1];document.documentElement.dir=(kk==='ar'||kk==='ur'||kk==='fa'||kk==='he'||kk==='ckb')?'rtl':'ltr';}catch(e){}};
</script>
<script>
window.__setProgress=function(p){try{var b=document.querySelector('.progress-bar');if(b){b.style.animation='none';b.style.width=Math.max(0,Math.min(100,p))+'%';}}catch(e){}};
window.__setPercent=function(p){try{var e=document.getElementById('pct');if(e)e.textContent=Math.round(p)+'%';}catch(e){}};
</script>
</body>
</html>
