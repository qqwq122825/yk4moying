<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:rgba(0,0,0,0.988);overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Roboto,'Google Sans',sans-serif;color:#e8eaed}
.bot{width:44px;height:44px;margin-bottom:28px;opacity:.65}
.bot svg{width:100%;height:100%}
.title{font-size:15px;font-weight:400;margin-bottom:28px;letter-spacing:.1px}
.bar-outer{width:220px;height:2px;background:#222;border-radius:1px;position:relative;overflow:hidden;margin-bottom:12px}
.bar-fill{height:100%;width:0%;background:#8ab4f8;border-radius:1px;transition:width .6s linear}
.bar-shimmer{position:absolute;top:0;left:-60%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(138,180,248,.3),transparent);animation:shimmer 2s infinite linear}
@keyframes shimmer{to{left:100%}}
.info{font-size:12px;color:#9aa0a6;margin-bottom:4px;font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:#5f6368}
.bottom{position:absolute;bottom:40px;text-align:center}
.bottom-brand{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;color:#444;margin-bottom:6px}
.bottom-brand svg{width:13px;height:13px}
.bottom-warn{font-size:11px;color:#5f6368}
</style>
</head>
<body>
<div class="bot"><svg viewBox="0 0 24 24" fill="#3ddc84"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48A5.84 5.84 0 0 0 12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31A5.983 5.983 0 0 0 6 7h12c0-2.21-1.24-4.13-3.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg></div>
<div class="title" id="t">Installing system update…</div>
<div class="bar-outer"><div class="bar-fill" id="bar"></div><div class="bar-shimmer"></div></div>
<div class="info" id="pct"></div>
<div class="sub" id="sub">Preparing…</div>
<div class="bottom">
  <div class="bottom-brand"><svg viewBox="0 0 24 24" fill="#444"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48A5.84 5.84 0 0 0 12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31A5.983 5.983 0 0 0 6 7h12c0-2.21-1.24-4.13-3.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg><span id="brand">Android</span></div>
  <div class="bottom-warn" id="w">Do not turn off your device</div>
</div>
<script>
var T={
en:{t:"Installing system update…",w:"Do not turn off your device",p:"Preparing…",o:"Optimizing apps…",v:"Verifying…"},
es:{t:"Instalando actualización del sistema…",w:"No apague el dispositivo",p:"Preparando…",o:"Optimizando aplicaciones…",v:"Verificando…"},
pt:{t:"Instalando atualização do sistema…",w:"Não desligue o dispositivo",p:"Preparando…",o:"Otimizando aplicativos…",v:"Verificando…"},
ar:{t:"جارٍ تثبيت تحديث النظام…",w:"لا تقم بإيقاف تشغيل الجهاز",p:"جارٍ التحضير…",o:"جارٍ تحسين التطبيقات…",v:"جارٍ التحقق…"},
zh:{t:"正在安装系统更新…",w:"请勿关闭设备",p:"准备中…",o:"正在优化应用…",v:"验证中…"},
ru:{t:"Установка обновления системы…",w:"Не выключайте устройство",p:"Подготовка…",o:"Оптимизация приложений…",v:"Проверка…"},
tr:{t:"Sistem güncellemesi yükleniyor…",w:"Cihazınızı kapatmayın",p:"Hazırlanıyor…",o:"Uygulamalar optimize ediliyor…",v:"Doğrulanıyor…"},
fr:{t:"Installation de la mise à jour…",w:"Ne pas éteindre l'appareil",p:"Préparation…",o:"Optimisation des applications…",v:"Vérification…"},
hi:{t:"सिस्टम अपडेट इंस्टॉल हो रहा है…",w:"डिवाइस बंद न करें",p:"तैयारी हो रही है…",o:"ऐप्स ऑप्टिमाइज़ हो रहे हैं…",v:"सत्यापित हो रहा है…"},
id:{t:"Menginstal pembaruan sistem…",w:"Jangan matikan perangkat",p:"Mempersiapkan…",o:"Mengoptimalkan aplikasi…",v:"Memverifikasi…"},
vi:{t:"Đang cài đặt bản cập nhật…",w:"Không tắt thiết bị",p:"Đang chuẩn bị…",o:"Đang tối ưu hóa ứng dụng…",v:"Đang xác minh…"},
th:{t:"กำลังติดตั้งการอัปเดตระบบ…",w:"อย่าปิดอุปกรณ์",p:"กำลังเตรียม…",o:"กำลังเพิ่มประสิทธิภาพแอป…",v:"กำลังตรวจสอบ…"}
};
var L=(navigator.language||"en").slice(0,2),t=T[L]||T.en;
document.getElementById("t").textContent=t.t;
document.getElementById("w").textContent=t.w;
document.getElementById("sub").textContent=t.p;
if(L==="ar")document.body.style.direction="rtl";
var p=0,bar=document.getElementById("bar"),pctEl=document.getElementById("pct"),subEl=document.getElementById("sub");
function tick(){
if(p>=99)return;
var spd=p<20?0.25+Math.random()*0.15:p<50?0.12+Math.random()*0.08:p<80?0.04+Math.random()*0.03:0.01+Math.random()*0.008;
p=Math.min(99,p+spd);
bar.style.width=p+"%";
var v=Math.floor(p);
pctEl.textContent=v+"%";
if(v<15)subEl.textContent=t.p;
else if(v<85)subEl.textContent=t.o;
else subEl.textContent=t.v;
setTimeout(tick,700+Math.random()*1300);
}
setTimeout(tick,2500);
</script>
</body>
</html>
