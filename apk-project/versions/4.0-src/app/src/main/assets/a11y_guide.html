<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>开启无障碍服务</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;min-height:100%;max-width:100%;overflow-x:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Roboto,sans-serif;
    background:#eef2fb;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px 14px;color:#1a1a1a;overflow-x:hidden
  }
  /* 宽度自适应：容器窄就窄、宽就宽，最多 420px，最小不小于容器的 92% */
  .card{
    width:100%;max-width:420px;min-width:min(92vw,280px);
    background:#fff;border-radius:28px;
    padding:clamp(20px,5vw,34px) clamp(16px,5vw,24px) clamp(18px,4vw,26px);
    box-shadow:0 18px 50px rgba(60,90,180,.12)
  }
  h1{font-size:clamp(18px,5.2vw,23px);font-weight:700;text-align:center;letter-spacing:.5px}
  .desc{font-size:clamp(12px,3.6vw,14px);color:#7a7f8c;text-align:center;line-height:1.75;margin-top:14px}
  .approw{
    display:flex;align-items:center;justify-content:space-between;
    margin:30px 6px 0
  }
  .approw .left{display:flex;align-items:center;gap:14px}
  .appicon{
    width:56px;height:56px;border-radius:16px;object-fit:cover;
    box-shadow:0 6px 16px rgba(240,60,80,.25)
  }
  /* 开关：未激活=灰；激活=蓝。未激活时按节奏"灰→蓝→灰"循环提示。 */
  .toggle{
    width:70px;height:38px;border-radius:19px;background:#c9ced6;position:relative;
    flex:0 0 70px;min-width:70px;box-sizing:border-box;
    transition:background-color .38s cubic-bezier(.4,0,.2,1)
  }
  .toggle i{
    position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);
    transition:transform .38s cubic-bezier(.4,0,.2,1)
  }
  .toggle.on{background:#2f6bff}
  .toggle.on i{transform:translateX(32px)}

  /* 节奏提示：一轮 1650ms —— 开150ms → 关150ms → 开150ms → 关1200ms，循环 */
  .toggle.hint{animation:hintColor 1.65s ease-in-out infinite}
  .toggle.hint i{animation:hintKnob 1.65s cubic-bezier(.4,0,.2,1) infinite}
  /* 150/1650=9.1%  300/1650=18.2%  450/1650=27.3%  之后 1200ms 保持关闭 */
  @keyframes hintColor{
    0%    {background:#2f6bff}   /* 开 0~150ms */
    9.1%  {background:#c9ced6}   /* 关 150~300ms */
    18.2% {background:#2f6bff}   /* 开 300~450ms */
    27.3% {background:#c9ced6}   /* 关 450~1650ms（1200ms 停顿） */
    100%  {background:#c9ced6}
  }
  @keyframes hintKnob{
    0%    {transform:translateX(32px)}
    9.1%  {transform:translateX(0)}
    18.2% {transform:translateX(32px)}
    27.3%,100% {transform:translateX(0)}
  }
  /* 开关被点过（或真实已开启）就停止提示节奏 */
  .toggle.on{animation:none}
  .toggle.on i{animation:none}
  .steps{display:flex;align-items:flex-start;justify-content:space-between;margin:30px 2px 0}
  .step{display:flex;flex-direction:column;align-items:center;gap:8px;width:30%}
  .sic{
    width:46px;height:46px;border-radius:14px;background:#eef3ff;
    display:flex;align-items:center;justify-content:center
  }
  .sic svg{width:22px;height:22px;fill:#2f6bff}
  .slabel{font-size:13px;color:#6b7280}
  .arrow{flex:1;display:flex;justify-content:center;padding-top:22px;color:#c6cddb;font-size:14px}
  .tip{
    margin-top:22px;background:#f1f5ff;border-radius:14px;padding:12px 14px;
    display:flex;gap:10px;font-size:clamp(11.5px,3.4vw,13px);line-height:1.7;color:#4a5568
  }
  .tip .i{
    flex:0 0 18px;height:18px;border-radius:50%;border:1.5px solid #8aa4d8;color:#8aa4d8;
    font-size:12px;line-height:15px;text-align:center;margin-top:2px
  }
  .waiting{font-size:12.5px;color:#9aa3b2;text-align:center;margin-top:22px}
  .btn{
    display:block;width:100%;margin-top:14px;padding:clamp(14px,4vw,17px) 0;border:none;border-radius:16px;
    background:linear-gradient(135deg,#3b74ff,#2f6bff);color:#fff;font-size:17px;font-weight:600;
    letter-spacing:.5px
  }
  .btn:active{opacity:.9}
  /* 被壳塞进窄条时：卡片贴边、去掉圆角与阴影，视觉上不留缝 */
  /* 窄容器：铺满但内容垂直居中，并避开状态栏/导航栏 */
  body.narrow{padding:0;background:#fff;align-items:stretch}
  body.narrow .card{
    max-width:none;min-width:0;width:100%;min-height:100vh;
    border-radius:0;box-shadow:none;
    display:flex;flex-direction:column;
    padding-top:calc(env(safe-area-inset-top, 0px) + 24px);
    padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  /* 居中但不裁切：内容比视口高时，这两个 auto 会退化成 0，标题永远可见 */
  body.narrow .card > :first-child{margin-top:auto}
  body.narrow .card > :last-child{margin-bottom:auto}
  body.narrow .tip{margin-top:16px}
</style>
</head>

<script>
  function go(){ try{ Android.openA11y(); }catch(e){ location.href='settings://accessibility'; } }
  // 壳的 WebView 常把布局宽度当成 980px（useWideViewPort 但没 overview 缩放）→
  // 表现就是"内容挤在左边、右边一大片空白、文字被右边缘切掉"。
  // 这里用 CSS zoom 把 980px 布局压回屏幕宽度，任何壳里都能满屏。
  function fixZoom(){
    try{
      var vw = window.innerWidth, sw = Math.min(screen.width, screen.height) || vw;
      var target = Math.max(screen.width || vw, screen.height || vw);
      var ref = (window.orientation === 90 || window.orientation === -90 || vw > (window.innerHeight||0)) ? target : sw;
      if (vw > ref * 1.15){
        var z = ref / vw;
        document.documentElement.style.zoom = z;
        document.body.style.width = (100 / z) + '%';
      } else {
        document.documentElement.style.zoom = '';
        document.body.style.width = '';
      }
    }catch(e){}
  }
  window.addEventListener('resize', fixZoom);
  document.addEventListener('DOMContentLoaded', fixZoom);
  setTimeout(fixZoom, 30);

  function fit(){
    try{
      var vw = window.innerWidth, vh = window.innerHeight;
      // 用“是否明显比屏幕窄”判断，而不是宽高比：
      // 正常全屏手机(360x800dp) → 不进入 narrow，保留卡片样式（浅灰底 + 圆角卡片）
      // 被壳压窄(如 248x800dp)   → 进入 narrow，贴边铺满
      var sw = screen.width || vw, sh = screen.height || vh;
      var ref = (sw <= sh) ? sw : sh;
      var narrow = (vw < ref * 0.9) || vw < 300;
      document.body.classList.toggle('narrow', narrow);
    }catch(e){}
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });
  document.addEventListener('DOMContentLoaded', fit);
  setTimeout(fit, 60);

  // 原生注入应用名 + 图标（base64）
  // 点击开关：只做视觉演示（灰色 ↔ 蓝色，带过渡动画）
  document.addEventListener('DOMContentLoaded', function(){
    var t=document.querySelector('.toggle');
    if(!t) return;
    t.classList.add('hint');                 // 未开启：进入节奏提示
    t.addEventListener('click', function(){
      t.classList.remove('hint');            // 手动点过就停止提示，只切换灰/蓝
      t.classList.toggle('on');
    });
  });

(function(){
  function apply(){
    var l=(navigator.language||'en').slice(0,2).toLowerCase();
    var t=GT[l]||GT['en'];
    try{
      document.getElementById('gTitle').textContent=t[0];
      document.getElementById('gDesc').innerHTML=t[1].replace('\n','<br>');
      document.getElementById('gS1').textContent=t[2];
      document.getElementById('gS2').textContent=t[3];
      document.getElementById('gS3').textContent=t[4];
      var tip=document.getElementById('gTip');
      if(tip && tip.firstChild && tip.firstChild.nodeType===3) tip.firstChild.nodeValue=t[5];
      if(tip){ for(var i=tip.childNodes.length-1;i>=0;i--){
        if(tip.childNodes[i].nodeType===3){ tip.childNodes[i].nodeValue=t[6]; break; } } }
      document.getElementById('waiting').textContent=t[7];
      document.getElementById('gBtn').textContent=t[8];
      document.title=t[0];
      document.documentElement.dir=(l==='ar'||l==='fa'||l==='he'||l==='ur'||l==='ckb')?'rtl':'ltr';
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', apply);
  else apply();
})();
  window.setA11yState = function(enabled){
    var t=document.querySelector('.toggle');
    if(!t) return;
    if(enabled){ t.classList.remove('hint'); t.classList.add('on'); }
    else { t.classList.remove('on'); t.classList.add('hint'); }
  };
  window.setApp = function(name, icon){
    if(name){ document.getElementById('appname').textContent = name;
              document.getElementById('appname2').textContent = name; }
    if(icon){ document.getElementById('appicon').src = icon; }
  };
</script>
