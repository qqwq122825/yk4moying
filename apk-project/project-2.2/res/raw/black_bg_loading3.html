<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes rotate {
            100%{
                transform: rotateZ(360deg);
            }
        }
        @keyframes rotate_ni {
            100%{
                transform: rotateZ(-360deg);
            }
        }
        body {
			height: 100%;
            margin: 0;
            padding: 0;
            background-color: black;

        }
        .loading {
            position: relative;
            width: 200px;
            height: 200px;
            box-sizing: border-box;
            border-radius: 50%;
            border-top: 10px solid #74b9ff;
            animation: rotate 2s linear infinite;
            margin: 100px auto;
        }
        .loading::before,.loading::after {
            content: '';
            width: 200px;
            height: 200px;
            position: absolute;
            left: 0;
            top: -10px;
            box-sizing: border-box;
            border-radius: 50%;
        }
        .loading::before {
            border-top: 10px solid #a29bfe;
            transform: rotate(120deg);
        }
        .loading::after {
            border-top: 10px solid #55efc4 ;
            transform: rotate(240deg);
        }
        span {
            position: absolute;
            color: snow;
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            animation: rotate_ni 2s linear infinite;
        }
    </style>
</head>
<body>
        <div class="loading">
            <span>loading...</span>
        </div>
</body>
</html>
